<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CrowdDJ Live Display</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { color: #1DB954; font-size: 3rem; margin-bottom: 30px; }
        .queue-container { width: 100%; max-width: 900px; }
        .queue-item {
            display: flex;
            align-items: center;
            background: #181818;
            padding: 15px 25px;
            margin-bottom: 15px;
            border-radius: 12px;
            font-size: 1.5rem;
        }
        .queue-item img { width: 80px; height: 80px; border-radius: 8px; margin-right: 20px; }
        .song-title { font-weight: bold; margin: 0; }
        .song-artist { color: #b3b3b3; font-size: 1.1rem; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>UP NEXT ON CROWDDJ</h1>
    <div id="queue-list" class="queue-container">Loading queue...</div>

    <script>
        async function fetchQueue() {
            try {
                const res = await fetch('/api/queue');
                const data = await res.json();
                const container = document.getElementById('queue-list');
                
                if (!data.queue || data.queue.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888; font-size:1.8rem;">No songs in queue. Request a song!</p>';
                    return;
                }

                container.innerHTML = data.queue.map((track, i) => `
                    <div class="queue-item">
                        <span style="margin-right:20px; color:#1DB954; font-weight:bold;">#${i + 1}</span>
                        <img src="${track.artwork || ''}" alt="art">
                        <div>
                            <p class="song-title">${track.title}</p>
                            <p class="song-artist">${track.artist}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) { console.error(err); }
        }

        fetchQueue();
        setInterval(fetchQueue, 3000);
    </script>
</body>
</html>
