<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --text-muted: #a7a7a7;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h2 {
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-top: 0;
            margin-bottom: 15px;
            border-left: 4px solid var(--spotify-green);
            padding-left: 10px;
        }

        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            border-top: 3px solid var(--spotify-green);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 { margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .status-info p { margin: 4px 0 0 0; font-size: 1.4rem; font-weight: 800; color: var(--spotify-green); }

        .action-block-btn {
            width: 100%;
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            display: block;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: background 0.2s, transform 0.1s;
        }
        .action-block-btn:hover { filter: brightness(1.05); }
        .action-block-btn:active { transform: scale(0.99); }
        
        .playlists-toggle-btn {
            background-color: var(--spotify-green);
            border: none;
            color: white;
        }
