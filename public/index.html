<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Requests</title>
    <style>
        /* Base Spotify Dark Theme Styling */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }

        /* Header Layout */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* Action Buttons */
        .btn-message {
            background-color: #1db954;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-message:hover {
            background-color: #1ed760;
        }

        .btn-message:active {
            transform: scale(0.97);
        }

        .credits-tag {
            background-color: #181818;
            border: 1px solid #282828;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        /* Search Box styling */
        .search-container {
            margin-bottom: 30px;
        }

        .search-bar {
            width: 100%;
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 24px;
            padding: 14px 20px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            box-sizing: border-box;
        }

        .search-bar:focus {
            border-color: #535353;
        }

        /* Section Headings */
        .section-title {
            color: #1db954;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Queue / Results Placeholder Status text */
        .status-text {
            color: #727272;
            text-align: center;
            margin-top: 40px;
            font-style: italic;
            font-size: 15px;
        }

        /* --- Message the DJ Modal Backdrop --- */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Modal Content Box */
        .modal-content {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 16px;
            width: 90%;
            max-width: 440px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .modal-content h2 {
            color: #ffffff;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 700;
        }

        /* Textarea input styled matching screenshot */
        .modal-content textarea {
            width: 100%;
            height: 120px;
            background-color: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #ffffff;
            padding: 14px;
            font-size: 15px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-family: inherit;
        }

        .modal-content textarea:focus {
            border-color: #1db954;
        }

        /* Modal Buttons Layout */
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-actions button {
            font-size: 14px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .modal-actions button:active {
            transform: scale(0.97);
        }

        /* Cancel Button Styles */
        .btn-cancel {
            background-color: #121212;
            color: #a7a7a7;
            border: 1px solid #2a2a2a !important;
        }

        .btn-cancel:hover {
            color: #ffffff;
            background-color: #1a1a1a;
        }

        /* Send Button Styles */
        .btn-send {
            background-color: #1db954;
            color: #ffffff;
        }

        .btn-send:hover {
            background-color: #1ed760;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>Song Requests</h1>
            <div class="header-actions">
                <button id="openModalBtn" class="btn-message">Message the DJ</button>
                <div class="credits-tag">Credits: 3 / 3</div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search for songs or artists...">
        </div>

        <div class="section-title">Live Queue</div>
        <div id="queueContainer">
            <div class="status-text">No songs requested yet. Be the first!</div>
        </div>
    </div>

    <div id="messageModal" class="modal-backdrop" style="display: none;">
        <div class="modal-content">
            <h2>Message the DJ</h2>
            <textarea id="messageInput" placeholder="hello"></textarea>
            <div class="modal-actions">
                <button id="cancelMessageBtn" class="btn-cancel">Cancel</button>
                <button id="sendMessageBtn" class="btn-send">Send Message</button>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const messageModal = document.getElementById('messageModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const cancelMessageBtn = document.getElementById('cancelMessageBtn');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        const messageInput = document.getElementById('messageInput');

        // Show Modal
        openModalBtn.onclick = (e) => {
            e.preventDefault();
            messageInput.value = ''; // Clear previous input text
            messageModal.style.display = 'flex';
        };

        // Close Modal via Cancel Button
        cancelMessageBtn.onclick = () => {
            messageModal.style.display = 'none';
        };

        // Close Modal by clicking the outer dim backdrop
        window.onclick = (event) => {
            if (event.target === messageModal) {
                messageModal.style.display = 'none';
            }
        };

        // Send message handler via REST API API
        sendMessageBtn.onclick = async () => {
            const text = messageInput.value.trim();
            if (!text) return; // Do nothing if input is empty

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                
                if (data.success) {
                    messageModal.style.display = 'none';
                } else {
                    alert(data.error || "Something went wrong.");
                }
            } catch (err) {
                console.error("Error submitting message:", err);
                alert("Failed to deliver message to the server.");
            }
        };
    </script>
</body>
</html>
