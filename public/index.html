<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --text-muted: #a7a7a7;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* Enhanced Green Highlight Header */
        .page-title {
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-left: 4px solid var(--spotify-green);
            padding-left: 12px;
        }

        /* Status Card with Green Borders and Typography */
        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            border-top: 3px solid var(--spotify-green); /* Top accent line */
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.05);
        }

        .status-info h3 { 
            margin: 0; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        
        /* Vibrant green stats indicators */
        .status-info p { 
            margin: 6px 0 0 0; 
            font-size: 1.6rem; 
            font-weight: 800; 
            color: var(--spotify-green); 
        }

        .search-box {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 14px;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .search-box:focus { 
            border-color: var(--spotify-green); 
            box-shadow: 0 0 8px rgba(29, 185, 84, 0.2);
        }

        .track-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--panel-bg);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #222;
            transition: background-color 0.2s ease;
        }
        .track-row:hover {
            background-color: #202020;
        }

        .track-details { display: flex; align-items: center; gap: 12px; }
        .track-details img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; }
        .track-title { font-weight: 700; margin: 0; font-size: 1rem; }
        .track-artist { color: var(--text-muted); margin: 2px 0 0 0; font-size: 0.85rem; }
