<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --text-muted: #a7a7a7;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        /* 🟢 Subtle Green Left Accent Border for Title */
        h2 {
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-bottom: 15px;
            border-left: 4px solid var(--spotify-green);
            padding-left: 10px;
        }

        /* 🟢 Top Border Accent Line Added to Status Card */
        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            border-top: 3px solid var(--spotify-green);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 { margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        
        /* 🟢 Turned numbers green to draw the eye */
        .status-info p { margin: 4px 0 0 0; font-size: 1.4rem; font-weight: 800; color: var(--spotify-green); }

        .search-box {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 14px;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }
        .search-box:focus { border-color: var(--spotify-green); }

        /* Shared row style for uniform layout between playlists and tracks */
        .track-row, .playlist-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--panel-bg);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .playlist-row { cursor: pointer; transition: background 0.2s; }
        .playlist-row:hover { background: #202020; }

        .track-details { display: flex; align-items: center; gap: 12px; }
        .track-details img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
        .track-title { font-weight: 700; margin: 0; font-size: 1rem; color: white; }
        .track-artist { color: var(--text-muted); margin: 2px 0 0 0; font-size: 0.85rem; }

        .view-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 10px 0;
        }

        .back-btn {
            background-color: #282828;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-btn:hover { background-color: #333; }

        .req-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .req-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        
        /* 🔌 Spotify Brand Connect Button Container */
        .auth-container {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--panel-bg);
            border: 1px solid #222;
            border-radius: 8px;
            margin-top: 20px;
        }

        .connect-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .connect-btn:hover {
            background-color: #1ed760;
            transform: scale(1.02);
        }
        
        .empty-msg { color: var(--text-muted); font-size: 0.9rem; padding: 15px 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Request a Song</h2>
        
        <div class="status-card">
            <div class="status-info">
                <h3>Your Credits</h3>
                <p id="credits-display">3 / 3</p>
            </div>
            <div class="status-info" style="text-align: right;">
                <h3>Next Credit In</h3>
                <p id="timer-display">MAX</p>
            </div>
        </div>

        <input type="text" id="search-input" class="search-box" placeholder="Search tracks, artists..." oninput="searchSongs()">
        
        <div id="dynamic-display-zone">
            <div class="view-section-title">
                <h3 id="view-title-header" style="margin:0; font-size: 1.1rem; letter-spacing: -0.3px; text-transform: uppercase;">Your Playlists</h3>
            </div>
            <div id="results-list"></div>
        </div>
    </div>

    <script>
        let maxCredits = 3;
        let localCredits = parseInt(localStorage.getItem('dj_user_credits'));
        let lastRegenTime = parseInt(localStorage.getItem('dj_last_regen'));
        let regenIntervalLength = 60; 
        let systemRequestsOpen = true;
        let userAccessToken = "";

        if (isNaN(localCredits) || isNaN(lastRegenTime) || localCredits === null || lastRegenTime === null) {
            localCredits = maxCredits;
            lastRegenTime = Date.now();
            localStorage.setItem('dj_user_credits', localCredits);
            localStorage.setItem('dj_last_regen', lastRegenTime);
        }

        function parseAuthToken() {
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('access_token');
            if (tokenFromUrl) {
                userAccessToken = tokenFromUrl;
                localStorage.setItem('user_token', tokenFromUrl);
                window.history.pushState({}, document.title, "/");
            } else {
                userAccessToken = localStorage.getItem('user_token');
            }
        }

        async function syncWithServer() {
            try {
                const res = await fetch('/data');
                if (!res.ok) return;
                const data = await res.json();

                maxCredits = data.maxCredits;
                regenIntervalLength = data.countdownLength;
                systemRequestsOpen = data.requestsAllowed;

                if (localCredits > maxCredits) {
                    localCredits = maxCredits;
                    localStorage.setItem('dj_user_credits', localCredits);
                }
                
                updateUI();
            } catch (e) {
                console.log("Sync error.");
            }
        }

        function handleCreditCalculations() {
            if (localCredits >= maxCredits) {
                document.getElementById('timer-display').innerText = "MAX";
                lastRegenTime = Date.now();
                localStorage.setItem('dj_last_regen', lastRegenTime);
                return;
            }

            const now = Date.now();
            const elapsedSeconds = Math.floor((now - lastRegenTime) / 1000);
            
            if (elapsedSeconds >= regenIntervalLength) {
                const creditsToGain = Math.floor(elapsedSeconds / regenIntervalLength);
                localCredits = Math.min(maxCredits, localCredits + creditsToGain);
                lastRegenTime = lastRegenTime + (creditsToGain * regenIntervalLength * 1000);
                
                localStorage.setItem('dj_user_credits', localCredits);
                localStorage.setItem('dj_last_regen', lastRegenTime);
            }

            const remainingSeconds = regenIntervalLength - (Math.floor((Date.now() - lastRegenTime) / 1000) % regenIntervalLength);
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            
            document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            updateUI();
        }

        function updateUI() {
            document.getElementById('credits-display').innerText = `${localCredits} / ${maxCredits}`;
            const inputs = document.getElementById('search-input');
            if (!systemRequestsOpen) {
                inputs.placeholder = "Submissions are currently CLOSED by the DJ";
                inputs.disabled = true;
            } else {
                if (!inputs.disabled && !inputs.value.trim() && !document.getElementById('back-to-playlists-btn')) {
                    inputs.placeholder = "Search tracks, artists... (Clear search to go back)";
                }
            }
        }

        function showAuthScreen() {
            document.getElementById('search-input').style.display = 'none';
            document.getElementById('view-title-header').innerText = "AUTHENTICATION REQUIRED";
            document.getElementById('results-list').innerHTML = `
                <div class="auth-container">
                    <p style="margin: 0 0 15px 0; color: var(--text-muted); line-height: 1.4;">Your music dashboard session has expired or is invalid. Please link your host Spotify player account.</p>
                    <a class="connect-btn" href="/api/login">Connect Spotify</a>
                </div>
            `;
        }

        // 📂 FETCH PLAYLIST FOLDERS
        async function fetchUserPlaylists() {
            const listContainer = document.getElementById('results-list');
            if (!userAccessToken) {
                showAuthScreen();
                return;
            }

            try {
                const res = await fetch('/api/playlists', {
                    headers: { 'user-token': userAccessToken }
                });
                
                if (res.status === 401 || res.status === 403) {
                    showAuthScreen();
                    return;
                }
                
                const playlists = await res.json();

                document.getElementById('search-input').style.display = 'block';
                document.getElementById('dynamic-display-zone').firstElementChild.innerHTML = `
                    <h3 id="view-title-header" style="margin:0; font-size: 1.1rem; letter-spacing: -0.3px; text-transform: uppercase;">Your Playlists</h3>
                `;

                if (!playlists || playlists.length === 0) {
                    listContainer.innerHTML = '<p class="empty-msg">No playlists found on this account.</p>';
                    return;
                }

                listContainer.innerHTML = playlists.map(playlist => {
                    const artwork = playlist.artwork || playlist.images?.[0]?.url || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=100&auto=format&fit=crop';
                    const name = playlist.name || 'Unnamed Playlist';
                    const trackCount = playlist.trackCount !== undefined ? playlist.trackCount : (playlist.tracks?.total || 0);

                    return `
                        <div class="playlist-row" onclick="fetchPlaylistTracks('${playlist.id}', '${name.replace(/'/g, "\\'")}')">
                            <div class="track-details">
                                <img src="${artwork}">
                                <div>
                                    <p class="track-title">${name}</p>
                                    <p class="track-artist">${trackCount} Tracks</p>
                                </div>
                            </div>
                            <div style="color: var(--text-muted); font-weight: bold; font-size: 1.1rem; padding-right: 5px;">➔</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                showAuthScreen();
            }
        }

        // 🎵 FETCH TRACKS INSIDE A PLAYLIST
        async function fetchPlaylistTracks(playlistId, playlistName) {
            const listContainer = document.getElementById('results-list');
            const searchBar = document.getElementById('search-input');
            
            searchBar.value = '';
            searchBar.placeholder = "Search locked in playlist view (clear search to unlock)";

            document.getElementById('dynamic-display-zone').firstElementChild.innerHTML = `
                <h3 style="margin:0; font-size: 1.1rem; letter-spacing: -0.3px; text-transform: uppercase;">${playlistName}</h3>
                <button id="back-to-playlists-btn" class="back-btn" onclick="clearPlaylistView()">◀ Back</button>
            `;

            listContainer.innerHTML = '<p class="empty-msg">Loading playlist songs...</p>';

            try {
                const res = await fetch(`/api/playlists/${playlistId}/tracks`, {
                    headers: { 'user-token': userAccessToken }
                });

                if (res.status === 401 || res.status === 403) {
                    showAuthScreen();
                    return;
                }

                const rawData = await res.json();
                
                // Extract track array handling both clean custom models and raw Spotify paging collection structures
                let tracksArray = Array.isArray(rawData) ? rawData : (rawData.items || []);

                if (!tracksArray || tracksArray.length === 0) {
                    listContainer.innerHTML = '<p class="empty-msg">No playable tracks found inside this playlist.</p>';
                    return;
                }

                renderTrackRows(tracksArray);
            } catch (e) {
                listContainer.innerHTML = '<p class="empty-msg">Failed to load songs from playlist.</p>';
            }
        }

        function clearPlaylistView() {
            const searchBar = document.getElementById('search-input');
            searchBar.placeholder = "Search tracks, artists...";
            fetchUserPlaylists();
        }

        // 🔍 ENGINE SEARCH CONTROL
        let searchTimeout;
        function searchSongs() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();
            
            if (!query) { 
                fetchUserPlaylists(); 
                return; 
            }

            document.getElementById('dynamic-display-zone').firstElementChild.innerHTML = `
                <h3 style="margin:0; font-size: 1.1rem; letter-spacing: -0.3px; text-transform: uppercase;">Search Results</h3>
            `;

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                        headers: { 'user-token': userAccessToken }
                    });
                    
                    if (res.status === 401 || res.status === 403) {
                        showAuthScreen();
                        return;
                    }

                    const data = await res.json();
                    let tracks = data.tracks || [];
                    if (!Array.isArray(tracks) && data.tracks?.items) {
                        tracks = data.tracks.items;
                    }
                    
                    if (tracks.length === 0) {
                        document.getElementById('results-list').innerHTML = '<p class="empty-msg">No matching tracks found.</p>';
                        return;
                    }

                    renderTrackRows(tracks);
                } catch (e) { console.log("Search error."); }
            }, 300);
        }

        // 🖼️ UNIVERSAL PARSER ENGINE FOR TRACK ROW RENDERING
        function renderTrackRows(tracks) {
            document.getElementById('results-list').innerHTML = tracks.map(item => {
                // Handle nested track mappings if retrieved directly from raw Spotify playlist paging models
                const track = item.track ? item.track : item;
                
                // Safe property fallback checking logic
                const id = track.id || '';
                const name = track.name || 'Unknown Title';
                const artistName = track.artist || track.artists?.[0]?.name || 'Unknown Artist';
                const artworkUrl = track.artwork || track.album?.images?.[0]?.url || 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=100&auto=format&fit=crop';
                
                // Re-normalize clean layout payload object
                const unifiedTrack = {
                    id: id,
                    name: name,
                    artist: artistName,
                    artwork: artworkUrl
                };

                return `
                    <div class="track-row">
                        <div class="track-details">
                            <img src="${artworkUrl}" alt="${name}">
                            <div>
                                <p class="track-title">${name}</p>
                                <p class="track-artist">${artistName}</p>
                            </div>
                        </div>
                        <button class="req-btn" ${localCredits <= 0 || !systemRequestsOpen ? 'disabled' : ''} onclick="submitRequest(${JSON.stringify(unifiedTrack).replace(/"/g, '&quot;')})">Request</button>
                    </div>
                `;
            }).join('');
        }

        async function submitRequest(track) {
            if (localCredits <= 0 || !systemRequestsOpen) return;

            const res = await fetch('/api/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track })
            });

            if (res.ok) {
                localCredits--;
                if (localCredits === maxCredits - 1) {
                    lastRegenTime = Date.now();
                    localStorage.setItem('dj_last_regen', lastRegenTime);
                }
                localStorage.setItem('dj_user_credits', localCredits);
                alert(`"${track.name}" submitted successfully!`);
                
                document.getElementById('search-input').value = '';
                clearPlaylistView();
            } else {
                const errData = await res.json();
                alert(errData.error || "Submission failed.");
            }
        }

        parseAuthToken();
        setInterval(handleCreditCalculations, 1000);
        setInterval(syncWithServer, 5000);
        syncWithServer();
        fetchUserPlaylists();
    </script>
</body>
</html>
