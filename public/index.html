<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --text-muted: #a7a7a7;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h2 {
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-top: 0;
            margin-bottom: 15px;
            border-left: 4px solid var(--spotify-green);
            padding-left: 10px;
        }

        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            border-top: 3px solid var(--spotify-green);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 { margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .status-info p { margin: 4px 0 0 0; font-size: 1.4rem; font-weight: 800; color: var(--spotify-green); }

        .action-block-btn {
            width: 100%;
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            display: block;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: background 0.2s, transform 0.1s;
        }
        .action-block-btn:hover { filter: brightness(1.05); }
        .action-block-btn:active { transform: scale(0.99); }
        
        /* 🟢 FIXED: "My Playlists" button style matches brand colors perfectly */
        .playlists-toggle-btn {
            background-color: var(--spotify-green);
            border: none;
            color: white;
        }
        .playlists-toggle-btn:hover { filter: brightness(1.08); }

        .back-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
        }
        .back-btn:hover { background-color: #444; }

        .search-box {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 14px;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
        }
        .search-box:focus { border-color: var(--spotify-green); }

        .playlist-row-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: var(--panel-bg);
            border: 1px solid #222;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .playlist-row-item:hover { background-color: var(--card-bg); border-color: #444; }
        .playlist-row-item img { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; }
        .playlist-info-meta { flex-grow: 1; min-width: 0; }
        .playlist-name { font-size: 0.95rem; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-tracks-count { font-size: 0.8rem; color: var(--text-muted); margin: 3px 0 0 0; }

        .track-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--panel-bg);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .track-details { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .track-details img { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
        .track-meta-text { min-width: 0; overflow: hidden; }
        .track-title { font-weight: 700; margin: 0; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { color: var(--text-muted); margin: 2px 0 0 0; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .req-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            flex-shrink: 0;
            margin-left: 10px;
        }
        .req-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        
        .section-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            margin-top: 5px;
        }
        h3.section-label { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.75px; margin: 0; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Request a Song</h2>
        
        <div class="status-card">
            <div class="status-info">
                <h3>Your Credits</h3>
                <p id="credits-display">3 / 3</p>
            </div>
            <div class="status-info" style="text-align: right;">
                <h3>Next Credit In</h3>
                <p id="timer-display">MAX</p>
            </div>
        </div>

        <div id="auth-placement-zone">
            <a href="/api/login" id="connect-spotify-btn" class="action-block-btn">Connect Spotify</a>
            <button id="my-playlists-btn" class="action-block-btn playlists-toggle-btn" style="display: none;" onclick="togglePlaylistsView()">My Playlists</button>
        </div>

        <div id="search-box-wrapper">
            <input type="text" id="search-input" class="search-box" placeholder="Search tracks, artists..." oninput="searchSongs()">
        </div>

        <div id="dynamic-content-area">
            <div class="section-header-container">
                <h3 class="section-label" id="content-view-title">Global Search</h3>
                <div id="view-action-slot"></div>
            </div>
            <div id="content-target-list"></div>
        </div>
    </div>

    <script>
        let maxCredits = 3;
        let localCredits = parseInt(localStorage.getItem('dj_user_credits'));
        let lastRegenTime = parseInt(localStorage.getItem('dj_last_regen'));
        let regenIntervalLength = 60; 
        let systemRequestsOpen = true;
        let currentView = "search"; 
        let savedPlaylistsHTML = ""; 
        
        const urlParams = new URLSearchParams(window.location.search);
        let userAccessToken = urlParams.get('access_token');
        
        if (userAccessToken) {
            localStorage.setItem('dj_spotify_user_token', userAccessToken);
            window.history.replaceState({}, document.title, "/");
        } else {
            userAccessToken = localStorage.getItem('dj_spotify_user_token');
        }

        if (isNaN(localCredits) || isNaN(lastRegenTime) || localCredits === null || lastRegenTime === null) {
            localCredits = maxCredits;
            lastRegenTime = Date.now();
            localStorage.setItem('dj_user_credits', localCredits);
            localStorage.setItem('dj_last_regen', lastRegenTime);
        }

        async function syncWithServer() {
            try {
                const res = await fetch('/data');
                if (!res.ok) return;
                const data = await res.json();

                maxCredits = data.maxCredits;
                regenIntervalLength = data.countdownLength;
                systemRequestsOpen = data.requestsAllowed;

                if (localCredits > maxCredits) {
                    localCredits = maxCredits;
                    localStorage.setItem('dj_user_credits', localCredits);
                }
                updateUIState();
            } catch (e) { console.log("Sync error."); }
        }

        function handleCreditCalculations() {
            if (localCredits >= maxCredits) {
                document.getElementById('timer-display').innerText = "MAX";
                lastRegenTime = Date.now();
                localStorage.setItem('dj_user_credits', localCredits);
                localStorage.setItem('dj_last_regen', lastRegenTime);
                return;
            }

            const now = Date.now();
            const elapsedSeconds = Math.floor((now - lastRegenTime) / 1000);
            
            if (elapsedSeconds >= regenIntervalLength) {
                const creditsToGain = Math.floor(elapsedSeconds / regenIntervalLength);
                localCredits = Math.min(maxCredits, localCredits + creditsToGain);
                lastRegenTime = lastRegenTime + (creditsToGain * regenIntervalLength * 1000);
                
                localStorage.setItem('dj_user_credits', localCredits);
                localStorage.setItem('dj_last_regen', lastRegenTime);
            }

            const remainingSeconds = regenIntervalLength - (Math.floor((Date.now() - lastRegenTime) / 1000) % regenIntervalLength);
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            
            document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            updateUIState();
        }

        function updateUIState() {
            document.getElementById('credits-display').innerText = `${localCredits} / ${maxCredits}`;
            const searchField = document.getElementById('search-input');
            
            if (!systemRequestsOpen) {
                searchField.placeholder = "Submissions are currently CLOSED by the DJ";
                searchField.disabled = true;
                document.getElementById('auth-placement-zone').style.display = 'none';
                document.getElementById('content-target-list').innerHTML = '';
                return;
            }

            searchField.disabled = false;

            if (userAccessToken) {
                document.getElementById('connect-spotify-btn').style.display = 'none';
                document.getElementById('my-playlists-btn').style.display = 'block';
            } else {
                document.getElementById('connect-spotify-btn').style.display = 'block';
                document.getElementById('my-playlists-btn').style.display = 'none';
            }
        }

        async function togglePlaylistsView() {
            const targetList = document.getElementById('content-target-list');
            document.getElementById('search-input').value = ""; 
            currentView = "playlists";
            document.getElementById('content-view-title').innerText = "Your Playlists";
            document.getElementById('view-action-slot').innerHTML = "";

            if (savedPlaylistsHTML) {
                targetList.innerHTML = savedPlaylistsHTML;
                return;
            }

            targetList.innerHTML = `<p style="color:#666; font-style:italic; padding:40px 0; text-align:center;">Loading your Spotify playlists...</p>`;
            
            try {
                const res = await fetch('/api/playlists', {
                    headers: { 'user-token': userAccessToken }
                });
                
                if (res.status === 401) { logoutExpiredSession(); return; }
                const playlists = await res.json();
                
                if (!playlists || playlists.length === 0) {
                    targetList.innerHTML = `<p style="color:#666; font-style:italic; padding:40px 0; text-align:center;">No playlists found on this account.</p>`;
                    return;
                }
                
                savedPlaylistsHTML = playlists.map(pl => `
                    <div class="playlist-row-item" onclick="loadPlaylistTracks('${pl.id}', '${pl.name.replace(/'/g, "\\'")}')">
                        <img src="${pl.images?.[0]?.url || 'https://picsum.photos/150'}">
                        <div class="playlist-info-meta">
                            <p class="playlist-name">${pl.name}</p>
                            <p class="playlist-tracks-count">${pl.tracks?.total || 0} Tracks</p>
                        </div>
                    </div>
                `).join('');
                
                targetList.innerHTML = savedPlaylistsHTML;
            } catch(e) { 
                targetList.innerHTML = `<p style="color:red; font-style:italic; padding:40px 0; text-align:center;">Failed loading playlists.</p>`;
            }
        }

        async function loadPlaylistTracks(id, playlistName) {
            try {
                const targetList = document.getElementById('content-target-list');
                targetList.innerHTML = `<p style="color:#666; font-style:italic; padding:40px 0; text-align:center;">Loading playlist items...</p>`;
                
                const res = await fetch(`/api/playlists/${id}/tracks`, {
                    headers: { 'user-token': userAccessToken }
                });
                const tracks = await res.json();
                
                currentView = "playlist_tracks";
                document.getElementById('content-view-title').innerText = `${playlistName}`;
                document.getElementById('view-action-slot').innerHTML = `<button class="back-btn" onclick="togglePlaylistsView()">◀ Back</button>`;
                
                if(tracks.length === 0) {
                    targetList.innerHTML = `<p style="color:#666; font-style:italic; padding:20px 0; text-align:center;">This playlist has no songs.</p>`;
                } else {
                    targetList.innerHTML = generateTrackRowsHTML(tracks);
                }
            } catch(e) { console.log("Track list parsing error."); }
        }

        function revertToGlobalSearchMode() {
            currentView = "search";
            document.getElementById('content-view-title').innerText = "Global Search";
            document.getElementById('view-action-slot').innerHTML = "";
            document.getElementById('content-target-list').innerHTML = '';
        }

        let searchTimeout;
        function searchSongs() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();
            
            if (!query) { 
                revertToGlobalSearchMode();
                return; 
            }

            currentView = "search";
            document.getElementById('content-view-title').innerText = "Global Search Matches";
            document.getElementById('view-action-slot').innerHTML = "";

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                        headers: { 'user-token': userAccessToken || "" }
                    });
                    const data = await res.json();
                    if (document.getElementById('search-input').value.trim() !== "") {
                        document.getElementById('content-target-list').innerHTML = generateTrackRowsHTML(data.tracks || []);
                    }
                } catch (e) { console.log("Search error."); }
            }, 300);
        }

        function generateTrackRowsHTML(tracks) {
            return tracks.map(track => `
                <div class="track-row">
                    <div class="track-details">
                        <img src="${track.artwork}">
                        <div class="track-meta-text">
                            <p class="track-title">${track.name}</p>
                            <p class="track-artist">${track.artist}</p>
                        </div>
                    </div>
                    <button class="req-btn" ${localCredits <= 0 || !systemRequestsOpen ? 'disabled' : ''} onclick="submitRequest(${JSON.stringify(track).replace(/"/g, '"')})">Request</button>
                </div>
            `).join('');
        }

        async function submitRequest(track) {
            if (localCredits <= 0 || !systemRequestsOpen) return;

            const res = await fetch('/api/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track })
            });

            if (res.ok) {
                localCredits--;
                if (localCredits === maxCredits - 1) {
                    lastRegenTime = Date.now();
                    localStorage.setItem('dj_last_regen', lastRegenTime);
                }
                localStorage.setItem('dj_user_credits', localCredits);
                alert(`"${track.name}" added to the queue!`);
                
                if (currentView === "playlist_tracks") {
                     updateUIState(); 
                } else {
                    document.getElementById('search-input').value = "";
                    revertToGlobalSearchMode();
                }
            } else {
                const errData = await res.json();
                alert(errData.error || "Submission failed.");
            }
        }

        function logoutExpiredSession() {
            localStorage.removeItem('dj_spotify_user_token');
            userAccessToken = null;
            window.location.reload();
        }

        setInterval(handleCreditCalculations, 1000);
        setInterval(syncWithServer, 5000);
        syncWithServer();
    </script>
</body>
</html>
