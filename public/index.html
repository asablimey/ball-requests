<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Song Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --spotify-dark-grey: #181818;
            --spotify-light-grey: #282828;
        }

        * { box-sizing: border-box; }

        body { 
            background: linear-gradient(180deg, #191919 0%, var(--spotify-black) 100%);
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 15px; 
        }

        .container { 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
        }

        .logo-area { margin-bottom: 25px; }

        h1 { 
            color: white; 
            font-size: clamp(2rem, 6vw, 2.8rem); 
            margin: 0 0 10px 0; 
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Upgraded Dashboard Credit Stats Counter */
        .credit-badge-container {
            background-color: var(--spotify-dark-grey);
            border: 1px solid #252525;
            padding: 15px 20px;
            border-radius: 14px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .credit-title { font-weight: 700; font-size: 1.05rem; margin: 0; }
        .credit-count { color: var(--spotify-green); font-size: 1.3rem; font-weight: 800; }
        .credit-timer { color: #888; font-size: 0.85rem; margin-top: 4px; }

        .search-box { 
            width: 100%; 
            padding: 20px 24px; 
            border-radius: 50px; 
            border: 1px solid transparent; 
            background-color: var(--spotify-light-grey); 
            color: white; 
            font-size: 1.15rem; 
            outline: none; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .search-box:focus { 
            border-color: var(--spotify-green); 
            background-color: #333333;
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.35);
        }

        .results-list { list-style: none; padding: 0; width: 100%; text-align: left; margin: 20px 0 0 0; }

        .song-item { 
            display: flex; 
            align-items: center; 
            background: var(--spotify-dark-grey); 
            padding: 14px; 
            margin-bottom: 12px; 
            border-radius: 14px; 
            justify-content: space-between; 
            border: 1px solid #222;
        }

        .song-info { display: flex; align-items: center; gap: 16px; overflow: hidden; }
        .song-info img { border-radius: 6px; width: 56px; height: 56px; object-fit: cover; flex-shrink: 0; }
        .text-details { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .title { font-weight: 700; font-size: 1.1rem; margin: 0; color: #fff; }
        .artist { color: #b3b3b3; font-size: 0.9rem; margin: 5px 0 0 0; }

        .req-btn { 
            background-color: var(--spotify-green); 
            color: white; 
            border: none; 
            padding: 12px 22px; 
            border-radius: 50px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 0.95rem; 
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .req-btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status-msg { 
            font-size: 1.3rem; 
            color: #b3b3b3; 
            display: none; 
            background: var(--spotify-dark-grey);
            padding: 50px 20px;
            border-radius: 16px;
            border: 1px solid #222;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <h1>Song Requests</h1>
        </div>

        <div class="credit-badge-container">
            <div>
                <p class="credit-title">Your Available Requests</p>
                <div id="regen-timer-text" class="credit-timer">All credits loaded</div>
            </div>
            <div id="credit-display" class="credit-count">- / -</div>
        </div>
        
        <div id="active-ui">
            <input type="text" id="search-input" class="search-box" placeholder="Search song or artist...">
            <ul id="results" class="results-list"></ul>
        </div>
        
        <div id="closed-ui" class="status-msg">🔒<br><br>Requests are closed right now.</div>
    </div>

    <script>
        // Generate or pull a locked identifier token unique to this specific device browser
        if (!localStorage.getItem('ball_user_token')) {
            localStorage.setItem('ball_user_token', 'user_' + Math.random().toString(36).substr(2, 9));
        }
        const userToken = localStorage.getItem('ball_user_token');

        const searchInput = document.getElementById('search-input');
        const resultsList = document.getElementById('results');
        let currentCredits = 0;
        let countdownTimer = 0;
        let countdownInterval = null;

        async function fetchSystemSync() {
            try {
                const res = await fetch('/api/status', { headers: { 'user-token': userToken } });
                const data = await res.json();
                
                if(!data.requestsAllowed) {
                    document.getElementById('active-ui').style.display = 'none';
                    document.getElementById('closed-ui').style.display = 'block';
                } else {
                    document.getElementById('active-ui').style.display = 'block';
                    document.getElementById('closed-ui').style.display = 'none';
                }

                currentCredits = data.userCredits;
                document.getElementById('credit-display').innerText = `${currentCredits} / ${data.maxCredits}`;
                
                countdownTimer = data.nextRegenIn;
                startVisualCountdown(data.userCredits === data.maxCredits);
            } catch (e) { console.log("Sync error"); }
        }

        function startVisualCountdown(isMaxed) {
            clearInterval(countdownInterval);
            const timerLabel = document.getElementById('regen-timer-text');
            
            if (isMaxed) {
                timerLabel.innerText = "Full Credits";
                return;
            }

            function updateClockString() {
                if (countdownTimer <= 0) {
                    timerLabel.innerText = "Syncing credit refresh...";
                    fetchSystemSync();
                    return;
                }
                timerLabel.innerText = `Next credit loads in ${countdownTimer}s`;
                countdownTimer--;
            }
            
            updateClockString();
            countdownInterval = setInterval(updateClockString, 1000);
        }

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if(query.length < 2) { resultsList.innerHTML = ''; return; }
            
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const tracks = await res.json();
            
            resultsList.innerHTML = tracks.map(track => `
                <li class="song-item">
                    <div class="song-info">
                        <img src="${track.artwork}">
                        <div class="text-details">
                            <p class="title">${track.title}</p>
                            <p class="artist">${track.artist}</p>
                        </div>
                    </div>
                    <button class="req-btn" ${currentCredits < 1 ? 'disabled' : ''} onclick="requestSong('${track.title.replace(/'/g, "\\'")}', '${track.artist.replace(/'/g, "\\'")}', '${track.artwork}')">
                        ${currentCredits < 1 ? 'Locked' : 'Request'}
                    </button>
                </li>
            `).join('');
        });

        async function requestSong(title, artist, artwork) {
            if(currentCredits < 1) return alert("You have run out of request credits!");
            
            const res = await fetch('/api/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'user-token': userToken },
                body: JSON.stringify({ title, artist, artwork })
            });
            if(res.ok) {
                alert(`"${title}" sent to the DJ!`);
                searchInput.value = '';
                resultsList.innerHTML = '';
                fetchSystemSync();
            } else {
                alert('Request failed. You might be out of credits.');
            }
        }

        setInterval(fetchSystemSync, 10000); // Global state update loop
        fetchSystemSync();
    </script>
</body>
</html>
