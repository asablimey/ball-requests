<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdDJ</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --red-action: #e91429;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 800; }

        .credits-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .credits-display {
            background-color: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            border: 1px solid #282828;
            white-space: nowrap;
        }

        .countdown-display {
            font-size: 0.85rem;
            color: #a7a7a7;
            font-weight: 600;
            margin-right: 10px;
            display: none;
        }

        .search-box {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid #333;
            padding: 14px 20px;
            color: white;
            border-radius: 50px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 25px;
            transition: all 0.2s ease;
        }
        .search-box:focus { border-color: var(--spotify-green); }
        
        /* Disabled search state styling */
        .search-box:disabled {
            background-color: #111;
            border-color: #222;
            color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--spotify-green);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .song-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #2c2c2c;
            gap: 16px;
            box-sizing: border-box;
            width: 100%;
        }

        .song-details {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .song-details img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .text-block {
            flex: 1;
            min-width: 0;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .song-title {
            font-weight: 700;
            margin: 0;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .explicit-badge {
            background-color: #7f7f7f;
            color: var(--spotify-black);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .song-artist {
            color: #a7a7a7;
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .vote-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 34px;
        }

        .vote-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        .vote-btn:active { transform: scale(0.8); }

        .vote-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke-width: 2;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .vote-btn-up svg { stroke: #666; }
        .vote-btn-down svg { stroke: #666; }

        .vote-node.user-voted-up .vote-btn-up svg { stroke: var(--spotify-green); fill: var(--spotify-green); }
        .vote-node.user-voted-down .vote-btn-down svg { stroke: var(--red-action); fill: var(--red-action); }

        .vote-count {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 4px;
            color: #a7a7a7;
            text-align: center;
        }
        .user-voted-up .vote-count { color: var(--spotify-green); }
        .user-voted-down .vote-count { color: var(--red-action); }

        .btn-request {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s ease;
        }
        .btn-request:active { transform: scale(0.95); }

        .empty-placeholder { color: #666; font-style: italic; text-align: center; padding: 20px 0; }

        /* --- Name entry modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px; box-sizing: border-box;
        }
        .modal-box {
            background: var(--panel-bg); border: 1px solid #282828; border-radius: 16px; padding: 32px;
            max-width: 340px; width: 100%; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .modal-box h2 { margin: 0 0 8px 0; font-size: 1.4rem; }
        .modal-box p { color: #a7a7a7; font-size: 0.9rem; margin: 0 0 20px 0; }
        .modal-input {
            width: 100%; background: var(--card-bg); border: 1px solid #333; padding: 12px;
            color: white; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none;
            text-align: center; margin-bottom: 15px;
        }
        .modal-input:focus { border-color: var(--spotify-green); }
        .modal-btn {
            background: var(--spotify-green); color: white; border: none; padding: 12px 24px;
            border-radius: 50px; font-weight: 700; cursor: pointer; width: 100%; font-size: 1rem;
        }

        /* --- Spotify connect button + browse panel --- */
        .spotify-connect-btn {
            display: inline-flex; align-items: center; gap: 6px; background: transparent;
            border: 1px solid var(--spotify-green); color: var(--spotify-green); padding: 8px 16px;
            border-radius: 50px; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
        }
        .spotify-connect-btn:hover { background: var(--spotify-green); color: white; }
        .spotify-connect-btn.is-connected { background: var(--spotify-green); color: white; }

        .spotify-panel {
            background: var(--panel-bg); border: 1px solid #282828; border-radius: 12px;
            padding: 18px; margin-bottom: 25px;
        }
        .spotify-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .spotify-panel-header h3 { margin: 0; font-size: 1rem; color: var(--spotify-green); }
        .spotify-panel-header button {
            background: none; border: none; color: #a7a7a7; cursor: pointer; font-size: 0.8rem;
            text-decoration: underline;
        }
        .playlist-row {
            display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 8px; cursor: pointer;
        }
        .playlist-row:hover { background: var(--card-bg); }
        .playlist-row img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
        .playlist-row .pl-name { font-weight: 700; font-size: 0.9rem; }
        .playlist-row .pl-count { color: #a7a7a7; font-size: 0.78rem; }
        .back-link { color: var(--spotify-green); cursor: pointer; font-size: 0.85rem; margin-bottom: 10px; display: inline-block; }

        @media (max-width: 400px) {
            .song-row { padding: 10px; gap: 10px; }
            .btn-request { padding: 8px 14px; font-size: 0.8rem; }
            .credits-container { align-items: center; width: 100%; }
        }
    </style>
</head>
<body>

    <div id="name-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h2>What's your name?</h2>
            <p>So the DJ knows who requested what. This won't be shown to other guests.</p>
            <input type="text" id="name-modal-input" class="modal-input" placeholder="Your name" maxlength="40" onkeydown="if(event.key === 'Enter') saveGuestName()">
            <button class="modal-btn" onclick="saveGuestName()">Continue</button>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Song Requests</h1>
            <div class="credits-container">
                <button id="spotify-connect-btn" class="spotify-connect-btn" onclick="handleSpotifyConnectClick()">Connect Spotify</button>
                <div id="credits-status" class="credits-display">Credits: -- / --</div>
                <div id="countdown-status" class="countdown-display">Regen in: --s</div>
            </div>
        </div>

        <div id="spotify-panel" class="spotify-panel" style="display:none;">
            <div class="spotify-panel-header">
                <h3 id="spotify-panel-title">Your Playlists</h3>
                <button onclick="disconnectGuestSpotify()">Disconnect</button>
            </div>
            <div id="spotify-panel-body"><p class="empty-placeholder">Loading…</p></div>
        </div>

        <input type="text" id="search-input" class="search-box" placeholder="Search for songs or artists..." oninput="executeSearch()">

        <div class="section-title" id="list-title">Live Queue</div>
        <div id="main-display-list"></div>
    </div>

    <script>
        let availableCredits = 3;
        let maxCredits = 3;
        let searchTimeout = null;
        let timeRemaining = 60;
        let countdownTimer = null;
        let currentServerDuration = 60;
        let globalSearchResults = [];
        let systemRequestsAllowed = true; // Local tracker for global toggling

        if (!localStorage.getItem('voterSignatureToken')) {
            localStorage.setItem('voterSignatureToken', 'voter_' + Math.random().toString(36).substr(2, 9));
        }
        const voterSignatureToken = localStorage.getItem('voterSignatureToken');

        // --- Guest name capture ---
        // Shown once per browser on first visit. Only used to label requests for the DJ;
        // never sent back to other guests or shown on the live queue.
        function getGuestName() { return localStorage.getItem('guestDisplayName') || ''; }

        function showNameModalIfNeeded() {
            if (!getGuestName()) {
                document.getElementById('name-modal').style.display = 'flex';
                document.getElementById('name-modal-input').focus();
            }
        }

        function saveGuestName() {
            const input = document.getElementById('name-modal-input');
            const name = input.value.trim();
            if (!name) { input.focus(); return; }
            localStorage.setItem('guestDisplayName', name.slice(0, 40));
            document.getElementById('name-modal').style.display = 'none';
        }

        async function fetchSystemState() {
            try {
                const res = await fetch('/data');
                if (!res.ok) return;
                const data = await res.json();
                
                maxCredits = data.maxCredits;
                currentServerDuration = data.countdownLength;
                systemRequestsAllowed = data.requestsAllowed;
                
                setupLocalCredits();
                manageCountdownVisibility();

                // Live lock/unlock layout handling
                const searchInput = document.getElementById('search-input');
                if (!systemRequestsAllowed) {
                    searchInput.disabled = true;
                    searchInput.value = "";
                    searchInput.placeholder = "Song submissions are currently paused by the DJ.";
                    document.getElementById('list-title').innerText = "Live Queue";
                    renderQueue(data.queue);
                } else {
                    if (searchInput.disabled) {
                        searchInput.disabled = false;
                        searchInput.placeholder = "Search for songs or artists...";
                    }
                    
                    if (searchInput.value.trim() === "") {
                        document.getElementById('list-title').innerText = "Live Queue";
                        renderQueue(data.queue);
                    }
                }
            } catch (e) { console.log("State sync failure."); }
        }

        function setupLocalCredits() {
            if (localStorage.getItem('userCredits') === null) {
                localStorage.setItem('userCredits', maxCredits);
            }
            availableCredits = parseInt(localStorage.getItem('userCredits'));
            
            if (availableCredits > maxCredits) {
                availableCredits = maxCredits;
                localStorage.setItem('userCredits', availableCredits);
            }
            
            document.getElementById('credits-status').innerText = `Credits: ${availableCredits} / ${maxCredits}`;
        }

        function manageCountdownVisibility() {
            const countdownEl = document.getElementById('countdown-status');
            
            if (availableCredits >= maxCredits) {
                countdownEl.style.display = 'none';
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
            } else {
                countdownEl.style.display = 'inline-block';
                startLocalCountdown();
            }
        }

        function startLocalCountdown() {
            if (countdownTimer) return;
            
            timeRemaining = currentServerDuration;
            document.getElementById('countdown-status').innerText = `Regen in: ${timeRemaining}s`;
            
            countdownTimer = setInterval(() => {
                timeRemaining--;
                
                if (timeRemaining <= 0) {
                    timeRemaining = currentServerDuration;
                    if (availableCredits < maxCredits) {
                        availableCredits++;
                        localStorage.setItem('userCredits', availableCredits);
                        document.getElementById('credits-status').innerText = `Credits: ${availableCredits} / ${maxCredits}`;
                    }
                }
                
                if (availableCredits >= maxCredits) {
                    document.getElementById('countdown-status').style.display = 'none';
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                } else {
                    document.getElementById('countdown-status').innerText = `Regen in: ${timeRemaining}s`;
                }
            }, 1000);
        }

        function renderQueue(queue) {
            const display = document.getElementById('main-display-list');
            if (queue.length === 0) {
                display.innerHTML = '<p class="empty-placeholder">No songs requested yet. Be the first!</p>';
                return;
            }
            display.innerHTML = queue.map(song => {
                const isUpvoted = song.upvoters && song.upvoters.includes(voterSignatureToken);
                const isDownvoted = song.downvoters && song.downvoters.includes(voterSignatureToken);

                return `
                    <div class="song-row">
                        <div class="song-details">
                            <img src="${song.artwork}">
                            <div class="text-block">
                                <div class="title-wrapper">
                                    <p class="song-title">${song.title}</p>
                                    ${song.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                </div>
                                <p class="song-artist">${song.artist}</p>
                            </div>
                        </div>
                        <div class="actions">
                            <div class="vote-node ${isUpvoted ? 'user-voted-up' : ''}">
                                <button class="vote-btn vote-btn-up" onclick="castVote('${song.id}', 'up')">
                                    <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                                </button>
                                <span class="vote-count">${song.ups || 0}</span>
                            </div>
                            <div class="vote-node ${isDownvoted ? 'user-voted-down' : ''}">
                                <button class="vote-btn vote-btn-down" onclick="castVote('${song.id}', 'down')">
                                    <svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
                                </button>
                                <span class="vote-count">${song.downs || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function castVote(id, type) {
            try {
                const res = await fetch('/api/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, type, voterId: voterSignatureToken })
                });
                if (res.ok) fetchSystemState();
            } catch (e) { console.log("Voting entry exception dropped."); }
        }

        function executeSearch() {
            if (!systemRequestsAllowed) return; // Prevent querying if system is locked down
            
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();
            
            if (query === "") {
                fetchSystemState();
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    
                    document.getElementById('list-title').innerText = "Search Results";
                    const display = document.getElementById('main-display-list');
                    
                    if (!data.tracks || data.tracks.length === 0) {
                        globalSearchResults = [];
                        display.innerHTML = '<p class="empty-placeholder">No matching songs found.</p>';
                        return;
                    }

                    globalSearchResults = data.tracks;

                    display.innerHTML = data.tracks.map((track, index) => `
                        <div class="song-row">
                            <div class="song-details">
                                <img src="${track.artwork}">
                                <div class="text-block">
                                    <div class="title-wrapper">
                                        <p class="song-title">${track.name}</p>
                                        ${track.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                    </div>
                                    <p class="song-artist">${track.artist}</p>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-request" onclick="submitRequestAtIndex(${index})">Request</button>
                            </div>
                        </div>
                    `).join('');
                } catch (e) { console.log("Search extraction error"); }
            }, 300);
        }

        function submitRequestAtIndex(index) {
            const track = globalSearchResults[index];
            if (!track) return;
            requestTrackObject(track, { clearSearch: true });
        }

        async function requestTrackObject(track, opts = {}) {
            if (!systemRequestsAllowed) {
                alert("Submissions are currently closed.");
                return;
            }

            if (availableCredits <= 0) {
                alert("You are out of credits! Wait for the regeneration cycle.");
                return;
            }

            try {
                const res = await fetch('/api/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ track, requesterName: getGuestName() })
                });
                
                if (res.ok) {
                    availableCredits--;
                    localStorage.setItem('userCredits', availableCredits);
                    document.getElementById('credits-status').innerText = `Credits: ${availableCredits} / ${maxCredits}`;
                    manageCountdownVisibility();
                    
                    if (opts.clearSearch) document.getElementById('search-input').value = "";
                    await fetchSystemState();
                    alert("Song successfully added to the queue!");
                } else {
                    const errorData = await res.json();
                    alert(errorData.error || "Submission rejected.");
                }
            } catch (e) { alert("Failed to connect to request server."); }
        }

        // --- Guest Spotify browsing (read-only "see my playlists" login) ---
        // Separate from the DJ's own Spotify connection — this just lets a guest
        // sign into their own account to browse their playlists/tracks and request
        // straight from them. It never touches playback.
        let guestSpotifyConnected = false;
        let spotifyPanelView = 'playlists'; // 'playlists' | 'tracks'

        async function checkGuestSpotifyStatus() {
            try {
                const res = await fetch('/api/guest/spotify-status');
                const data = await res.json();
                guestSpotifyConnected = !!data.connected;
                const btn = document.getElementById('spotify-connect-btn');
                btn.innerText = guestSpotifyConnected ? 'Spotify Connected' : 'Connect Spotify';
                btn.classList.toggle('is-connected', guestSpotifyConnected);
            } catch (e) { /* silent — non-critical */ }
        }

        function handleSpotifyConnectClick() {
            if (!guestSpotifyConnected) {
                window.location.href = '/api/guest/spotify-login';
                return;
            }
            const panel = document.getElementById('spotify-panel');
            const isOpen = panel.style.display !== 'none';
            if (isOpen) {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
                spotifyPanelView = 'playlists';
                loadGuestPlaylists();
            }
        }

        let currentPlaylists = [];

        function openPlaylistAtIndex(idx) {
            const pl = currentPlaylists[idx];
            if (pl) loadGuestPlaylistTracks(pl.id, pl.name);
        }

        async function loadGuestPlaylists() {
            document.getElementById('spotify-panel-title').innerText = 'Your Playlists';
            const body = document.getElementById('spotify-panel-body');
            body.innerHTML = '<p class="empty-placeholder">Loading…</p>';
            try {
                const res = await fetch('/api/guest/spotify-playlists');
                if (!res.ok) {
                    body.innerHTML = '<p class="empty-placeholder">Could not load your playlists. Try reconnecting.</p>';
                    return;
                }
                const data = await res.json();
                currentPlaylists = data.playlists || [];
                if (currentPlaylists.length === 0) {
                    body.innerHTML = '<p class="empty-placeholder">No playlists found on your account.</p>';
                    return;
                }
                body.innerHTML = currentPlaylists.map((pl, idx) => `
                    <div class="playlist-row" onclick="openPlaylistAtIndex(${idx})">
                        <img src="${pl.artwork}">
                        <div>
                            <div class="pl-name">${pl.name}</div>
                            <div class="pl-count">${pl.trackCount} tracks</div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                body.innerHTML = '<p class="empty-placeholder">Could not load your playlists.</p>';
            }
        }

        let currentPlaylistTracks = [];

        function requestPlaylistTrackAtIndex(idx) {
            const track = currentPlaylistTracks[idx];
            if (track) requestTrackObject(track);
        }

        async function loadGuestPlaylistTracks(playlistId, playlistName) {
            spotifyPanelView = 'tracks';
            document.getElementById('spotify-panel-title').innerText = playlistName;
            const body = document.getElementById('spotify-panel-body');
            body.innerHTML = '<p class="empty-placeholder">Loading…</p>';
            try {
                const res = await fetch(`/api/guest/spotify-playlist/${encodeURIComponent(playlistId)}/tracks`);
                if (!res.ok) {
                    body.innerHTML = '<p class="empty-placeholder">Could not load tracks.</p>';
                    return;
                }
                const data = await res.json();
                currentPlaylistTracks = data.tracks || [];
                let html = '<span class="back-link" onclick="loadGuestPlaylists()">‹ Back to playlists</span>';
                if (data.unavailable) {
                    html += '<p class="empty-placeholder">Spotify only shares track details for playlists you own or collaborate on. Try one of your own playlists instead.</p>';
                } else if (currentPlaylistTracks.length === 0) {
                    html += '<p class="empty-placeholder">No tracks in this playlist.</p>';
                } else {
                    html += currentPlaylistTracks.map((track, idx) => `
                        <div class="song-row">
                            <div class="song-details">
                                <img src="${track.artwork}">
                                <div class="text-block">
                                    <div class="title-wrapper">
                                        <p class="song-title">${track.name}</p>
                                        ${track.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                    </div>
                                    <p class="song-artist">${track.artist}</p>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-request" onclick="requestPlaylistTrackAtIndex(${idx})">Request</button>
                            </div>
                        </div>
                    `).join('');
                }
                body.innerHTML = html;
            } catch (e) {
                body.innerHTML = '<p class="empty-placeholder">Could not load tracks.</p>';
            }
        }

        async function disconnectGuestSpotify() {
            await fetch('/api/guest/spotify-disconnect', { method: 'POST' });
            guestSpotifyConnected = false;
            document.getElementById('spotify-panel').style.display = 'none';
            checkGuestSpotifyStatus();
        }

        // Landed back here from the Spotify auth redirect — clean the URL and open the panel.
        if (window.location.search.includes('spotify=connected')) {
            window.history.replaceState({}, document.title, window.location.pathname);
            checkGuestSpotifyStatus().then(() => {
                if (guestSpotifyConnected) handleSpotifyConnectClick();
            });
        } else {
            checkGuestSpotifyStatus();
        }

        showNameModalIfNeeded();
        fetchSystemState();
        setInterval(fetchSystemState, 4000);
    </script>
</body>
</html>
