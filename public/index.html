<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --text-muted: #a7a7a7;
            --red-action: #e91429;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
            box-sizing: border-box;
        }
        
        .content-wrap {
            flex: 1;
        }
        
        h2 { 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-bottom: 15px; 
            border-left: 4px solid var(--spotify-green); 
            padding-left: 10px;
        }

        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            border-top: 3px solid var(--spotify-green);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 { margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .status-info p { margin: 4px 0 0 0; font-size: 1.4rem; font-weight: 800; color: var(--spotify-green); }

        .search-box {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            padding: 14px;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
        }
        .search-box:focus { border-color: var(--spotify-green); }
        .search-box:disabled { background-color: #1a1a1a; color: #555; cursor: not-allowed; }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .track-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--panel-bg);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .track-details { display: flex; align-items: center; gap: 12px; }
        .track-details img { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; }
        .track-title { font-weight: 700; margin: 0; font-size: 1rem; }
        .track-artist { color: var(--text-muted); margin: 2px 0 0 0; font-size: 0.85rem; }

        .explicit-badge {
            background-color: var(--red-action);
            color: white;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 6px;
            display: inline-block;
            vertical-align: middle;
        }

        .action-container { display: flex; align-items: center; gap: 12px; }
        .duration-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; font-variant-numeric: tabular-nums; }

        .req-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .req-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        
        .placeholder-text { color: var(--text-muted); font-style: italic; font-size: 0.95rem; }

        /* 🟢 CONNECTOR BUTTONS AT BOTTOM */
        .spotify-auth-container {
            margin-top: 30px;
            margin-bottom: 10px;
            width: 100%;
        }

        .spotify-ctrl-btn {
            width: 100%;
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s ease, filter 0.2s ease;
            box-sizing: border-box;
        }
        .spotify-ctrl-btn:hover {
            filter: brightness(1.1);
        }
        
        .spotify-ctrl-btn.connected-mode {
            background-color: #242424;
            border: 1px solid #333;
            color: white;
        }
        .spotify-ctrl-btn.connected-mode:hover {
            border-color: var(--spotify-green);
            background-color: #1c1c1c;
        }

        .playlist-view-container {
            background: var(--panel-bg);
            border: 1px solid #222;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .playlist-select-dropdown {
            width: 100%;
            background: var(--card-bg);
            color: white;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }
        .playlist-select-dropdown:focus {
            border-color: var(--spotify-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content-wrap">
            <h2>Request a Song</h2>
            
            <div class="status-card">
                <div class="status-info">
                    <h3>Your Credits</h3>
                    <p id="credits-display">3 / 3</p>
                </div>
                <div class="status-info" style="text-align: right;">
                    <h3>Next Credit In</h3>
                    <p id="timer-display">MAX</p>
                </div>
            </div>

            <div id="playlist-panel" class="playlist-view-container">
                <h3 class="section-title" style="font-size: 1rem; margin-top: 0;">Select From Your Playlists</h3>
                <select id="playlist-dropdown" class="playlist-select-dropdown" onchange="loadPlaylistTracks()">
                    <option value="">-- Choose a Playlist --</option>
                </select>
            </div>

            <input type="text" id="search-input" class="search-box" placeholder="Search tracks, artists..." oninput="searchSongs()">
            
            <h3 id="results-header" class="section-title">Search Results</h3>
            <div id="results-list">
                <p class="placeholder-text">Connect your Spotify account at the bottom to perform searches.</p>
            </div>
        </div>

        <div class="spotify-auth-container">
            <button id="spotify-connect-btn" class="spotify-ctrl-btn" onclick="handleSpotifyAuthAction()">Connect Spotify</button>
        </div>
    </div>

    <script>
        let maxCredits = 3;
        let localCredits = parseInt(localStorage.getItem('dj_user_credits'));
        let lastRegenTime = parseInt(localStorage.getItem('dj_last_regen'));
        let regenIntervalLength = 60; 
        let systemRequestsOpen = true;
        let isUserConnectedToSpotify = false;

        if (isNaN(localCredits) || isNaN(lastRegenTime) || localCredits === null || lastRegenTime === null) {
            localCredits = maxCredits;
            lastRegenTime = Date.now();
            localStorage.setItem('dj_user_credits', localCredits);
            localStorage.setItem('dj_last_regen', lastRegenTime);
        }

        async function checkUserLoginStatus() {
            try {
                const res = await fetch('/api/user/me');
                if (res.ok) {
                    const status = await res.json();
                    if (status.authenticated) {
                        isUserConnectedToSpotify = true;
                        const btn = document.getElementById('spotify-connect-btn');
                        btn.innerText = "My Playlists";
                        btn.className = "spotify-ctrl-btn connected-mode";
                        document.getElementById('playlist-panel').style.display = 'block';
                        document.getElementById('results-list').innerHTML = `<p class="placeholder-text">Type in the box above to discover tracks.</p>`;
                        fetchUserPlaylists();
                    }
                }
            } catch(e) {}
        }

        function handleSpotifyAuthAction() {
            if (!isUserConnectedToSpotify) {
                window.location.href = "/api/auth/login";
            } else {
                const panel = document.getElementById('playlist-panel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            }
        }

        async function fetchUserPlaylists() {
            try {
                const res = await fetch('/api/user/playlists');
                if (!res.ok) return;
                const playlists = await res.json();
                const dropdown = document.getElementById('playlist-dropdown');
                
                dropdown.innerHTML = '<option value="">-- Choose a Playlist --</option>';
                
                playlists.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.innerText = `${p.name} (${p.tracksCount} songs)`;
                    dropdown.appendChild(opt);
                });
            } catch(e) {}
        }

        async function loadPlaylistTracks() {
            const playlistId = document.getElementById('playlist-dropdown').value;
            const container = document.getElementById('results-list');
            const header = document.getElementById('results-header');
            
            if (!playlistId) return;
            
            document.getElementById('search-input').value = "";
            header.innerText = "Playlist Tracks";
            container.innerHTML = "<p class='placeholder-text'>Loading tracks from your Spotify playlist...</p>";

            try {
                const res = await fetch(`/api/user/playlist-tracks?id=${playlistId}`);
                if (!res.ok) {
                    container.innerHTML = "<p class='placeholder-text'>Could not pull songs from this tracklist.</p>";
                    return;
                }
                const data = await res.json();
                renderTrackRows(data.tracks);
            } catch(e) {
                container.innerHTML = "<p class='placeholder-text'>Error synchronizing playlist tracks.</p>";
            }
        }

        function searchSongs() {
            const query = document.getElementById('search-input').value.trim();
            const container = document.getElementById('results-list');
            const header = document.getElementById('results-header');
            
            if (!query) { 
                header.innerText = "Search Results";
                container.innerHTML = `<p class="placeholder-text">Type in the box above to discover tracks.</p>`; 
                return; 
            }

            header.innerText = "Search Results";
            fetch(`/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    container.innerHTML = `<p class='placeholder-text'>${data.error}</p>`;
                    return;
                }
                if(!data.tracks || data.tracks.length === 0) {
                    container.innerHTML = "<p class='placeholder-text'>No results matched your query.</p>";
                    return;
                }
                renderTrackRows(data.tracks);
            })
            .catch(() => {
                container.innerHTML = "<p class='placeholder-text'>Search failed. Make sure you are logged in.</p>";
            });
        }

        function renderTrackRows(tracks) {
            const container = document.getElementById('results-list');
            container.innerHTML = ''; 

            tracks.forEach(track => {
                const row = document.createElement('div');
                row.className = 'track-row';
                row.innerHTML = `
                    <div class="track-details">
                        <img src="${track.artwork}">
                        <div>
                            <p class="track-title">
                                ${escapeHtml(track.name)}
                                ${track.explicit ? '<span class="explicit-badge">E</span>' : ''}
                            </p>
                            <p class="track-artist">${escapeHtml(track.artist)}</p>
                        </div>
                    </div>
                    <div class="action-container">
                        <span class="duration-label">${track.duration}</span>
                        <button class="req-btn" ${localCredits <= 0 || !systemRequestsOpen ? 'disabled' : ''}>Request</button>
                    </div>
                `;
                row.querySelector('.req-btn').addEventListener('click', () => submitRequest(track));
                container.appendChild(row);
            });
        }

        async function submitRequest(track) {
            if (localCredits <= 0 || !systemRequestsOpen) return;
            const res = await fetch('/api/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track })
            });

            if (res.ok) {
                localCredits--;
                if (localCredits === maxCredits - 1) {
                    lastRegenTime = Date.now();
                    localStorage.setItem('dj_last_regen', lastRegenTime);
                }
                localStorage.setItem('dj_user_credits', localCredits);
                alert(`"${track.name}" submitted successfully!`);
                document.getElementById('search-input').value = "";
                document.getElementById('playlist-dropdown').value = "";
                document.getElementById('playlist-panel').style.display = 'none';
                document.getElementById('results-header').innerText = "Search Results";
                document.getElementById('results-list').innerHTML = `<p class="placeholder-text">Type in the box above to discover tracks.</p>`;
            } else {
                const errData = await res.json();
                alert(errData.error || "Submission failed.");
            }
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
        
        async function syncWithServer() {
            try {
                const res = await fetch('/data');
                const data = await res.json();
                maxCredits = data.maxCredits;
                regenIntervalLength = data.countdownLength;
                systemRequestsOpen = data.requestsAllowed;
                if (localCredits > maxCredits) {
                    localCredits = maxCredits;
                    localStorage.setItem('dj_user_credits', localCredits);
                }
                document.getElementById('credits-display').innerText = `${localCredits} / ${maxCredits}`;
                updateUI();
            } catch (e) {}
        }

        function handleCreditCalculations() {
            if (localCredits >= maxCredits) {
                document.getElementById('timer-display').innerText = "MAX";
                return;
            }
            const elapsedSeconds = Math.floor((Date.now() - lastRegenTime) / 1000);
            if (elapsedSeconds >= regenIntervalLength) {
                const gained = Math.floor(elapsedSeconds / regenIntervalLength);
                localCredits = Math.min(maxCredits, localCredits + gained);
                lastRegenTime += gained * regenIntervalLength * 1000;
                localStorage.setItem('dj_user_credits', localCredits);
                localStorage.setItem('dj_last_regen', lastRegenTime);
            }
            const remaining = regenIntervalLength - (Math.floor((Date.now() - lastRegenTime) / 1000) % regenIntervalLength);
            document.getElementById('timer-display').innerText = `${Math.floor(remaining / 60)}:${(remaining % 60) < 10 ? '0' : ''}${remaining % 60}`;
        }

        function updateUI() {
            const inputs = document.getElementById('search-input');
            const btns = document.querySelectorAll('.req-btn');
            if (!systemRequestsOpen) {
                inputs.placeholder = "Submissions are currently CLOSED by the DJ";
                btns.forEach(b => b.disabled = true);
            } else if (localCredits <= 0) {
                btns.forEach(b => b.disabled = true);
            } else {
                inputs.placeholder = isUserConnectedToSpotify ? "Search tracks, artists..." : "Connect your Spotify account below to unlock searching";
                btns.forEach(b => b.disabled = false);
            }
        }

        setInterval(handleCreditCalculations, 1000);
        setInterval(syncWithServer, 4000);
        
        checkUserLoginStatus();
        syncWithServer();
    </script>
</body>
</html>
