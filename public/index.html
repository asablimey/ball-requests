<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Request Station</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 800; }

        .credits-display {
            background-color: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            border: 1px solid #282828;
            white-space: nowrap;
        }

        .search-box {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid #333;
            padding: 14px 20px;
            color: white;
            border-radius: 50px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 25px;
            transition: border-color 0.2s ease;
        }
        .search-box:focus { border-color: var(--spotify-green); }

        .section-title {
            font-size: 1.2rem;
            color: var(--spotify-green);
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* 📱 AUTO-ALIGNING RESPONSIVE ROW ENGINE */
        .song-row {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Keeps items perfectly centered vertically */
            padding: 12px 16px;
            background: var(--card-bg);
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #2c2c2c;
            gap: 16px;
            box-sizing: border-box;
            width: 100%;
        }

        .song-details {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0; /* Prevents text overflow breaking alignment */
        }

        .song-details img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0; /* Prevents image from squishing on rotation */
        }

        .text-block {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-weight: 700;
            margin: 0;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: #a7a7a7;
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-request {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s ease;
        }
        .btn-request:active { transform: scale(0.95); }
        .btn-request:disabled { background-color: #555; cursor: not-allowed; }

        .empty-placeholder { color: #666; font-style: italic; text-align: center; padding: 20px 0; }

        /* Handle extra slim portrait phone windows smoothly */
        @media (max-width: 400px) {
            .song-row { padding: 10px; gap: 10px; }
            .btn-request { padding: 8px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Song Requests</h1>
            <div id="credits-status" class="credits-display">Credits: -- / --</div>
        </div>

        <input type="text" id="search-input" class="search-box" placeholder="Search for songs or artists..." oninput="executeSearch()">

        <div class="section-title" id="list-title">Live Queue</div>
        <div id="main-display-list"></div>
    </div>

    <script>
        let availableCredits = 3;
        let maxCredits = 3;
        let searchTimeout = null;

        async function fetchSystemState() {
            try {
                const res = await fetch('/data');
                if (!res.ok) return;
                const data = await res.json();
                
                maxCredits = data.maxCredits;
                setupLocalCredits();

                // Only render active queue if search field is empty
                if (document.getElementById('search-input').value.trim() === "") {
                    document.getElementById('list-title').innerText = "Live Queue";
                    renderQueue(data.queue);
                }
            } catch (e) { console.log("State sync failure."); }
        }

        function setupLocalCredits() {
            if (localStorage.getItem('userCredits') === null) {
                localStorage.setItem('userCredits', maxCredits);
            }
            availableCredits = parseInt(localStorage.getItem('userCredits'));
            document.getElementById('credits-status').innerText = `Credits: ${availableCredits} / ${maxCredits}`;
        }

        function renderQueue(queue) {
            const display = document.getElementById('main-display-list');
            if (queue.length === 0) {
                display.innerHTML = '<p class="empty-placeholder">No songs requested yet. Be the first!</p>';
                return;
            }
            display.innerHTML = queue.map(song => `
                <div class="song-row">
                    <div class="song-details">
                        <img src="${song.artwork}">
                        <div class="text-block">
                            <p class="song-title">${song.title}</p>
                            <p class="song-artist">${song.artist}</p>
                        </div>
                    </div>
                    <div class="actions">
                        <span style="color: var(--spotify-green); font-weight:700; font-size:0.9rem;">${song.votes} 👍</span>
                    </div>
                </div>
            `).join('');
        }

        function executeSearch() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();
            
            if (query === "") {
                fetchSystemState();
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    
                    document.getElementById('list-title').innerText = "Search Results";
                    const display = document.getElementById('main-display-list');
                    
                    if (!data.tracks || data.tracks.length === 0) {
                        display.innerHTML = '<p class="empty-placeholder">No matching songs found.</p>';
                        return;
                    }

                    display.innerHTML = data.tracks.map(track => `
                        <div class="song-row">
                            <div class="song-details">
                                <img src="${track.artwork}">
                                <div class="text-block">
                                    <p class="song-title">${track.name}</p>
                                    <p class="song-artist">${track.artist}</p>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-request" onclick='submitRequest(${JSON.stringify(track).replace(/'/g, "&apos;")})'>Request</button>
                            </div>
                        </div>
                    `).join('');
                } catch (e) { console.log("Search error"); }
            }, 300);
        }

        async function submitRequest(track) {
            if (availableCredits <= 0) {
                alert("You are out of credits! Wait for the regeneration cycle.");
                return;
            }

            try {
                const res = await fetch('/api/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ track })
                });
                
                if (res.ok) {
                    availableCredits--;
                    localStorage.setItem('userCredits', availableCredits);
                    document.getElementById('credits-status').innerText = `Credits: ${availableCredits} / ${maxCredits}`;
                    document.getElementById('search-input').value = "";
                    fetchSystemState();
                    alert("Song successfully added to the queue!");
                } else {
                    const errorData = await res.json();
                    alert(errorData.error || "Submission rejected.");
                }
            } catch (e) { alert("Failed to connect to request server."); }
        }

        // Initialize and start live cycle tracking
        fetchSystemState();
        setInterval(fetchSystemState, 4000);
    </script>
</body>
</html>
