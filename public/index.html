<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --text-muted: #a7a7a7;
            --red-action: #e91429;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
            box-sizing: border-box;
        }
        
        .content-wrap {
            flex: 1;
        }
        
        h2 { 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-bottom: 15px; 
            border-left: 4px solid var(--spotify-green); 
            padding-left: 10px;
        }

        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            border-top: 3px solid var(--spotify-green);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 { margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .status-info p { margin: 4px 0 0 0; font-size: 1.4rem; font-weight: 800; color: var(--spotify-green); }

        .search-box {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            padding: 14px;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
        }
        .search-box:focus { border-color: var(--spotify-green); }

        .section-title {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        /* Dedicated Layout View for Playlists Grid */
        .playlist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .playlist-card {
            background: var(--panel-bg);
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-align: left;
        }
        .playlist-card:hover {
            transform: scale(1.02);
            border-color: var(--spotify-green);
        }
        .playlist-card h4 { margin: 0 0 6px 0; font-size: 1rem; font-weight: 700; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-card p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }

        .track-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--panel-bg);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .track-details { display: flex; align-items: center; gap: 12px; }
        .track-details img { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; }
        .track-title { font-weight: 700; margin: 0; font-size: 1rem; }
        .track-artist { color: var(--text-muted); margin: 2px 0 0 0; font-size: 0.85rem; }

        .explicit-badge {
            background-color: var(--red-action);
            color: white;
            font-size: 0.65rem;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 3px;
            margin-left: 6px;
            display: inline-block;
        }

        .action-container { display: flex; align-items: center; gap: 12px; }
        .duration-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

        .req-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .req-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        
        .placeholder-text { color: var(--text-muted); font-style: italic; font-size: 0.95rem; }

        .spotify-auth-container {
            margin-top: 30px;
            margin-bottom: 10px;
            width: 100%;
        }

        /* Explicitly styled green matching requirements */
        .spotify-ctrl-btn {
            width: 100%;
            background-color: var(--spotify-green) !important;
            color: white !important;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
        }
        
        .back-btn {
            background: #242424;
            color: white;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        .back-btn:hover { border-color: var(--spotify-green); }

        /* Conditional Rendering Views */
        .page-view { display: none; }
        .page-view.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="content-wrap">
            
            <div id="home-view" class="page-view active">
                <h2>Request a Song</h2>
                <div class="status-card">
                    <div class="status-info">
                        <h3>Your Credits</h3>
                        <p id="credits-display">3 / 3</p>
                    </div>
                    <div class="status-info" style="text-align: right;">
                        <h3>Next Credit In</h3>
                        <p id="timer-display">MAX</p>
                    </div>
                </div>

                <input type="text" id="search-input" class="search-box" placeholder="Search tracks, artists..." oninput="searchSongs()">
                <h3 class="section-title">Search Results</h3>
                <div id="results-list">
                    <p class="placeholder-text">Type in the box above to discover tracks.</p>
                </div>
            </div>

            <div id="playlists-view" class="page-view">
                <button class="back-btn" onclick="navigateTo('home')">← Back to Search</button>
                <h2>Your Custom Playlists</h2>
                <div id="playlists-grid-container" class="playlist-grid">
                    </div>
            </div>

            <div id="playlist-tracks-view" class="page-view">
                <button class="back-btn" onclick="navigateTo('playlists')">← Back to Playlists</button>
                <h2 id="current-playlist-title">Playlist Songs</h2>
                <div id="playlist-tracks-list">
                    </div>
            </div>

        </div>

        <div class="spotify-auth-container">
            <button id="spotify-connect-btn" class="spotify-ctrl-btn" onclick="handleSpotifyAuthAction()">Connect Spotify</button>
        </div>
    </div>

    <script>
        let maxCredits = 3;
        let localCredits = parseInt(localStorage.getItem('dj_user_credits')) || maxCredits;
        let lastRegenTime = parseInt(localStorage.getItem('dj_last_regen')) || Date.now();
        let regenIntervalLength = 60; 
        let systemRequestsOpen = true;
        let isUserConnectedToSpotify = false;

        async function checkUserLoginStatus() {
            try {
                const res = await fetch('/api/user/me');
                if (res.ok) {
                    const status = await res.json();
                    if (status.authenticated) {
                        isUserConnectedToSpotify = true;
                        const btn = document.getElementById('spotify-connect-btn');
                        btn.innerText = "My Playlists";
                    }
                }
            } catch(e) {}
        }

        function handleSpotifyAuthAction() {
            if (!isUserConnectedToSpotify) {
                window.location.href = "/api/auth/login";
            } else {
                navigateTo('playlists');
                fetchUserPlaylists();
            }
        }

        function navigateTo(pageId) {
            document.querySelectorAll('.page-view').forEach(view => view.classList.remove('active'));
            if (pageId === 'home') document.getElementById('home-view').classList.add('active');
            if (pageId === 'playlists') document.getElementById('playlists-view').classList.add('active');
            if (pageId === 'tracks') document.getElementById('playlist-tracks-view').classList.add('active');
        }

        async function fetchUserPlaylists() {
            const container = document.getElementById('playlists-grid-container');
            container.innerHTML = "<p class='placeholder-text'>Fetching your playlists...</p>";
            try {
                const res = await fetch('/api/user/playlists');
                if (!res.ok) {
                    container.innerHTML = "<p class='placeholder-text'>Failed to load playlists. Confirm your profile email is added under 'Users and Access' inside the Spotify Developer Dashboard.</p>";
                    return;
                }
                const playlists = await res.json();
                if(playlists.length === 0) {
                    container.innerHTML = "<p class='placeholder-text'>No public playlists discovered on this account profile.</p>";
                    return;
                }
                container.innerHTML = "";
                playlists.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'playlist-card';
                    card.innerHTML = `
                        <h4>${escapeHtml(p.name)}</h4>
                        <p>${p.tracksCount} tracks</p>
                    `;
                    card.onclick = () => loadPlaylistTracks(p.id, p.name);
                    container.appendChild(card);
                });
            } catch(e) {
                container.innerHTML = "<p class='placeholder-text'>Connection exception occurred.</p>";
            }
        }

        async function loadPlaylistTracks(id, name) {
            document.getElementById('current-playlist-title').innerText = name;
            const container = document.getElementById('playlist-tracks-list');
            container.innerHTML = "<p class='placeholder-text'>Opening track contents...</p>";
            navigateTo('tracks');

            try {
                const res = await fetch(`/api/user/playlist-tracks?id=${id}`);
                if (!res.ok) {
                    container.innerHTML = "<p class='placeholder-text'>Could not parse playlist tracks.</p>";
                    return;
                }
                const data = await res.json();
                renderTracksInContainer(data.tracks, container);
            } catch(e) {
                container.innerHTML = "<p class='placeholder-text'>Error synchronizing array indices.</p>";
            }
        }

        function searchSongs() {
            const query = document.getElementById('search-input').value.trim();
            const container = document.getElementById('results-list');
            if (!query) { 
                container.innerHTML = `<p class="placeholder-text">Type in the box above to discover tracks.</p>`; 
                return; 
            }
            fetch(`/api/search?q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                if(!data.tracks || data.tracks.length === 0) {
                    container.innerHTML = "<p class='placeholder-text'>No matched tracks found.</p>";
                    return;
                }
                renderTracksInContainer(data.tracks, container);
            })
            .catch(() => {
                container.innerHTML = "<p class='placeholder-text'>Search query error.</p>";
            });
        }

        function renderTracksInContainer(tracks, container) {
            container.innerHTML = '';
            tracks.forEach(track => {
                const row = document.createElement('div');
                row.className = 'track-row';
                row.innerHTML = `
                    <div class="track-details">
                        <img src="${track.artwork}">
                        <div>
                            <p class="track-title">${escapeHtml(track.name)} ${track.explicit ? '<span class="explicit-badge">E</span>' : ''}</p>
                            <p class="track-artist">${escapeHtml(track.artist)}</p>
                        </div>
                    </div>
                    <div class="action-container">
                        <span class="duration-label">${track.duration}</span>
                        <button class="req-btn" ${localCredits <= 0 || !systemRequestsOpen ? 'disabled' : ''}>Request</button>
                    </div>
                `;
                row.querySelector('.req-btn').addEventListener('click', () => submitRequest(track));
                container.appendChild(row);
            });
        }

        async function submitRequest(track) {
            if (localCredits <= 0 || !systemRequestsOpen) return;
            const res = await fetch('/api/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track })
            });
            if (res.ok) {
                localCredits--;
                localStorage.setItem('dj_user_credits', localCredits);
                alert(`"${track.name}" sent to queue!`);
                navigateTo('home');
                document.getElementById('search-input').value = "";
                searchSongs();
            } else {
                const errData = await res.json();
                alert(errData.error || "Submission error.");
            }
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        
        async function syncWithServer() {
            try {
                const res = await fetch('/data');
                const data = await res.json();
                maxCredits = data.maxCredits;
                regenIntervalLength = data.countdownLength;
                systemRequestsOpen = data.requestsAllowed;
                document.getElementById('credits-display').innerText = `${localCredits} / ${maxCredits}`;
            } catch (e) {}
        }

        setInterval(syncWithServer, 5000);
        checkUserLoginStatus();
        syncWithServer();
    </script>
</body>
</html>
