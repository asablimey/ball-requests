<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Request</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --text-muted: #a7a7a7;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h2 {
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-bottom: 15px;
            border-left: 4px solid var(--spotify-green);
            padding-left: 10px;
        }

        .status-card {
            background-color: var(--panel-bg);
            border: 1px solid #282828;
            border-top: 3px solid var(--spotify-green);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info h3 { margin: 0; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; }
        .status-info p { margin: 4px 0 0 0; font-size: 1.4rem; font-weight: 800; color: var(--spotify-green); }

        .search-box {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 14px;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
        }
        .search-box:focus { border-color: var(--spotify-green); }

        .track-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--panel-bg);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .track-details { display: flex; align-items: center; gap: 12px; }
        .track-details img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
        .track-title { font-weight: 700; margin: 0; font-size: 1rem; }
        .track-artist { color: var(--text-muted); margin: 2px 0 0 0; font-size: 0.85rem; }

        .req-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .req-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }

        .connect-btn {
            width: 100%;
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .view-toggle-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }
        .playlist-item {
            background: var(--panel-bg);
            border: 1px solid #222;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .playlist-item img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; }
        
        .back-btn {
            background-color: #242424;
            color: white;
            border: 1px solid #333;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .back-btn:hover { background-color: #333; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Request a Song</h2>
        
        <div class="status-card">
            <div class="status-info">
                <h3>Your Credits</h3>
                <p id="credits-display">3 / 3</p>
            </div>
            <div class="status-info" style="text-align: right;">
                <h3>Next Credit In</h3>
                <p id="timer-display">MAX</p>
            </div>
        </div>

        <div id="auth-section">
            <a href="/api/login" id="login-button" class="connect-btn">Connect Spotify Account</a>
            <div id="view-controls" class="view-toggle-area" style="display: none;">
                <span id="current-mode-label" style="font-weight: bold; color: var(--text-muted);">Global Search</span>
                <button id="toggle-view-btn" class="back-btn" onclick="switchViewMode()">My Playlists</button>
            </div>
        </div>

        <input type="text" id="search-input" class="search-box" placeholder="Search tracks, artists..." oninput="searchSongs()">
        <div id="results-list"></div>
    </div>

    <script>
        let maxCredits = 3;
        let localCredits = parseInt(localStorage.getItem('dj_user_credits'));
        let lastRegenTime = parseInt(localStorage.getItem('dj_last_regen'));
        let regenIntervalLength = 60; 
        let systemRequestsOpen = true;

        let currentMode = "search"; 
        const urlParams = new URLSearchParams(window.location.search);
        let userAccessToken = urlParams.get('access_token');
        
        if (userAccessToken) {
            localStorage.setItem('user_spotify_token', userAccessToken);
            window.history.replaceState({}, document.title, "/");
        } else {
            userAccessToken = localStorage.getItem('user_spotify_token');
        }

        if (isNaN(localCredits) || isNaN(lastRegenTime) || localCredits === null || lastRegenTime === null) {
            localCredits = maxCredits;
            lastRegenTime = Date.now();
            localStorage.setItem('dj_user_credits', localCredits);
            localStorage.setItem('dj_last_regen', lastRegenTime);
        }

        async function syncWithServer() {
            try {
                const res = await fetch('/data');
                if (!res.ok) return;
                const data = await res.json();

                maxCredits = data.maxCredits;
                regenIntervalLength = data.countdownLength;
                systemRequestsOpen = data.requestsAllowed;

                if (localCredits > maxCredits) {
                    localCredits = maxCredits;
                    localStorage.setItem('dj_user_credits', localCredits);
                }
                
                updateUI();
            } catch (e) {
                console.log("Sync error.");
            }
        }

        function handleCreditCalculations() {
            if (localCredits >= maxCredits) {
                document.getElementById('timer-display').innerText = "MAX";
                lastRegenTime = Date.now();
                localStorage.setItem('dj_last_regen', lastRegenTime);
                return;
            }

            const now = Date.now();
            const elapsedSeconds = Math.floor((now - lastRegenTime) / 1000);
            
            if (elapsedSeconds >= regenIntervalLength) {
                const creditsToGain = Math.floor(elapsedSeconds / regenIntervalLength);
                localCredits = Math.min(maxCredits, localCredits + creditsToGain);
                lastRegenTime = lastRegenTime + (creditsToGain * regenIntervalLength * 1000);
                
                localStorage.setItem('dj_user_credits', localCredits);
                localStorage.setItem('dj_last_regen', lastRegenTime);
            }

            const remainingSeconds = regenIntervalLength - (Math.floor((Date.now() - lastRegenTime) / 1000) % regenIntervalLength);
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            
            document.getElementById('timer-display').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            updateUI();
        }

        function updateUI() {
            document.getElementById('credits-display').innerText = `${localCredits} / ${maxCredits}`;
            const inputs = document.getElementById('search-input');
            if (!systemRequestsOpen) {
                inputs.placeholder = "Submissions are currently CLOSED by the DJ";
                inputs.disabled = true;
            } else {
                inputs.placeholder = currentMode === "search" ? "Search tracks, artists..." : "Search locked in playlist view";
                inputs.disabled = currentMode !== "search";
            }

            if (userAccessToken) {
                document.getElementById('login-button').style.display = 'none';
                document.getElementById('view-controls').style.display = 'flex';
            }
        }

        function switchViewMode() {
            const btn = document.getElementById('toggle-view-btn');
            const label = document.getElementById('current-mode-label');
            if (currentMode === "search") {
                currentMode = "playlists";
                label.innerText = "YOUR PLAYLISTS";
                btn.innerText = "◀ Back";
                loadUserPlaylists();
            } else {
                currentMode = "search";
                label.innerText = "Global Search";
                btn.innerText = "My Playlists";
                document.getElementById('results-list').innerHTML = '';
                document.getElementById('search-input').value = '';
                updateUI();
            }
        }

        async function loadUserPlaylists() {
            const target = document.getElementById('results-list');
            target.innerHTML = '<p style="color:#666; text-align:center;">Loading playlists...</p>';
            try {
                const res = await fetch('/api/playlists', {
                    headers: { 'user-token': userAccessToken }
                });
                if (!res.ok) throw new Error();
                const playlists = await res.json();
                
                if (playlists.length === 0) {
                    target.innerHTML = '<p style="color:#666; text-align:center;">No playlists found on this account.</p>';
                    return;
                }

                target.innerHTML = playlists.map(p => `
                    <div class="playlist-item" onclick="loadPlaylistTracks('${p.id}', '${p.name.replace(/'/g, "\\'")}')">
                        <img src="${p.artwork}">
                        <div>
                            <p style="margin:0; font-weight:bold;">${p.name}</p>
                            <p style="margin:4px 0 0 0; font-size:0.8rem; color:#a7a7a7;">${p.trackCount} Tracks</p>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                target.innerHTML = '<p style="color:red; text-align:center;">Failed parsing playlists.</p>';
            }
        }

        async function loadPlaylistTracks(playlistId, name) {
            const target = document.getElementById('results-list');
            document.getElementById('current-mode-label').innerText = name.toUpperCase();
            document.getElementById('toggle-view-btn').innerText = "◀ Back";
            target.innerHTML = '<p style="color:#666; text-align:center;">Loading tracks...</p>';
            
            try {
                const res = await fetch('/api/playlists/' + playlistId + '/tracks', {
                    headers: { 'user-token': userAccessToken }
                });
                const tracks = await res.json();
                renderTrackRows(tracks);
            } catch(e) {
                target.innerHTML = '<p style="color:red; text-align:center;">Failed loading tracks.</p>';
            }
        }

        let searchTimeout;
        function searchSongs() {
            if (currentMode !== "search") return;
            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();
            if (!query) { document.getElementById('results-list').innerHTML = ''; return; }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
                        headers: { 'user-token': userAccessToken || "" }
                    });
                    const data = await res.json();
                    renderTrackRows(data.tracks || []);
                } catch (e) { console.log("Search error."); }
            }, 300);
        }

        function renderTrackRows(tracks) {
            const target = document.getElementById('results-list');
            if (tracks.length === 0) {
                target.innerHTML = '<p style="color:#666; text-align:center;">No tracks found.</p>';
                return;
            }
            target.innerHTML = tracks.map(track => {
                const safeTrack = JSON.stringify(track).replace(/"/g, '&quot;');
                return `
                    <div class="track-row">
                        <div class="track-details">
                            <img src="${track.artwork}">
                            <div><p class="track-title">${track.name}</p><p class="track-artist">${track.artist}</p></div>
                        </div>
                        <button class="req-btn" ${localCredits <= 0 || !systemRequestsOpen ? 'disabled' : ''} onclick="submitRequest('${safeTrack}')">Request</button>
                    </div>
                `;
            }).join('');
        }

        async function submitRequest(trackJsonStr) {
            if (localCredits <= 0 || !systemRequestsOpen) return;
            const track = JSON.parse(trackJsonStr.replace(/&quot;/g, '"'));

            const res = await fetch('/api/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ track })
            });

            if (res.ok) {
                localCredits--;
                if (localCredits === maxCredits - 1) {
                    lastRegenTime = Date.now();
                    localStorage.setItem('dj_last_regen', lastRegenTime);
                }
                localStorage.setItem('dj_user_credits', localCredits);
                alert(`"${track.name}" submitted successfully!`);
                if (currentMode === "search") {
                    document.getElementById('search-input').value = '';
                    document.getElementById('results-list').innerHTML = '';
                }
                updateUI();
            } else {
                const errData = await res.json();
                alert(errData.error || "Submission failed.");
            }
        }

        setInterval(handleCreditCalculations, 1000);
        setInterval(syncWithServer, 5000);
        syncWithServer();
    </script>
</body>
</html>
