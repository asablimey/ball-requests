<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --red-action: #e91429;
        }
        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 25px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        * { box-sizing: border-box; }
        .wrap { width: 100%; max-width: 420px; }
        h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 20px 0; text-align: center; }
        .card { background: var(--panel-bg); border: 1px solid #282828; border-radius: 14px; padding: 24px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .input-group label { font-size: 0.8rem; text-transform: uppercase; color: #a7a7a7; font-weight: 700; letter-spacing: 0.5px; }
        .input-group input {
            background-color: var(--card-bg); border: 1px solid #333; padding: 12px 14px;
            color: white; border-radius: 6px; font-size: 1rem; width: 100%;
        }
        .input-group input:focus { outline: none; border-color: var(--spotify-green); }
        .primary-btn {
            width: 100%; background-color: white; color: black; border: none; padding: 14px;
            border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;
        }
        .primary-btn:hover { background-color: var(--spotify-green); color: white; }
        .primary-btn:disabled { opacity: 0.5; cursor: default; }
        .error-msg { color: var(--red-action); font-size: 0.85rem; margin-top: 12px; display: none; }
        .success-msg { color: var(--spotify-green); font-size: 0.9rem; margin-top: 12px; display: none; text-align: center; }
        a { color: var(--spotify-green); }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Reset Password</h1>
        <div class="card" id="form-card">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="new-password" placeholder="At least 8 characters" onkeydown="if(event.key === 'Enter') submitReset()">
            </div>
            <button class="primary-btn" id="submit-btn" onclick="submitReset()">Set New Password</button>
            <div class="error-msg" id="error-msg"></div>
            <div class="success-msg" id="success-msg"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const username = params.get('username');
        const token = params.get('token');

        if (!username || !token) {
            document.getElementById('form-card').innerHTML =
                '<div class="error-msg" style="display:block;">This reset link is missing information. Request a new one from the login page.</div>';
        }

        async function submitReset() {
            const newPassword = document.getElementById('new-password').value;
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            const btn = document.getElementById('submit-btn');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!newPassword || newPassword.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Saving...';
            try {
                const res = await fetch('/api/account/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, token, newPassword })
                });
                const data = await res.json();
                if (!res.ok) {
                    errorEl.textContent = data.error || 'Could not reset your password.';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Set New Password';
                    return;
                }
                document.getElementById('new-password').style.display = 'none';
                btn.style.display = 'none';
                successEl.textContent = 'Password updated. You can close this tab and log in with your new password.';
                successEl.style.display = 'block';
            } catch (err) {
                errorEl.textContent = 'Could not reach the server. Try again.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Set New Password';
            }
        }
    </script>
</body>
</html>
