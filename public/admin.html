<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <div id="password-gate" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #111; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; font-family: sans-serif;">
        <h2 style="font-size: 28px; margin-bottom: 5px;">DJ Control Panel Locked</h2>
        <p style="color: #aaa; margin-bottom: 20px;">Enter the secret key to manage song requests</p>
        <div style="display: flex; gap: 10px;">
            <input type="password" id="admin-pass-input" placeholder="Password..." style="padding: 12px; border-radius: 6px; border: 1px solid #333; background: #222; color: white; font-size: 16px; outline: none; width: 200px;">
            <button onclick="checkAdminPassword()" style="padding: 12px 24px; border-radius: 6px; border: none; background: #1DB954; color: white; font-weight: bold; cursor: pointer; font-size: 16px;">Unlock</button>
        </div>
        <p id="gate-error" style="color: #ff4d4d; margin-top: 15px; display: none; font-weight: bold;">Incorrect password! Access Denied.</p>
    </div>

    <script>
        function checkAdminPassword() {
            const input = document.getElementById('admin-pass-input').value;
            const errorMsg = document.getElementById('gate-error');
            
            // 🔑 Matches the password set inside your server config
            if (input === "ballDJ2026") {
                // Hide the lock screen layer and reveal your dashboard layout
                document.getElementById('password-gate').style.display = 'none';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('admin-pass-input').value = '';
            }
        }
        
        // Allow pressing 'Enter' key inside the text box to submit
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('admin-pass-input').focus();
            document.getElementById('admin-pass-input').addEventListener("keypress", (e) => {
                if (e.key === "Enter") checkAdminPassword();
            });
        });
    </script>
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>DJ Administration Panel</h1>
            <p>Year 11 Ball Request Engine</p>
        </header>

        <section class="controls-card">
            <h2>Global Session Configs</h2>
            <div class="control-group">
                <label>Max User Credits:</label>
                <input type="number" id="max-credits-input" value="3" min="1">
            </div>
            <div class="control-group">
                <label>Regen Time (Seconds):</label>
                <input type="number" id="regen-time-input" value="60" min="5">
            </div>
            <div class="control-group toggle-group">
                <label>Allow New Submissions:</label>
                <input type="checkbox" id="allow-requests-toggle" checked>
            </div>
            <button id="save-configs-btn" class="btn-primary">Apply Settings</button>
        </section>

        <section class="queue-card">
            <div class="queue-header">
                <h2>Active Request Queue</h2>
                <button id="clear-queue-btn" class="btn-danger">Nuke Queue</button>
            </div>
            <ul id="admin-queue-list" class="song-list">
                </ul>
        </section>

        <section class="history-card">
            <h2>Recently Played Tracks</h2>
            <ul id="admin-history-list" class="song-list text-muted">
                </ul>
        </section>
    </div>

    <script>
        const ADMIN_PASSWORD = "ballDJ2026";

        async function fetchAdminDashboard() {
            try {
                const res = await fetch('/api/queue');
                const data = await res.json();
                
                // Update config fields visually if not focused
                if(document.activeElement !== document.getElementById('max-credits-input')) {
                    document.getElementById('max-credits-input').value = data.configs.maxCredits;
                }
                if(document.activeElement !== document.getElementById('regen-time-input')) {
                    document.getElementById('regen-time-input').value = data.configs.countdownLength;
                }
                document.getElementById('allow-requests-toggle').checked = data.configs.requestsAllowed;

                // Render Queue
                const queueList = document.getElementById('admin-queue-list');
                queueList.innerHTML = data.queue.length === 0 ? '<li class="empty-msg">No active song requests yet.</li>' : '';
                data.queue.forEach(track => {
                    const li = document.createElement('li');
                    li.className = 'song-item';
                    li.innerHTML = `
                        <img src="${track.albumArt}" class="album-art" alt="Album Cover">
                        <div class="song-details">
                            <span class="track-name">${track.name}</span>
                            <span class="track-artist">${track.artist}</span>
                        </div>
                        <div class="vote-badge">🔥 ${track.votes}</div>
                        <div class="action-buttons">
                            <button onclick="removeTrack('${track.id}', true)" class="btn-success">Play Next</button>
                            <button onclick="removeTrack('${track.id}', false)" class="btn-warn">Drop</button>
                        </div>
                    `;
                    queueList.appendChild(li);
                });

                // Render History
                const historyList = document.getElementById('admin-history-list');
                historyList.innerHTML = data.history.length === 0 ? '<li class="empty-msg">No tracks played yet this session.</li>' : '';
                data.history.forEach(track => {
                    const li = document.createElement('li');
                    li.className = 'song-item history-item';
                    li.innerHTML = `
                        <img src="${track.albumArt}" class="album-art thumbnail" alt="Album Cover">
                        <div class="song-details">
                            <span class="track-name">${track.name}</span>
                            <span class="track-artist">${track.artist}</span>
                        </div>
                    `;
                    historyList.appendChild(li);
                });

            } catch (err) {
                console.error("Dashboard failed sync sequence:", err);
            }
        }

        async function removeTrack(trackId, played) {
            await fetch('/api/admin/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: ADMIN_PASSWORD, trackId, played })
            });
            fetchAdminDashboard();
        }

        document.getElementById('save-configs-btn').addEventListener('click', async () => {
            const configs = {
                maxCredits: document.getElementById('max-credits-input').value,
                countdownLength: document.getElementById('regen-time-input').value,
                requestsAllowed: document.getElementById('allow-requests-toggle').checked
            };

            await fetch('/api/admin/update-configs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: ADMIN_PASSWORD, configs })
            });
            alert("Global session configuration updated!");
            fetchAdminDashboard();
        });

        document.getElementById('clear-queue-btn').addEventListener('click', async () => {
            if(confirm("Are you absolutely sure you want to completely clear the entire queue?")) {
                await fetch('/api/admin/clear-queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: ADMIN_PASSWORD })
                });
                fetchAdminDashboard();
            }
        });

        // Initialize and loop background sync tasks
        fetchAdminDashboard();
        setInterval(fetchAdminDashboard, 3000);
    </script>
</body>
</html>
