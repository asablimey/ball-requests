<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Admin Dashboard</title>
    <style>
        /* Base Spotify Dark Admin Theme */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }

        /* Dashboard Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .clear-msg-btn {
            background-color: #e91429;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none; /* Only shows when Messages tab is active */
        }

        .clear-msg-btn:hover {
            background-color: #ff2437;
        }

        /* Navigation Tabs Layout */
        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #282828;
            padding-bottom: 10px;
        }

        .tab-btn {
            background-color: #181818;
            color: #a7a7a7;
            border: 1px solid #282828;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: #ffffff;
            background-color: #222222;
            border-color: #535353;
        }

        .tab-btn.active {
            background-color: #1db954;
            color: #ffffff;
            border-color: #1db954;
        }

        /* Content Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        /* Lists & Card Layouts */
        .list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .no-data {
            color: #727272;
            text-align: center;
            font-style: italic;
            padding: 40px 0;
            font-size: 15px;
        }

        /* Queue / History Item Cards */
        .item-card {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .item-art {
            width: 48px;
            height: 48px;
            background-color: #282828;
            border-radius: 4px;
            object-fit: cover;
        }

        .track-details h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .track-details p {
            margin: 0;
            font-size: 14px;
            color: #b3b3b3;
        }

        .action-actions button {
            background-color: #282828;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            margin-left: 6px;
        }

        .action-actions button.btn-play {
            background-color: #1db954;
        }

        /* --- Live Messages Styling --- */
        .message-card {
            background-color: #181818;
            border: 1px solid #282828;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #232323;
            padding-bottom: 6px;
        }

        .message-tag {
            color: #1db954;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message-time {
            color: #727272;
            font-size: 12px;
        }

        .message-text {
            color: #ffffff;
            font-size: 15px;
            line-height: 1.4;
            margin: 4px 0 0 0;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1>DJ Dashboard</h1>
            <button id="clearMessagesBtn" class="clear-msg-btn">Clear Messages</button>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('queue')">Live Queue</button>
            <button class="tab-btn" onclick="switchTab('history')">History</button>
            <button class="tab-btn" onclick="switchTab('messages')">Messages</button>
        </div>

        <div id="queuePanel" class="tab-panel active">
            <div id="queueList" class="list-wrapper">
                <div class="no-data">Loading live queue...</div>
            </div>
        </div>

        <div id="historyPanel" class="tab-panel">
            <div id="historyList" class="list-wrapper">
                <div class="no-data">No songs played yet.</div>
            </div>
        </div>

        <div id="messagesPanel" class="tab-panel">
            <div id="messagesList" class="list-wrapper">
                <div class="no-data">No messages from the crowd yet.</div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching controller
        function switchTab(tabName) {
            // Remove active classes everywhere
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

            // Display and toggle corresponding elements
            const clearBtn = document.getElementById('clearMessagesBtn');
            if (tabName === 'queue') {
                document.querySelector('[onclick="switchTab(\'queue\')"]').classList.add('active');
                document.getElementById('queuePanel').classList.add('active');
                clearBtn.style.display = 'none';
            } else if (tabName === 'history') {
                document.querySelector('[onclick="switchTab(\'history\')"]').classList.add('active');
                document.getElementById('historyPanel').classList.add('active');
                clearBtn.style.display = 'none';
            } else if (tabName === 'messages') {
                document.querySelector('[onclick="switchTab(\'messages\')"]').classList.add('active');
                document.getElementById('messagesPanel').classList.add('active');
                clearBtn.style.display = 'block'; // Only reveal clear option inside messages tab
            }
        }

        // Fetch dashboard metrics and states from the express server
        async function updateDashboardData() {
            try {
                const response = await fetch('/api/admin/data');
                const data = await response.json();

                renderQueue(data.activeQueue || []);
                renderHistory(data.playedHistory || []);
                renderMessages(data.messages || []);
            } catch (err) {
                console.error("Error synchronization dashboard data:", err);
            }
        }

        // Render Active Queue Items
        function renderQueue(queue) {
            const container = document.getElementById('queueList');
            if (queue.length === 0) {
                container.innerHTML = '<div class="no-data">No songs requested yet. Be the first!</div>';
                return;
            }

            container.innerHTML = queue.map((track, index) => `
                <div class="item-card">
                    <div class="item-info">
                        <img class="item-art" src="${track.artwork || 'https://via.placeholder.com/48'}" alt="Art">
                        <div class="track-details">
                            <h3>${track.title}</h3>
                            <p>${track.artist}</p>
                        </div>
                    </div>
                    <div class="action-actions">
                        <button class="btn-play" onclick="queueAction(${index}, 'played')">Played</button>
                        <button onclick="queueAction(${index}, 'remove')">Remove</button>
                    </div>
                </div>
            `).join('');
        }

        // Render History Items
        function renderHistory(history) {
            const container = document.getElementById('historyList');
            if (history.length === 0) {
                container.innerHTML = '<div class="no-data">No songs played yet.</div>';
                return;
            }

            container.innerHTML = history.map(track => `
                <div class="item-card">
                    <div class="item-info">
                        <img class="item-art" src="${track.artwork || 'https://via.placeholder.com/48'}" alt="Art">
                        <div class="track-details">
                            <h3>${track.title}</h3>
                            <p>${track.artist}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render Crowd Messages View Panel
        function renderMessages(messages) {
            const container = document.getElementById('messagesList');
            if (messages.length === 0) {
                container.innerHTML = '<div class="no-data">No messages from the crowd yet.</div>';
                return;
            }

            // Map incoming alerts out, newest messages showing up at the top
            container.innerHTML = [...messages].reverse().map(msg => `
                <div class="message-card">
                    <div class="message-header">
                        <span class="message-tag">Guest Message</span>
                        <span class="message-time">${msg.timestamp}</span>
                    </div>
                    <p class="message-text">${escapeHTML(msg.text)}</p>
                </div>
            `).join('');
        }

        // Process song state manipulations (Play / Remove)
        async function queueAction(trackIndex, action) {
            try {
                await fetch('/api/queue/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trackIndex, action })
                });
                updateDashboardData();
            } catch (err) {
                console.error("Action transmission failure:", err);
            }
        }

        // Clear button event handler setup
        document.getElementById('clearMessagesBtn').onclick = async () => {
            if (!confirm("Are you sure you want to clear all crowd messages?")) return;
            try {
                await fetch('/api/admin/messages/clear', { method: 'POST' });
                updateDashboardData();
            } catch (err) {
                console.error("Failed to wipe message boards:", err);
            }
        };

        // Helper framework to escape text elements securely
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Execute cyclical update schedules every 3 seconds
        updateDashboardData();
        setInterval(updateDashboardData, 3000);
    </script>
</body>
</html>
