<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Control Center</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --red-action: #e91429;
            --border-color: #282828;
        }

        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 0; font-size: 1.8rem; font-weight: 800; }
        h2 { margin: 0 0 15px 0; font-size: 1.2rem; font-weight: 700; color: var(--spotify-green); }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 0.9rem;
            color: #a7a7a7;
            font-weight: 600;
        }

        input[type="number"] {
            background-color: var(--card-bg);
            border: 1px solid #333;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            width: 70px;
            font-weight: 600;
            outline: none;
            text-align: center;
        }
        input[type="number"]:focus { border-color: var(--spotify-green); }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--spotify-green); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* Message Log Container */
        .message-log-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-item {
            background: var(--card-bg);
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid var(--spotify-green);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }
        .msg-timestamp {
            font-size: 0.75rem;
            color: #666;
            font-weight: 700;
            white-space: nowrap;
        }

        .song-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #2c2c2c;
            gap: 16px;
            box-sizing: border-box;
            width: 100%;
        }

        .song-details {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .song-details img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .text-block {
            flex: 1;
            min-width: 0;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .song-title {
            font-weight: 700;
            margin: 0;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .explicit-badge {
            background-color: #7f7f7f;
            color: var(--spotify-black);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .song-artist {
            color: #a7a7a7;
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .score-badge {
            background-color: var(--panel-bg);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #a7a7a7;
            border: 1px solid #333;
            min-width: 28px;
            text-align: center;
        }
        .score-positive { color: var(--spotify-green); border-color: rgba(29, 185, 84, 0.3); }
        .score-negative { color: var(--red-action); border-color: rgba(233, 20, 41, 0.3); }

        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover { background-color: #444; }

        .btn-success { background-color: var(--spotify-green); }
        .btn-success:hover { background-color: #1ed760; }

        .btn-danger { background-color: var(--red-action); }
        .btn-danger:hover { background-color: #b80f20; }

        .empty-placeholder { color: #666; font-style: italic; text-align: center; padding: 30px 0; }

        @media (max-width: 600px) {
            .song-row { padding: 10px; gap: 10px; flex-direction: column; align-items: flex-start; }
            .actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>DJ Dashboard</h1>
            <div id="status-indicator" style="font-weight: 700; font-size: 0.9rem; color: #a7a7a7;">Syncing status...</div>
        </div>

        <div class="controls-grid">
            <div class="control-panel">
                <h2>System Settings</h2>
                <div class="control-group">
                    <div class="form-row">
                        <label for="toggle-requests">Accept Submissions</label>
                        <label class="switch">
                            <input type="checkbox" id="toggle-requests" onchange="updateToggleState()">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="form-row" style="margin-top: 5px;">
                        <label for="max-credits">Max User Credits</label>
                        <input type="number" id="max-credits" min="1" value="3" onchange="updateConfigs()">
                    </div>
                    <div class="form-row">
                        <label for="cooldown-duration">Regen Cooldown (s)</label>
                        <input type="number" id="cooldown-duration" min="5" value="60" onchange="updateConfigs()">
                    </div>
                </div>
            </div>

            <div class="control-panel" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <h2>Global Pool Management</h2>
                    <p style="color: #a7a7a7; font-size: 0.85rem; margin: 0 0 15px 0; line-height: 1.4;">
                        Perform absolute modifications over structural runtime arrays instantly.
                    </p>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-danger" onclick="triggerGlobalAction(null, 'clearQueue')">Purge Live Queue</button>
                    <button class="btn btn-danger" style="background-color: #83101b;" onclick="triggerGlobalAction(null, 'clearMessages')">Wipe Notes</button>
                    <button class="btn" style="background-color: #2c2c2c;" onclick="triggerGlobalAction(null, 'clearHistory')">Reset History</button>
                </div>
            </div>
        </div>

        <div class="header" style="border-bottom: 1px solid var(--border-color); margin-bottom: 15px;">
            <h2 style="margin: 0;">Live Guest Notes</h2>
        </div>
        <div id="dj-messages-container" class="message-log-container" style="margin-bottom: 30px;">
            <p class="empty-placeholder" style="padding: 10px 0;">No messages from the crowd yet.</p>
        </div>

        <div class="header" style="border-bottom: 1px solid var(--border-color); margin-bottom: 15px;">
            <h2 style="margin: 0;">Live Request Pipeline</h2>
        </div>
        <div id="admin-queue-list"></div>
    </div>

    <script>
        let blockSyncLoop = false;

        async function fetchAdminState() {
            if (blockSyncLoop) return; 
            try {
                const res = await fetch('/api/admin/data');
                if (!res.ok) return;
                const data = await res.json();

                document.getElementById('toggle-requests').checked = data.requestsAllowed;
                document.getElementById('max-credits').value = data.maxCredits;
                document.getElementById('cooldown-duration').value = data.countdownLength;
                
                document.getElementById('status-indicator').innerText = "System Operational";
                document.getElementById('status-indicator').style.color = "var(--spotify-green)";

                renderAdminQueue(data.queue);
                renderDJMessages(data.messages);
            } catch (e) {
                document.getElementById('status-indicator').innerText = "Syncing Lost";
                document.getElementById('status-indicator').style.color = "var(--red-action)";
            }
        }

        function renderDJMessages(messages) {
            const container = document.getElementById('dj-messages-container');
            if (!messages || messages.length === 0) {
                container.innerHTML = '<p class="empty-placeholder" style="padding: 10px 0;">No messages from the crowd yet.</p>';
                return;
            }
            container.innerHTML = messages.map(msg => `
                <div class="msg-item">
                    <span>${msg.text}</span>
                    <span class="msg-timestamp">${msg.timestamp}</span>
                </div>
            `).reverse().join('');
        }

        function renderAdminQueue(queue) {
            const display = document.getElementById('admin-queue-list');
            if (!queue || queue.length === 0) {
                display.innerHTML = '<p class="empty-placeholder">The live queue is currently empty.</p>';
                return;
            }

            display.innerHTML = queue.map((song) => {
                const upvotes = song.ups || 0;
                const downvotes = song.downs || 0;
                const netScore = upvotes - downvotes;
                
                let scoreClass = '';
                if (netScore > 0) scoreClass = 'score-positive';
                if (netScore < 0) scoreClass = 'score-negative';

                return `
                    <div class="song-row">
                        <div class="song-details">
                            <img src="${song.artwork}">
                            <div class="text-block">
                                <div class="title-wrapper">
                                    <p class="song-title">${song.title}</p>
                                    ${song.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                </div>
                                <p class="song-artist">${song.artist} • <span style="color: #666;">${song.duration}</span></p>
                            </div>
                        </div>
                        <div class="actions">
                            <div class="score-badge ${scoreClass}" title="${upvotes} Upvotes / ${downvotes} Downvotes">
                                ${netScore > 0 ? '+' : ''}${netScore}
                            </div>
                            <button class="btn btn-success" onclick="triggerGlobalAction('${song.id}', 'top')">▲ Top</button>
                            <button class="btn" onclick="triggerGlobalAction('${song.id}', 'played')">✓ Played</button>
                            <button class="btn btn-danger" onclick="triggerGlobalAction('${song.id}', 'remove')">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateToggleState() {
            blockSyncLoop = true;
            const allow = document.getElementById('toggle-requests').checked;
            try {
                await fetch('/api/admin/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ allow })
                });
            } catch (e) { console.log("Failed tracking switch toggle adjustment."); }
            blockSyncLoop = false;
            fetchAdminState();
        }

        async function updateConfigs() {
            blockSyncLoop = true;
            const maxCredits = parseInt(document.getElementById('max-credits').value) || 3;
            const countdownLength = parseInt(document.getElementById('cooldown-duration').value) || 60;
            try {
                await fetch('/api/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maxCredits, countdownLength })
                });
            } catch (e) { console.log("Failed saving settings update adjustments."); }
            blockSyncLoop = false;
            fetchAdminState();
        }

        async function triggerGlobalAction(id, action) {
            if (action === 'clearQueue' && !confirm("Wipe every item out of the active queue pool?")) return;
            if (action === 'clearHistory' && !confirm("Purge historical track memory logs?")) return;
            if (action === 'clearMessages' && !confirm("Wipe out all stored user messages from the logs?")) return;
            
            try {
                const res = await fetch('/api/admin/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, action })
                });
                if (res.ok) fetchAdminState();
            } catch (e) { console.log("Error posting dashboard actions map routing."); }
        }

        fetchAdminState();
        setInterval(fetchAdminState, 3000);
    </script>
</body>
</html>
