<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Control Panel</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 20px; }
        .box { background: #181818; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #282828; }
        input { padding: 10px; background: #222; color: white; border: 1px solid #333; border-radius: 6px; margin-right: 10px; }
        button { background: #1DB954; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 20px; cursor: pointer; }
        button.action { background: #e91429; }
        .track-item { display: flex; justify-content: space-between; padding: 10px; background: #242424; margin-bottom: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>DJ Control Center</h1>

    <div class="box">
        <h3>System Settings</h3>
        <input type="number" id="max-credits-input" placeholder="Max Credits">
        <input type="number" id="countdown-input" placeholder="Refill Window (Secs)">
        <input type="number" id="min-repeat-input" placeholder="Min Tracks Between Repeats" min="0">
        <button onclick="saveConfigs()">Save Configurations</button>
        <button id="toggle-requests-btn" class="action" onclick="toggleRequests()">Close Requests</button>
    </div>

    <div class="box">
        <h3>Queue Control Actions</h3>
        <button class="action" onclick="triggerAction('', 'clearQueue')">Clear Entire Active Queue</button>
        <button class="action" onclick="triggerAction('', 'clearHistory')">Clear History List</button>
    </div>

    <div class="box">
        <h3>Active Queue</h3>
        <div id="admin-queue"></div>
    </div>

    <script>
        let currentRequestsAllowed = true;

        async function loadAdminData() {
            const res = await fetch('/api/admin/data');
            const data = await res.json();

            document.getElementById('max-credits-input').value = data.maxCredits;
            document.getElementById('countdown-input').value = data.countdownLength;
            document.getElementById('min-repeat-input').value = data.minSongsBetweenRepeats;

            currentRequestsAllowed = data.requestsAllowed;
            const toggleBtn = document.getElementById('toggle-requests-btn');
            if (currentRequestsAllowed) {
                toggleBtn.innerText = "Close Requests";
                toggleBtn.style.background = "#e91429";
            } else {
                toggleBtn.innerText = "Open Requests";
                toggleBtn.style.background = "#1DB954";
            }

            const queueDiv = document.getElementById('admin-queue');
            queueDiv.innerHTML = data.queue.length === 0 ? '<p>No songs in queue.</p>' : '';
            
            data.queue.forEach(t => {
                const item = document.createElement('div');
                item.className = 'track-item';
                item.innerHTML = `
                    <div><strong>${t.title}</strong> - ${t.artist} (${t.votes} Votes)</div>
                    <div>
                        <button onclick="triggerAction('${t.id}', 'top')">Bump Top</button>
                        <button onclick="triggerAction('${t.id}', 'played')" style="background:#2444bf;">Mark Played</button>
                        <button class="action" onclick="triggerAction('${t.id}', 'remove')">Remove</button>
                    </div>
                `;
                queueDiv.appendChild(item);
            });
        }

        async function saveConfigs() {
            const maxCredits = document.getElementById('max-credits-input').value;
            const countdownLength = document.getElementById('countdown-input').value;
            const minSongsBetweenRepeats = document.getElementById('min-repeat-input').value;

            await fetch('/api/admin/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ maxCredits, countdownLength, minSongsBetweenRepeats })
            });
            loadAdminData();
        }

        async function toggleRequests() {
            await fetch('/api/admin/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ allow: !currentRequestsAllowed })
            });
            loadAdminData();
        }

        async function triggerAction(id, action) {
            await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, action })
            });
            loadAdminData();
        }

        setInterval(loadAdminData, 3000);
        loadAdminData();
    </script>
</body>
</html>
