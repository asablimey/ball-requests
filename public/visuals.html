<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khula:wght@600;700&display=swap">
    <title>Visuals Display</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
        }
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background-color: var(--spotify-black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; }

        /* ---------- Ambient view: full-bleed photo/video slideshow ---------- */
        #ambient-view {
            position: fixed; inset: 0; display: none; background: #000;
        }
        #ambient-view.is-visible { display: block; }
        .ambient-layer {
            position: absolute; inset: 0;
            opacity: 0; transition: opacity 1.2s ease;
        }
        .ambient-layer.is-active { opacity: 1; }
        .ambient-layer.no-fade { transition: none; }
        .ambient-layer img, .ambient-layer video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .ambient-venue-tag {
            position: absolute; left: 24px; bottom: 20px; z-index: 5;
            color: rgba(255,255,255,0.55); font-size: 0.95rem; font-weight: 600;
            font-family: 'Khula', sans-serif; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .amb-caption {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 56px 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent); color: white;
        }
        .amb-caption .t1 { font-family: 'Khula', sans-serif; font-weight: 700; font-size: 2.4rem; }
        .amb-caption .t2 { font-size: 1.1rem; color: #d8d8d8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .amb-custom {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--spotify-green), #0d7a38); color: white; padding: 60px; text-align: center;
        }
        .amb-custom-text { font-family: 'Khula', sans-serif; font-weight: 700; font-size: 4rem; line-height: 1.15; }

        /* ---------- Ambient widget slides: clock, live queue, ad ---------- */
        .amb-clock {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: var(--spotify-black); color: white;
        }
        .amb-clock-time {
            font-family: 'Khula', sans-serif; font-weight: 700; font-size: 9rem; letter-spacing: -2px; line-height: 1;
        }
        .amb-clock-date { color: #a7a7a7; font-size: 1.6rem; margin-top: 18px; }

        .amb-queue {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            color: white; padding: clamp(20px, 4.5vh, 40px) clamp(24px, 4vw, 56px); background: var(--spotify-black);
            overflow: hidden; box-sizing: border-box;
        }

        .amb-ad {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            gap: 48px; background: var(--spotify-black); color: white; padding: 60px;
        }
        .amb-ad-qr { width: 320px; height: 320px; border-radius: 16px; background: white; padding: 16px; flex-shrink: 0; }
        .amb-ad-qr img { width: 100%; height: 100%; object-fit: contain; }
        .amb-ad-text {
            font-family: 'Khula', sans-serif; font-weight: 700; font-size: 2.6rem; max-width: 640px; line-height: 1.3;
        }

        /* ---------- Queue view: fallback "up next" board ---------- */
        #queue-view {
            position: fixed; inset: 0; display: none; flex-direction: column;
            color: white; padding: clamp(20px, 4.5vh, 40px) clamp(24px, 4vw, 56px); box-sizing: border-box; overflow: hidden;
        }
        #queue-view.is-visible { display: flex; }
        .qv-header { text-align: center; margin-bottom: clamp(12px, 2.5vh, 28px); flex-shrink: 0; }
        .qv-event-name {
            font-family: 'Khula', sans-serif; font-weight: 700;
            font-size: clamp(1.6rem, 4.5vh, 2.6rem); margin: 0; letter-spacing: -0.5px;
        }
        .qv-venue-name { color: #a7a7a7; font-size: 1.1rem; margin-top: 6px; }

        .qv-now-playing {
            display: flex; align-items: center; gap: clamp(14px, 2vw, 24px);
            background: var(--panel-bg); border: 1px solid #282828; border-radius: 18px;
            padding: clamp(14px, 2.4vh, 24px) clamp(18px, 2.4vw, 28px); margin-bottom: clamp(14px, 2.8vh, 32px);
            overflow: hidden; min-width: 0; max-width: 100%; box-sizing: border-box; flex-shrink: 0;
        }
        .qv-artwork {
            display: block;
            width: clamp(64px, 12vh, 110px); height: clamp(64px, 12vh, 110px);
            max-width: clamp(64px, 12vh, 110px); max-height: clamp(64px, 12vh, 110px);
            flex: 0 0 clamp(64px, 12vh, 110px); border-radius: 10px; object-fit: cover;
            background: var(--card-bg);
        }
        .qv-np-text { flex: 1 1 auto; min-width: 0; max-width: 100%; overflow: hidden; }
        .qv-np-label {
            color: var(--spotify-green); font-size: 0.85rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 6px;
            display: flex; align-items: center; gap: 8px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .qv-live-dot {
            width: 9px; height: 9px; border-radius: 50%; background: var(--spotify-green);
            flex-shrink: 0;
            animation: qv-pulse 1.5s ease-in-out infinite;
        }
        .qv-live-dot.is-paused { animation: none; opacity: 0.3; }
        @keyframes qv-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        .qv-np-title {
            font-size: clamp(1.2rem, 3vh, 1.7rem); font-weight: 700; margin: 0 0 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .qv-np-artist {
            color: #a7a7a7; font-size: clamp(0.95rem, 2.2vh, 1.15rem); margin: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .qv-progress-track {
            width: 100%; height: 5px; background: #333; border-radius: 3px; margin-top: clamp(8px, 1.6vh, 14px); overflow: hidden;
        }
        .qv-progress-fill { height: 100%; background: var(--spotify-green); width: 0%; }

        .qv-upnext-label {
            font-family: 'Khula', sans-serif; font-size: 1.2rem; font-weight: 700;
            color: #a7a7a7; text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 clamp(8px, 1.6vh, 16px); flex-shrink: 0;
        }
        /* position:relative + min-height:0 let fitQueueRows() measure each
           row against the list's real height; rows never shrink, so
           whatever doesn't fit is hidden whole instead of half-cut. */
        .qv-list { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 12px); }
        .qv-row {
            display: flex; align-items: center; gap: 18px; flex-shrink: 0;
            background: var(--panel-bg); border: 1px solid #282828; border-radius: 12px;
            padding: clamp(8px, 1.4vh, 14px) 18px;
        }
        .qv-row-rank {
            font-family: 'Khula', sans-serif; font-size: 1.4rem; font-weight: 700;
            color: #555; width: 34px; text-align: center; flex-shrink: 0;
        }
        .qv-row img, .qv-row-art { width: clamp(40px, 6vh, 56px); height: clamp(40px, 6vh, 56px); border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--card-bg); }
        .qv-row-text { flex: 1; min-width: 0; }
        .qv-row-title { font-size: 1.15rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qv-row-artist { color: #a7a7a7; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qv-row-votes { color: var(--spotify-green); font-weight: 700; font-size: 1.1rem; flex-shrink: 0; }

        .qv-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #666; font-size: 1.3rem; text-align: center;
        }

        /* ---------- Full blackout, toggled from Admin -> Settings -> Content ---------- */
        /* Sits above both #ambient-view and #queue-view regardless of which
           is active. Purely visual - polling and slide timers keep running
           underneath, so nothing needs to resync when this switches off. */
        #mute-overlay {
            position: fixed; inset: 0; background: #000; z-index: 9999; display: none;
        }
        #mute-overlay.is-visible { display: block; }

        /* ---------- Music Video overlay: replaces ambient visuals when the
           current track has a confident YouTube match (see pollMusicVideo).
           NOTE: this used to have a full-screen click-blocker sitting on
           top of the iframe. That's removed - YouTube's Required Minimum
           Functionality policy prohibits any overlay, frame, or visual
           element in front of an embedded player, including to intercept
           clicks (https://developers.google.com/youtube/terms/required-minimum-functionality).
           Clicks now reach the iframe directly, same as any normal embed. ---------- */
        /* Always rendered (so the player can load and start in the
           background) but invisible until a video is genuinely playing -
           then it fades in over whatever ambient content was showing. */
        #video-view {
            position: fixed; inset: 0; background: #000;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #video-view.is-visible { opacity: 1; }
        /* The frame is exactly the 16:9 picture (fitted to the screen), plus
           a bit of extra room revealed at the bottom for native subtitles -
           see --yt-pad-ratio/--mv-caption-reveal on .video-frame below for
           the actual mechanics and why they're split apart. */
        /* Two independent player slots stacked on top of each other, each
           with its own YouTube player, click-blocker and loading-cover.
           Only one is ever "is-active" (on screen) at a time. Song-to-song
           video changes preload the NEXT video into the other, currently
           invisible, slot while the current one keeps playing, then flip
           which slot is active with NO transition (see swapActiveSlot in
           the script) - a true hard cut, never a fade through black or a
           dip back to ambient visuals. The very first video of a "video
           session" (coming from ambient) just loads into the already-
           active slot and reveals it the normal crossfade way below. */
        .video-slot {
            position: absolute; inset: 0; opacity: 0; pointer-events: none;
        }
        .video-slot.is-active { opacity: 1; z-index: 1; }
        .video-frame {
            /* Was 0.14, cropping away the top of the picture specifically
               to hide YouTube's own title/channel bar. That's a
               modification to the player's appearance beyond what YouTube's
               API documentation permits (see the Required Minimum
               Functionality policy linked above), so it's set to 0 -
               nothing is cropped from the top anymore. The title/channel
               bar may briefly flash in at the start of a video; that's
               YouTube's own default UI, not something to suppress. */
            --yt-pad-ratio: 0;
            /* How much extra of the iframe to reveal PAST the core
               picture's own bottom edge, on top of (not instead of) the
               --yt-pad-ratio crop above. This is the actual subtitle fix:
               YouTube draws its native captions in that same narrow strip
               just below the true picture, which a plain symmetric crop
               would clip into along with the (much smaller) bit of real
               bottom UI actually down there. Raise this if subtitles are
               still being cut off; lower it if any YouTube UI peeks back
               in at the bottom.
               NOTE: this can only be estimated without a live YouTube
               embed to check the real caption position against - it's a
               starting point, not a measured value. */
            --mv-caption-reveal: 70px;
            /* item 10: fills the screen edge to edge - no more side
               letterbox bars. The old version computed width FROM a height
               budget that had already been shrunk to reserve room for
               .mv-logo/.mv-info-pop, which meant width came out smaller
               than the actual screen even though nothing required that -
               a side effect of a height-first "contain" calculation, not
               an intentional design choice. .video-cover-fit below (not
               this element) is what actually sizes and crops the 16:9
               picture to fill this box; the overlay now simply sits
               directly on top of the video everywhere, relying on its own
               text-shadow/opacity to stay legible over moving content,
               same as it already does over ambient visuals. */
            position: absolute; inset: 0;
            overflow: hidden; background: #000;
        }
        /* item 10: the actual "cover" element - always at least as big as
           the full screen at a genuine 16:9 ratio, cropping whichever axis
           overflows, instead of ever shrinking to avoid cropping. Standard
           CSS pattern for covering a box with a fixed-aspect element: sized
           full-width at 16:9 height, OR (via min-width/min-height, whichever
           actually ends up larger) full-height at 16:9 width - exactly one
           of the two constraints binds on a given screen and the other
           overflows, centered by the translate below. */
        .video-cover-fit {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 56.25vw; /* 16:9 at full viewport width */
            min-width: 177.78vh; min-height: 100vh; /* 16:9 at full viewport height */
            transform: translate(-50%, -50%);
        }
        /* top/height below are expressed against (100% - reveal) rather
           than .video-cover-fit's raw 100%, because that box is now taller
           than the pure 16:9 picture by exactly --mv-caption-reveal (see
           above) - (100% - reveal) recovers "the core picture's own
           height" to crop the TOP edge against, while the extra revealed
           strip at the bottom is left alone rather than also being
           cropped. Unchanged by item 10 - only the containing block
           (.video-cover-fit, sized above) changed, not this math. */
        .video-frame .yt-player-el, .video-frame .yt-player-el iframe {
            position: absolute; left: 0;
            top: calc(-1 * (100% - var(--mv-caption-reveal)) * var(--yt-pad-ratio));
            width: 100% !important;
            height: calc((100% - var(--mv-caption-reveal)) * (1 + 2 * var(--yt-pad-ratio)) + var(--mv-caption-reveal)) !important;
            border: 0;
        }
        /* Covers a slot's iframe any time IT'S the active slot and its video
           isn't confirmed actively PLAYING - loading, buffering, cued,
           paused, ended. YouTube's own UI for all of those (the big play
           button before autoplay kicks in, the paused/"suggested videos"
           screen, the end-of-video screen) shows underneath this and is
           never seen. Opaque black so it reads as a normal hard cut, same
           as any other slide change on this screen. The standby slot's
           cover is irrelevant while it's off screen (opacity 0 already
           hides everything in it), and is put back the instant it stops
           being active so it's ready next time it's reused. */
        .video-loading-cover {
            position: absolute; inset: 0; z-index: 6; background: #000; opacity: 1;
        }
        /* Fades out (never pops) so there's no flash when it lifts; it
           comes back instantly, so YouTube's UI never gets a frame in. */
        .video-loading-cover.is-hidden { opacity: 0; transition: opacity 0.3s ease; }
        /* Used ONLY by completeHandoff()'s song-to-song hard cut. Unlike
           .is-hidden above (which fades over 0.3s - right for the FIRST
           video's reveal out of a loading state), this snaps instantly
           with no transition at all. By the time completeHandoff() applies
           this, the incoming video is already confirmed playing in sync -
           there's nothing to smooth over, and re-using .is-hidden's fade
           here was the actual cause of the visible black gap between
           videos: for that 0.3s, the viewer was looking at this cover
           itself, mid-fade, on top of an already-playing video. */
        .video-loading-cover.is-hidden-instant { opacity: 0; transition: none; }

        /* ---------- Music Video overlay: logo + now-playing popup ----------
           Sit above both slots (z-index above the loading covers) so they
           survive song-to-song handoffs untouched - only their own
           visibility classes change, never their DOM position. The logo
           stays up, gently dimmed, for as long as any video is genuinely
           on screen; the song-info popup only shows itself in the first
           and last MV_INFO_POPUP_WINDOW_SEC of each individual video (see
           mvUpdateOverlay), and is otherwise invisible.

           COMPLIANCE FLAG (not yet resolved): YouTube's Required Minimum
           Functionality policy prohibits ANY overlay in front of an
           embedded player, full stop - this includes .mv-logo and
           .mv-info-pop below, even at partial opacity and even though
           they don't intercept clicks. Removing the click-blocker and top
           crop (elsewhere in this file) was safe to do unilaterally; this
           one is a product decision, not a pure bugfix, since it means
           this station's own logo/song-info can't be shown over the video
           itself. Options: move this info to a bar above/below the video
           (outside the actual player area) instead of on top of it, or
           drop it while a video is playing and only show it during
           ambient visuals. Left in place until a direction is chosen. */
        .mv-logo {
            position: absolute; right: 32px; bottom: 28px; z-index: 8;
            height: 34px; width: auto; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease;
        }
        .mv-logo.is-visible { opacity: 0.55; }

        .mv-info-pop {
            position: absolute; left: 40px; bottom: 26px; z-index: 8;
            max-width: 60%; pointer-events: none; opacity: 0;
            transition: opacity 0.6s ease; text-shadow: 0 2px 12px rgba(0,0,0,0.85);
        }
        .mv-info-pop.is-visible { opacity: 1; }
        .mv-info-title {
            font-family: 'Khula', sans-serif; font-weight: 700; color: #fff;
            font-size: clamp(1.3rem, 2.6vh, 1.9rem); line-height: 1.15;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .mv-info-artist {
            color: #d8d8d8; font-size: clamp(0.85rem, 1.6vh, 1.05rem); margin-top: 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Ambient Visuals: driven entirely by the Music Scheduler's Ambient
         Visuals blocks. Two stacked layers crossfade between slides so a
         photo/video change never hard-cuts to black. -->
    <div id="ambient-view">
        <div class="ambient-layer" id="ambient-layer-a"></div>
        <div class="ambient-layer" id="ambient-layer-b"></div>
        <div class="ambient-venue-tag" id="ambient-venue-tag"></div>
    </div>

    <!-- Fallback board: shown whenever no Ambient Visuals block is currently
         scheduled, so the screen is never just dead/black between blocks. -->
    <div id="queue-view">
        <div class="qv-header">
            <h1 class="qv-event-name" id="qv-event-name">Now Playing</h1>
            <div class="qv-venue-name" id="qv-venue-name"></div>
        </div>
        <div class="qv-now-playing" id="qv-now-playing" style="display:none;">
            <img class="qv-artwork" id="qv-artwork" src="" alt="">
            <div class="qv-np-text">
                <p class="qv-np-label"><span class="qv-live-dot" id="qv-live-dot"></span> Now Playing</p>
                <p class="qv-np-title" id="qv-np-title"></p>
                <p class="qv-np-artist" id="qv-np-artist"></p>
                <div class="qv-progress-track"><div class="qv-progress-fill" id="qv-progress-fill"></div></div>
            </div>
        </div>
        <div class="qv-upnext-label">Up Next</div>
        <div class="qv-list" id="qv-list"></div>
    </div>

    <!-- Music Video overlay: shown in place of Ambient Visuals whenever the
         current track has a confident YouTube match. Never shown at the
         same time as the forced Show Queue override (Admin -> Settings ->
         Content), which always wins - see pollMusicVideo. -->
    <div id="video-view">
        <div class="video-slot is-active" id="video-slot-a">
            <div class="video-frame"><div class="video-cover-fit"><div class="yt-player-el" id="yt-player-a"></div></div></div>
            <div class="video-loading-cover" id="video-loading-cover-a"></div>
        </div>
        <div class="video-slot" id="video-slot-b">
            <div class="video-frame"><div class="video-cover-fit"><div class="yt-player-el" id="yt-player-b"></div></div></div>
            <div class="video-loading-cover" id="video-loading-cover-b"></div>
        </div>
        <div class="mv-info-pop" id="mv-info-pop">
            <div class="mv-info-title" id="mv-info-title"></div>
            <div class="mv-info-artist" id="mv-info-artist"></div>
        </div>
        <img class="mv-logo" id="mv-logo" src="/assets/crowddj-logo-white.svg" alt="">
    </div>

    <div id="mute-overlay"></div>

    <!-- The YouTube IFrame API is loaded dynamically (with automatic retry
         if it fails) from inside the script below, not as a static tag -
         see loadYouTubeApi(). -->
    <script>
        const EVENT_SLUG = location.pathname.split('/')[2] || '';
        function eventUrl(p) { return `/e/${EVENT_SLUG}${p}`; }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }


        function safeImageUrl(url) {
            return typeof url === 'string' && /^https?:\/\//i.test(url) ? url : '';
        }

        /* =========================================================
           Shared "Now Playing" progress bar
           The old bars measured elapsed time from when THIS page received
           the reading, but the reading itself was already up to a few
           seconds old (it's whatever the server last got from Spotify).
           So every 4s poll the bar was re-based onto a differently-stale
           number and visibly jumped backwards/forwards. This tracker:
             - back-dates each reading using the server's own capture
               time (updatedAt) when the two clocks plausibly agree,
             - keeps counting through small disagreements instead of
               re-basing on every poll (only real seeks / track changes /
               play-pause snap),
             - owns exactly one timer, which dispose() always clears, so
               a torn-down widget can never keep painting a bar that a
               newer copy of the widget is also painting.
           ========================================================= */
        const PROGRESS_MAX_PLAUSIBLE_AGE_MS = 15000;
        const PROGRESS_FORWARD_SNAP_MS = 600;
        const PROGRESS_BACK_SNAP_CORRECTED_MS = 1500;
        const PROGRESS_BACK_SNAP_UNCORRECTED_MS = 6000;

        function makeProgressTracker(getFillEl) {
            let s = null;
            let timer = null;

            const currentMs = () => {
                if (!s) return 0;
                const ms = s.baseMs + (s.isPlaying ? Date.now() - s.baseAt : 0);
                return Math.max(0, s.durationMs ? Math.min(ms, s.durationMs) : ms);
            };
            const paint = () => {
                const el = getFillEl();
                if (!el) return;
                const pct = s && s.durationMs ? (currentMs() / s.durationMs) * 100 : 0;
                el.style.width = pct.toFixed(2) + '%';
            };
            const ensureTimer = () => { if (!timer) timer = setInterval(paint, 250); };
            const stopTimer = () => { if (timer) { clearInterval(timer); timer = null; } };

            return {
                update(np) {
                    const now = Date.now();
                    const age = np.isPlaying && typeof np.updatedAt === 'number' ? now - np.updatedAt : 0;
                    const corrected = age >= 0 && age <= PROGRESS_MAX_PLAUSIBLE_AGE_MS && np.isPlaying;
                    const estimate = (np.progressMs || 0) + (corrected ? age : 0);
                    const next = { trackId: np.trackId || null, durationMs: np.durationMs || 0, isPlaying: !!np.isPlaying };

                    const sameTrack = s && next.trackId && s.trackId === next.trackId;
                    if (sameTrack && s.isPlaying && next.isPlaying) {
                        const diff = estimate - currentMs();
                        const backLimit = corrected ? PROGRESS_BACK_SNAP_CORRECTED_MS : PROGRESS_BACK_SNAP_UNCORRECTED_MS;
                        if (diff > -backLimit && diff <= PROGRESS_FORWARD_SNAP_MS) {
                            s.durationMs = next.durationMs; // close enough - keep counting undisturbed
                            ensureTimer();
                            return;
                        }
                    }
                    s = { ...next, baseMs: estimate, baseAt: now };
                    paint();
                    ensureTimer();
                },
                clear() {
                    stopTimer();
                    s = null;
                    paint();
                },
                dispose() {
                    stopTimer();
                    s = null;
                }
            };
        }

        /* =========================================================
           Shared "Up Next" list
           Guest requests come first (with their net votes), followed by
           whatever Spotify has lined up after them - the same merge the
           guest page and kiosk do. Before, only guest requests were
           shown, so any time nobody had requested anything the board
           read "No requests queued" even with a full Spotify queue.
           ========================================================= */
        const QUEUE_MAX_ROWS = 12;

        function buildQueueRows(requests, upcoming) {
            const reqs = (requests || []).map(r => ({ ...r, isRequest: true }));
            const reqIds = new Set(reqs.map(r => r.id));
            const extra = (upcoming || []).filter(t => t && !reqIds.has(t.id)).map(t => ({ ...t, isRequest: false }));
            return [...reqs, ...extra].slice(0, QUEUE_MAX_ROWS);
        }

        function queueRowHtml(song, idx) {
            const art = safeImageUrl(song.artwork);
            let votes = '';
            if (song.isRequest) {
                const net = (song.ups || 0) - (song.downs || 0);
                votes = `<div class="qv-row-votes">${net > 0 ? '+' : ''}${net}</div>`;
            }
            return `
                <div class="qv-row">
                    <div class="qv-row-rank">${idx + 1}</div>
                    ${art ? `<img src="${escapeHtml(art)}" alt="">` : '<div class="qv-row-art"></div>'}
                    <div class="qv-row-text">
                        <div class="qv-row-title">${escapeHtml(song.title)}</div>
                        <div class="qv-row-artist">${escapeHtml(song.artist)}</div>
                    </div>
                    ${votes}
                </div>`;
        }

        // Hides any row that wouldn't fully fit, so the list never ends on
        // a half-cut row. Cheap enough to re-run on resize / view change.
        function fitQueueRows(listEl) {
            if (!listEl) return;
            const rows = [...listEl.querySelectorAll('.qv-row')];
            rows.forEach(r => { r.style.display = ''; });
            const limit = listEl.clientHeight;
            if (!limit) return;
            let cut = false;
            rows.forEach(r => {
                if (cut || r.offsetTop + r.offsetHeight > limit + 1) { r.style.display = 'none'; cut = true; }
            });
        }
        function refitAllQueueLists() {
            document.querySelectorAll('.qv-list').forEach(fitQueueRows);
        }
        window.addEventListener('resize', refitAllQueueLists);

        // Only touches the DOM when the list actually changed - rebuilding
        // identical rows every poll made every artwork reload and flash.
        function applyQueueList(listEl, requests, upcoming) {
            if (!listEl) return;
            const rows = buildQueueRows(requests, upcoming);
            const sig = rows.map(r => [r.id, r.title, r.artist, r.ups, r.downs, r.isRequest ? 1 : 0].join('|')).join(';');
            if (listEl.dataset.sig !== sig) {
                listEl.dataset.sig = sig;
                listEl.innerHTML = rows.length === 0
                    ? '<div class="qv-empty">Nothing queued right now</div>'
                    : rows.map(queueRowHtml).join('');
            }
            fitQueueRows(listEl);
        }

        /* =========================================================
           Ambient Visuals slideshow
           - Polls /api/ambient-visuals. When active, cycles through the
             resolved item list: photos/queue/clock/ad hold for their own
             durationSec, videos play to completion, then it advances to the
             next item and loops.
           - A single active:false reply is NOT treated as "off" - the
             scheduler API deliberately returns that for any brief gap
             between blocks, and blanking the screen on every gap would be
             worse than just holding the last slide a little longer. Only
             after a few consecutive inactive polls does this fall back to
             the queue view.
           ========================================================= */
        let ambientItems = [];
        let ambientRuleId = null;
        let ambientIndex = 0;
        let ambientAdvanceTimer = null;
        let ambientInactiveStreak = 0;
        const AMBIENT_INACTIVE_TOLERANCE = 2; // consecutive misses before falling back

        // Admin -> Settings -> Content overrides, read from every
        // /api/ambient-visuals poll below (see pollAmbientVisuals).
        let visualsForceQueue = false;
        function applyMuteOverlay(muted) {
            document.getElementById('mute-overlay').classList.toggle('is-visible', !!muted);
        }

        // Anything a widget slide (clock/queue) sets up while it's on
        // screen - a ticking clock or a refreshing queue poll - gets torn
        // down the moment the slide changes so it doesn't keep running
        // (and fighting the next slide's own timers) underneath.
        let slideCleanup = null;
        function clearSlideCleanup() {
            if (slideCleanup) { slideCleanup(); slideCleanup = null; }
        }

        let activeLayer = 'a';
        function layerEl(which) { return document.getElementById(`ambient-layer-${which}`); }

        function showView(name) {
            document.getElementById('ambient-view').classList.toggle('is-visible', name === 'ambient');
            document.getElementById('queue-view').classList.toggle('is-visible', name === 'queue');
            document.getElementById('video-view').classList.toggle('is-visible', name === 'video');
            requestAnimationFrame(refitAllQueueLists);
        }

        function clearAmbientAdvanceTimer() {
            if (ambientAdvanceTimer) { clearTimeout(ambientAdvanceTimer); ambientAdvanceTimer = null; }
        }

        function renderClockInto(el) {
            el.innerHTML = `
                <div class="amb-clock">
                    <div class="amb-clock-time" id="amb-clock-time"></div>
                    <div class="amb-clock-date" id="amb-clock-date"></div>
                </div>`;
            const timeEl = el.querySelector('#amb-clock-time');
            const dateEl = el.querySelector('#amb-clock-date');
            const tick = () => {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            };
            tick();
            const intervalId = setInterval(tick, 1000);
            return () => clearInterval(intervalId);
        }

        function renderQueueInto(el) {
            let disposed = false;
            let requests = [];
            let upcoming = [];
            const tracker = makeProgressTracker(() => el.querySelector('#amb-qv-progress-fill'));

            el.innerHTML = `
                <div class="amb-queue">
                    <div class="qv-header">
                        <h1 class="qv-event-name" id="amb-qv-event-name">Now Playing</h1>
                        <div class="qv-venue-name" id="amb-qv-venue-name"></div>
                    </div>
                    <div class="qv-now-playing" id="amb-qv-now-playing" style="display:none;">
                        <img class="qv-artwork" id="amb-qv-artwork" src="" alt="">
                        <div class="qv-np-text">
                            <p class="qv-np-label"><span class="qv-live-dot" id="amb-qv-live-dot"></span> Now Playing</p>
                            <p class="qv-np-title" id="amb-qv-np-title"></p>
                            <p class="qv-np-artist" id="amb-qv-np-artist"></p>
                            <div class="qv-progress-track"><div class="qv-progress-fill" id="amb-qv-progress-fill"></div></div>
                        </div>
                    </div>
                    <div class="qv-upnext-label">Up Next</div>
                    <div class="qv-list" id="amb-qv-list"></div>
                </div>`;

            const renderList = () => applyQueueList(el.querySelector('#amb-qv-list'), requests, upcoming);

            const refresh = async () => {
                try {
                    const [kioskRes, npRes] = await Promise.all([
                        fetch(eventUrl('/kiosk-data')),
                        fetch(eventUrl('/api/now-playing'))
                    ]);
                    // This slide may have been torn down while those were in
                    // flight - never touch the DOM or start timers after that.
                    if (disposed) return;
                    if (kioskRes.ok) {
                        const data = await kioskRes.json();
                        if (disposed) return;
                        const nameEl = el.querySelector('#amb-qv-event-name');
                        const venueEl = el.querySelector('#amb-qv-venue-name');
                        if (nameEl) nameEl.innerText = data.eventName || 'Now Playing';
                        if (venueEl) venueEl.innerText = data.venueName || '';
                        requests = data.queue || [];
                    }
                    if (npRes.ok) {
                        const np = await npRes.json();
                        if (disposed) return;
                        const card = el.querySelector('#amb-qv-now-playing');
                        if (np && np.connected && np.title) {
                            upcoming = np.upcoming || [];
                            if (card) {
                                card.style.display = 'flex';
                                const artEl = el.querySelector('#amb-qv-artwork');
                                const art = safeImageUrl(np.artwork);
                                if (artEl && artEl.getAttribute('src') !== art) artEl.setAttribute('src', art);
                                el.querySelector('#amb-qv-np-title').innerText = np.title;
                                el.querySelector('#amb-qv-np-artist').innerText = np.artist || '';
                                el.querySelector('#amb-qv-live-dot').classList.toggle('is-paused', !np.isPlaying);
                            }
                            tracker.update(np);
                        } else {
                            upcoming = [];
                            if (card) card.style.display = 'none';
                            tracker.clear();
                        }
                    }
                    renderList();
                } catch (e) { /* keep showing whatever's already there */ }
            };
            refresh();
            const intervalId = setInterval(refresh, 4000);
            return () => {
                disposed = true;
                clearInterval(intervalId);
                tracker.dispose();
            };
        }

        function renderAdInto(el, item) {
            const qrSrc = item.adQrUrl
                ? `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(item.adQrUrl)}`
                : '';
            el.innerHTML = `
                <div class="amb-ad">
                    ${qrSrc ? `<div class="amb-ad-qr"><img src="${escapeHtml(qrSrc)}" alt="QR code"></div>` : ''}
                    ${item.adText ? `<div class="amb-ad-text">${escapeHtml(item.adText)}</div>` : ''}
                </div>`;
            return null;
        }

        function renderAmbientSlide() {
            if (ambientItems.length === 0) return;
            const item = ambientItems[ambientIndex % ambientItems.length];
            const incoming = activeLayer === 'a' ? 'b' : 'a';
            const outgoing = activeLayer;
            const incomingEl = layerEl(incoming);

            clearAmbientAdvanceTimer();
            clearSlideCleanup();

            const caption = (item.captionTitle || '').trim() || (item.captionSubtitle || '').trim()
                ? `<div class="amb-caption">${item.captionTitle ? `<div class="t1">${escapeHtml(item.captionTitle)}</div>` : ''}${item.captionSubtitle ? `<div class="t2">${escapeHtml(item.captionSubtitle)}</div>` : ''}</div>`
                : '';
            const mediaStyle = `object-fit:${item.fit || 'cover'}; object-position:${item.position || 'center'}; filter:brightness(${item.brightness || 100}%);`;

            if (item.type === 'video') {
                incomingEl.innerHTML = `<video src="${escapeHtml(item.url)}" autoplay muted playsinline style="${mediaStyle}"></video>${caption}`;
            } else if (item.type === 'photo') {
                incomingEl.innerHTML = `<img src="${escapeHtml(item.url)}" alt="" style="${mediaStyle}">${caption}`;
            } else if (item.type === 'clock') {
                slideCleanup = renderClockInto(incomingEl);
            } else if (item.type === 'queue') {
                slideCleanup = renderQueueInto(incomingEl);
            } else if (item.type === 'ad') {
                renderAdInto(incomingEl, item);
            } else if (item.type === 'custom') {
                incomingEl.innerHTML = `<div class="amb-custom" style="filter:brightness(${item.brightness || 100}%);"><div class="amb-custom-text">${escapeHtml(item.text || '')}</div></div>`;
            }

            // Crossfade: bring the new layer in, then drop the old one out.
            // A 'cut' transition skips the fade entirely for an instant swap.
            const skipFade = item.transition === 'cut';
            incomingEl.classList.toggle('no-fade', skipFade);
            layerEl(outgoing).classList.toggle('no-fade', skipFade);
            requestAnimationFrame(() => {
                incomingEl.classList.add('is-active');
                layerEl(outgoing).classList.remove('is-active');
            });
            activeLayer = incoming;

            // With only one item there's nothing to advance to - scheduling
            // the usual timer just re-runs this same slide from scratch on
            // a loop, which visibly crossfades to black and back in for no
            // reason. Let it sit instead: a video loops quietly in place,
            // and everything else (photo, clock, queue, ad, custom) simply
            // stays on screen with no timer at all.
            if (ambientItems.length <= 1) {
                if (item.type === 'video') {
                    incomingEl.querySelector('video').loop = true;
                }
                return;
            }

            if (item.type === 'video') {
                const videoEl = incomingEl.querySelector('video');
                videoEl.onended = advanceAmbientSlide;
                // Safety net in case a video fails to fire 'ended' (broken
                // file, stalled network) - don't let the slideshow get stuck.
                ambientAdvanceTimer = setTimeout(advanceAmbientSlide, 90000);
            } else {
                ambientAdvanceTimer = setTimeout(advanceAmbientSlide, (item.durationSec || 8) * 1000);
            }
        }

        function advanceAmbientSlide() {
            ambientIndex = (ambientIndex + 1) % ambientItems.length;
            renderAmbientSlide();
        }

        async function pollAmbientVisuals() {
            // The Music Video overlay owns the screen once a video is
            // actually on screen (not while it's still loading behind the
            // scenes) - this poll isn't allowed to switch the view out from
            // under it. Its own ambient state naturally goes stale while
            // paused here; the hand-back resets it so the next call renders
            // a fresh slide rather than assuming whatever was mid-flight is
            // still valid.
            if (mvRevealed) return;
            try {
                const res = await fetch(eventUrl('/api/ambient-visuals'));
                if (!res.ok) return;
                const data = await res.json();

                applyMuteOverlay(data.muted);

                const forceQueue = !!data.showQueue;
                if (forceQueue && !visualsForceQueue) {
                    // Just switched on: stop whatever ambient content is
                    // running and pin the fallback board up until this is
                    // switched off again from Admin -> Settings -> Content.
                    clearAmbientAdvanceTimer();
                    clearSlideCleanup();
                    showView('queue');
                } else if (!forceQueue && visualsForceQueue) {
                    // Just switched off: forget the last-known ambient state
                    // so the logic below treats this like a fresh block
                    // becoming active and restarts a slide from scratch,
                    // rather than assuming nothing changed while pinned.
                    ambientItems = [];
                    ambientRuleId = null;
                    ambientInactiveStreak = 0;
                }
                visualsForceQueue = forceQueue;
                if (visualsForceQueue) return;

                if (!data.active) {
                    ambientInactiveStreak++;
                    if (ambientInactiveStreak >= AMBIENT_INACTIVE_TOLERANCE) {
                        clearAmbientAdvanceTimer();
                        clearSlideCleanup();
                        ambientItems = [];
                        ambientRuleId = null;
                        showView('queue');
                    }
                    return;
                }
                ambientInactiveStreak = 0;

                const ruleChanged = data.ruleId !== ambientRuleId;
                ambientRuleId = data.ruleId;

                if (ruleChanged || ambientItems.length === 0) {
                    ambientItems = data.items || [];
                    ambientIndex = 0;
                    showView('ambient');
                    renderAmbientSlide();
                } else {
                    // Same block still active - just keep its item list fresh
                    // in case a file was added/removed, without restarting
                    // whatever is currently on screen.
                    ambientItems = data.items || [];
                    showView('ambient');
                }
            } catch (e) { /* keep showing whatever's already on screen */ }
        }

        /* =========================================================
           Fallback queue board
           ========================================================= */
        let boardRequests = [];
        let boardUpcoming = [];
        const boardTracker = makeProgressTracker(() => document.getElementById('qv-progress-fill'));

        function renderQueueList() {
            applyQueueList(document.getElementById('qv-list'), boardRequests, boardUpcoming);
        }

        // Latest known title/artist for whatever's currently playing - the
        // Music Video overlay's song-info popup (mvUpdateOverlay) reads
        // these directly rather than polling its own copy, since a video is
        // only ever shown for the track that's actually playing.
        let npLiveTitle = '';
        let npLiveArtist = '';

        function updateNowPlaying(data) {
            const card = document.getElementById('qv-now-playing');
            if (!data || !data.connected || !data.title) {
                card.style.display = 'none';
                boardTracker.clear();
                boardUpcoming = [];
                renderQueueList();
                npLiveTitle = '';
                npLiveArtist = '';
                return;
            }
            card.style.display = 'flex';
            const artEl = document.getElementById('qv-artwork');
            const art = safeImageUrl(data.artwork);
            if (artEl.getAttribute('src') !== art) artEl.setAttribute('src', art);
            document.getElementById('qv-np-title').innerText = data.title;
            document.getElementById('qv-np-artist').innerText = data.artist || '';
            npLiveTitle = data.title;
            npLiveArtist = data.artist || '';
            document.getElementById('qv-live-dot').classList.toggle('is-paused', !data.isPlaying);

            boardTracker.update(data);
            boardUpcoming = data.upcoming || [];
            renderQueueList();
        }

        async function pollQueueBoard() {
            try {
                const res = await fetch(eventUrl('/kiosk-data'));
                if (!res.ok) return;
                const data = await res.json();
                document.getElementById('qv-event-name').innerText = data.eventName || 'Now Playing';
                document.getElementById('qv-venue-name').innerText = data.venueName || '';
                boardRequests = data.queue || [];
                renderQueueList();
            } catch (e) { /* keep showing last known board */ }
        }

        async function pollNowPlaying() {
            try {
                const res = await fetch(eventUrl('/api/now-playing'));
                if (!res.ok) return;
                updateNowPlaying(await res.json());
            } catch (e) { /* keep last known state */ }
        }

        /* =========================================================
           Music Video overlay (YouTube)
           - Polls /api/music-video. When the current track has a
             confident match, tears down ambient visuals and plays the
             video (muted, no UI, no interaction) roughly in sync with
             Spotify's reported progress, resyncing on drift.
           - If a video repeatedly needs a large correction even after
             seeking - a sign it just doesn't track the song's timeline
             at all, not normal buffering jitter - this gives up on it,
             reports it back to the server so it's never offered again
             for this track (see MV_MAX_BIG_DRIFT_CHECKS below), and falls back to ambient visuals immediately.
           - Never overrides the forced Show Queue setting (Admin ->
             Settings -> Content) - that always wins, same as it does
             over ambient visuals.
           - Falls straight back to whatever pollAmbientVisuals would
             otherwise be showing the moment there's no match. This
             feature never blanks the screen on its own - it only ever
             substitutes for the ambient layer.
           ========================================================= */
        /* ---- Two-slot player model ----
           Two YouTube players ("a" and "b") sit stacked on top of each
           other; only one is ever the "active" (on-screen) slot at a time.
           When one song's video hands off to the next song's video, the
           incoming video is preloaded into the OTHER, still-invisible slot
           while the current one keeps playing normally, and only once the
           incoming one is confirmed genuinely playing AND in sync does the
           screen swap which slot is active - with no CSS transition, i.e.
           a hard cut, so two music videos in a row are never separated by
           black or by a glimpse of ambient visuals. The very first video of
           a "video session" (coming from ambient, nothing on screen yet)
           has nothing to cut from, so it just loads into the already-active
           slot and reveals it the original crossfade way. */
        function makePlayerState() {
            return {
                yt: null, ready: false,
                lastReading: null, lastReadingChangedAt: 0,
                currentRate: 1,
                seekIssuedAt: null,
                loadTimeout: null
            };
        }
        const players = { a: makePlayerState(), b: makePlayerState() };
        let activeSlot = 'a';
        let musicVideoActive = false;   // a video has been chosen for the current song and is loading/playing
        let mvRevealed = false;         // ...and is actually on screen (ambient visuals stand down only then)
        // Item 6: the cold-start reveal used to fire off a bare PLAYING +
        // fixed-delay timer (mvRevealTimer/MV_REVEAL_DELAY_MS), with no
        // drift check at all - unlike the song-to-song handoff path
        // (pendingCheck/completeHandoff below), which already requires
        // confirmed PLAYING + in-sync before cutting over. Replaced with
        // the same confirm-gate, via revealReadyCheck() below - see
        // checkSlotConfirmedInSync, the helper the two paths now share.
        // mvRevealReadySince plays the same role here that pendingReadySince
        // plays for the handoff path: when the active slot first looked
        // ready to reveal, reset to null the moment it isn't - must hold
        // for MV_HANDOFF_CONFIRM_MS continuously before revealMusicVideo()
        // actually runs.
        let mvRevealReadySince = null;
        let mvCorrectingActive = false; // item 7 - true while an on-screen hard-seek correction is
                                          // deliberately hidden behind the cover, waiting to be confirmed
                                          // back in sync before it's shown again
        let mvCorrectingReadySince = null;
        let mvLoadTimeout = null;
        const MV_LOAD_TIMEOUT_MS = 15000; // never confirmed ready to reveal in this long -> give up on it (see revealReadyCheck)
        let currentVideoTrackId = null;   // trackId/videoId of the video currently ON SCREEN (or loading into it)
        let currentVideoId = null;
        let mvDriftInterval = null;
        let mvConsecutiveBigDrifts = 0;
        let mvSubtitlesEnabled = false;
        // RULE: once a video is on screen and playing, it finishes. These
        // support that: a video is never torn down for drift or a passing
        // "no match" reading - only for an admin override, a genuinely new
        // song, or a hard playback error that a couple of reloads can't fix.
        let mvFlaggedBad = false;        // drifted badly while on screen: kept playing, blacklisted for next time
        let mvErrorRetries = 0;          // reload attempts after a mid-play player error
        let mvSoftMissSince = null;      // first "no match" reading for the SAME song (or no song info at all)
        const MV_SOFT_MISS_GRACE_MS = 20000;
        const MV_FLAGGED_SETTLE_MS = 15000; // flagged video is re-seeked at most this often (no black flashing)
        const MV_MAX_ERROR_RETRIES = 2;

        // The next song's video, preloading in the background slot while
        // the current one is still up. Cleared the moment it either cuts
        // over (completeHandoff) or gives up (handoff timeout / error).
        let pendingSlot = null;
        let pendingVideoId = null;
        let pendingTrackId = null;
        let pendingReadySince = null;   // when it first looked ready to cut to - must hold for MV_HANDOFF_CONFIRM_MS
        let pendingLoadTimeout = null;
        const MV_HANDOFF_CONFIRM_MS = 400;  // must be confirmed PLAYING + in sync this long before cutting to it
        const MV_HANDOFF_TIMEOUT_MS = 15000; // never settles into sync this long -> drop it, keep current video up

        /* ---- Sync model ----
           mvClock.base is the (display-clock) moment the song was at 0:00,
           so song position now = Date.now() - base. It is rebuilt from each
           poll using only SERVER timestamps for the age of Spotify's reading
           (so this screen's clock being off can't shift the video), and
           smoothed so Spotify's own +/- few hundred ms progress jitter is
           averaged out instead of being chased with constant seeks. */
        let mvClock = null;
        let mvSeekLatencyMs = 800;   // learned: how long a load/seek takes to actually resume - shared by both slots
        let mvLastCorrectionAt = 0;
        // The YouTube player's time reading may update in coarse steps rather
        // than continuously, which would make the video look further behind
        // than it is. So it's sampled often, and the moment the reading last
        // CHANGED is used to extrapolate to "now" (no effect if it already
        // updates smoothly). Tracks whichever slot is currently active.
        let mvLastReading = null;
        let mvLastReadingChangedAt = 0;
        let mvSampleCount = 0;
        const MV_SAMPLE_INTERVAL_MS = 50;
        const MV_CHECK_EVERY_N_SAMPLES = 16; // decisions every ~800 ms - infrequent on purpose, see below
        const MV_NUDGE_START_MS = 300;    // start speed-nudging beyond this drift - widened so small/normal
        const MV_NUDGE_STOP_MS = 150;     // jitter never triggers a visible nudge; the fixed lead below
        const MV_SEEK_THRESHOLD_MS = 900; // does the actual work now, this is just a safety net for real drift
        const MV_POST_REVEAL_SEEK_THRESHOLD_MS = 1800; // item 7 - once a video is genuinely ON SCREEN,
                                                         // don't reach for a hard seek until drift is well
                                                         // past the pre-reveal/handoff tolerance above. Rate-
                                                         // nudging (invisible) absorbs everything under this;
                                                         // a hard seek this wide should be rare for a genuine
                                                         // same-master video once the initial lock is good.
        const MV_SETTLE_MS = 4000;        // grace after a load/seek before judging it
        const MV_BIG_DRIFT_MS = 3000;
        // How long the song-info popup shows itself at the start and end of
        // each individual video (not the song) - see mvUpdateOverlay.
        const MV_INFO_POPUP_WINDOW_SEC = 15;
        // Two settled checks in a row still this far out = the video can't
        // sync at all: blacklist it and fall back to ambient visuals.
        const MV_MAX_BIG_DRIFT_CHECKS = 2;

        function otherSlot(slot) { return slot === 'a' ? 'b' : 'a'; }

        // The YouTube IFrame API loads over the network like anything else,
        // and can fail or silently never call back after a network blip -
        // seen in practice after things like a WiFi reconnect on the
        // display device. Rather than leave the display stuck on ambient/
        // queue until someone notices and manually reloads the page, this
        // loads it dynamically and keeps retrying (with backoff, forever)
        // until YT.Player actually shows up. Once it does, onReady below
        // also re-kicks any video load that was already waiting on a slot,
        // so a request that arrived during an outage isn't lost - it just
        // resolves late instead of being dropped.
        let ytApiWatchdog = null;
        let ytApiLoadAttempts = 0;
        function loadYouTubeApi() {
            if (window.YT && window.YT.Player) return; // already loaded (e.g. a retry raced a late success)
            ytApiLoadAttempts++;
            const script = document.createElement('script');
            script.src = 'https://www.youtube.com/iframe_api';
            script.onerror = () => {
                script.remove();
                retryLoadYouTubeApi();
            };
            document.head.appendChild(script);
            // Belt-and-braces: the request can succeed with no error event
            // and YouTube's own bootstrapping still never call back. Give
            // up on this attempt and start over if that happens.
            clearTimeout(ytApiWatchdog);
            ytApiWatchdog = setTimeout(() => {
                if (!window.YT || !window.YT.Player) { script.remove(); retryLoadYouTubeApi(); }
            }, 8000);
        }
        function retryLoadYouTubeApi() {
            const delay = Math.min(2000 * ytApiLoadAttempts, 15000);
            setTimeout(loadYouTubeApi, delay);
        }
        loadYouTubeApi();

        // If a video was already waiting on this slot (either it's the
        // active slot's video, still loading when the player wasn't ready
        // yet, or a handoff that was preloading into the pending slot),
        // pick it back up now instead of waiting for the next poll cycle.
        function retryLoadIfNeeded(slot) {
            if (slot === activeSlot && musicVideoActive && !mvRevealed && currentVideoId) {
                loadIntoSlot(slot, currentVideoId);
            } else if (slot === pendingSlot && pendingVideoId) {
                loadIntoSlot(slot, pendingVideoId);
            }
        }

        // Called by the YouTube IFrame API script once it's finished
        // loading - both players are created once, empty, and reused (via
        // loadVideoById) for every track from then on rather than being
        // torn down and rebuilt each switch.
        // COMPLIANCE FLAG (not yet resolved): YouTube's autoplay policy
        // requires a player to be at least half visible on screen before
        // autoplay starts (https://developers.google.com/youtube/terms/required-minimum-functionality#autoplay-and-scripted-playbacks).
        // The pending/preload slot below plays with autoplay:1 while its
        // opacity is still 0 (invisible), to have it ready for a hard-cut
        // handoff on the next song - that's the same pattern this policy
        // is written against. A compliant fix would preload the video
        // without starting playback (e.g. cueVideoById instead of
        // autoplay, then playVideo() only once the slot becomes active),
        // which likely means giving up the instant hard-cut handoff for a
        // short buffering moment instead. Not changed here since it
        // touches the handoff timing logic (completeHandoff/swapActiveSlot)
        // rather than being a self-contained fix.
        window.onYouTubeIframeAPIReady = function () {
            clearTimeout(ytApiWatchdog);
            ['a', 'b'].forEach(slot => {
                players[slot].yt = new YT.Player(`yt-player-${slot}`, {
                    width: '100%', height: '100%',
                    playerVars: {
                        autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0,
                        iv_load_policy: 3, modestbranding: 1, rel: 0, playsinline: 1
                    },
                    events: {
                        onReady: () => {
                            players[slot].ready = true;
                            if (slot === activeSlot) applySubtitlesSetting(slot);
                            retryLoadIfNeeded(slot);
                        },
                        onStateChange: makeYtStateChangeHandler(slot),
                        // Fires whenever a player module (e.g. captions)
                        // actually becomes available - see
                        // applySubtitlesSetting/trySetCaptionsTrack below,
                        // which is what actually turns captions on; loadModule
                        // alone doesn't make a track selectable straight away.
                        onApiChange: () => { trySetCaptionsTrack(slot); },
                        // A video can fail at actual playback time even after
                        // passing the server-side embeddable check (region
                        // locks, an owner opt-out that only surfaces here).
                        // On the active slot that's the same as a sync
                        // failure: blacklist it and fall back to ambient. On
                        // the pending (preloading) slot it just means the
                        // handoff to it can't happen - the current video
                        // simply keeps playing.
                        onError: (e) => { handleSlotError(slot, e && e.data); }
                    }
                });
            });
        };

        // Nothing of YouTube's own interface is ever allowed on screen:
        //  - A new video loads while INVISIBLE, whether that's because it's
        //    preloading in the non-active slot (song-to-song handoff) or
        //    because ambient visuals are still what's showing (the very
        //    first video of a session). The active slot's cover only lifts
        //    once revealReadyCheck (below, driven by the same mvTick loop
        //    that already drives pendingCheck for handoffs) has confirmed
        //    it's genuinely PLAYING and within normal sync tolerance for
        //    MV_HANDOFF_CONFIRM_MS straight - not just "PLAYING for a fixed
        //    delay" as before (see item 6) - so YouTube's spinner, poster/
        //    play button and title bar have all come and gone before
        //    anyone can see it, AND it isn't shown mid-drift either.
        //  - Once on screen, any state other than PLAYING (buffering after
        //    a seek, paused, ended and its "suggested videos" screen) puts
        //    the black cover straight back over it.
        //  - Each player is also oversized and clipped (see .video-frame) so
        //    its top/bottom bars can never sit inside the visible picture.
        // A video that ends is held on the cover rather than replayed from
        // the start; mvCheck restarts it only if the song is genuinely
        // still going or was skipped back.
        function makeYtStateChangeHandler(slot) {
            return function (e) {
                const st = players[slot];
                if (e.data === YT.PlayerState.PLAYING) {
                    if (mvSubtitlesEnabled) trySetCaptionsTrack(slot);
                    if (st.seekIssuedAt) {
                        const lat = Date.now() - st.seekIssuedAt;
                        st.seekIssuedAt = null;
                        if (lat < 5000) mvSeekLatencyMs = Math.round(mvSeekLatencyMs * 0.5 + lat * 0.5);
                    }
                    // item 7: don't let this reactive listener uncover the video the
                    // instant YouTube reports PLAYING again after our own corrective
                    // seek - that's exactly the premature-reveal race this item exists
                    // to close. While a correction is in flight, activeCorrectionCheck()
                    // is the only thing allowed to lift the cover again, once drift is
                    // actually confirmed settled, not just once playback resumed.
                    if (slot === activeSlot && mvRevealed && !mvCorrectingActive) {
                        document.getElementById(`video-loading-cover-${slot}`).classList.add('is-hidden');
                    }
                    // If this is the pre-reveal active slot, revealReadyCheck()
                    // (run every tick, same as pendingCheck for a handoff)
                    // takes it from here - no timer to schedule here anymore.
                    // Likewise for the pending slot pre-handoff.
                } else {
                    if (slot === activeSlot) {
                        if (mvRevealed) document.getElementById(`video-loading-cover-${slot}`).classList.remove('is-hidden', 'is-hidden-instant');
                        // Not revealed yet and no longer PLAYING - the confirm
                        // streak is stale; revealReadyCheck's own next tick
                        // will also see this and reset mvRevealReadySince,
                        // but clearing it here means a seek issued from
                        // OUTSIDE that check (a genuine skip/seek elsewhere)
                        // can't leave a stale streak lingering an extra tick.
                        mvRevealReadySince = null;
                    }
                }
            };
        }

        function handleSlotError(slot, code) {
            if (slot === activeSlot) {
                // Already on screen and an error hits mid-play (code 5 and
                // friends are often transient): reload the same video at the
                // right spot rather than dropping it. 100/101/150 mean the
                // video genuinely can't be played, so those give up at once.
                const permanent = code === 100 || code === 101 || code === 150;
                if (mvRevealed && !permanent && mvErrorRetries < MV_MAX_ERROR_RETRIES && currentVideoId) {
                    mvErrorRetries++;
                    loadIntoSlot(slot, currentVideoId);
                    return;
                }
                reportVideoFailureAndStop();
            } else if (slot === pendingSlot) {
                const failedTrackId = pendingTrackId;
                const failedVideoId = pendingVideoId;
                clearTimeout(pendingLoadTimeout); pendingLoadTimeout = null;
                pendingSlot = null; pendingVideoId = null; pendingTrackId = null; pendingReadySince = null;
                if (failedTrackId && failedVideoId) reportSyncFailed(failedTrackId, failedVideoId);
            }
        }

        // Brings a fully-loaded, confirmed-playing video onto the screen with
        // a crossfade over whatever ambient content is showing, then (once
        // the fade is done) retires the ambient layer underneath. Only ever
        // used for the FIRST video of a session (nothing to cut from yet) -
        // song-to-song handoffs go through completeHandoff() instead, which
        // is an instant cut with no crossfade.
        // Called from revealReadyCheck() below once it's confirmed PLAYING +
        // in-sync for MV_HANDOFF_CONFIRM_MS straight (item 6) - the state
        // re-checked here is therefore normally already true by the time
        // this runs; kept as a defensive guard rather than trusted blindly,
        // same as completeHandoff() re-checks its own caller's work.
        function revealMusicVideo() {
            const st = players[activeSlot];
            if (!musicVideoActive || mvRevealed || !st.ready) return;
            let state;
            try { state = st.yt.getPlayerState(); } catch (e) { return; }
            if (state !== YT.PlayerState.PLAYING) return;
            clearTimeout(mvLoadTimeout);
            mvRevealed = true;
            document.getElementById(`video-loading-cover-${activeSlot}`).classList.add('is-hidden');
            document.getElementById('video-view').classList.add('is-visible');
            setTimeout(() => {
                if (!mvRevealed) return;
                showView('video');
                clearAmbientAdvanceTimer();
                clearSlideCleanup();
            }, 450);

            // Start sampling this newly-active slot from scratch and kick
            // off the continuous drift-correction loop, which keeps running
            // for as long as a video is on screen through any number of
            // song-to-song handoffs (it always reads whichever slot is
            // currently active).
            mvLastReading = null;
            mvLastReadingChangedAt = 0;
            mvSampleCount = 0;
            clearMvDriftInterval();
            mvDriftInterval = setInterval(mvTick, MV_SAMPLE_INTERVAL_MS);
        }

        // Forgets whatever the ambient layer was doing and renders it afresh.
        function resetAmbientAndRepoll() {
            clearAmbientAdvanceTimer();
            clearSlideCleanup();
            ambientItems = [];
            ambientRuleId = null;
            ambientInactiveStreak = 0;
            pollAmbientVisuals();
        }

        // Applies the admin's Subtitles toggle to one slot's player.
        // Captions are a per-video YouTube module, so this re-runs on every
        // new video load as well as whenever the toggle itself changes.
        //
        // How it works (and what was wrong before): the old code selected
        // a track with setOption('captions', 'track', {}) - but an EMPTY
        // track object is YouTube's way of turning captions OFF, so even
        // when the module was ready, the call switched them off/left them
        // off. Now we ask the module for the video's real track list
        // (getOption('captions', 'tracklist')), pick one, and select that
        // exact track. The track list isn't available the instant the
        // module loads - it fills in once YouTube has fetched the video's
        // caption info - so the selection is retried (about every 750 ms
        // for ~15 s) until it sticks, and is also re-tried whenever the
        // player reports PLAYING or a module change. Each new call bumps
        // capRun, which cancels any older retry loop for that slot.
        // A video that genuinely has NO caption track just never gets one.
        function pickCaptionTrack(list) {
            if (!Array.isArray(list) || list.length === 0) return null;
            const en = list.filter(t => /^en/i.test((t && t.languageCode) || ''));
            const pool = en.length ? en : list;
            // Prefer a human-made track over an auto-generated ('asr') one.
            return pool.find(t => t && t.kind !== 'asr') || pool[0];
        }

        function applySubtitlesSetting(slot) {
            const st = players[slot];
            if (!st.ready) return;
            st.capRun = (st.capRun || 0) + 1;
            const run = st.capRun;
            try {
                if (mvSubtitlesEnabled) {
                    st.yt.loadModule('captions');
                    let tries = 0;
                    const attempt = () => {
                        if (st.capRun !== run || !mvSubtitlesEnabled) return; // superseded or toggled off
                        if (trySetCaptionsTrack(slot)) return;                // selected - done
                        if (++tries < 20) setTimeout(attempt, 750);
                    };
                    attempt();
                } else {
                    try { st.yt.setOption('captions', 'track', {}); } catch (e) { /* module not loaded - nothing to switch off */ }
                    st.yt.unloadModule('captions');
                }
            } catch (e) { /* module not ready yet - the retry/onApiChange paths cover it */ }
        }

        // Selects a caption track if the module has one to offer. Returns
        // true once a track is selected (or already was), false if it isn't
        // available yet. Safe to call speculatively any number of times.
        function trySetCaptionsTrack(slot) {
            if (!mvSubtitlesEnabled) return true;
            const st = players[slot];
            if (!st.ready) return false;
            try {
                const track = pickCaptionTrack(st.yt.getOption('captions', 'tracklist'));
                if (!track) return false;
                const cur = st.yt.getOption('captions', 'track');
                if (cur && cur.languageCode && cur.languageCode === track.languageCode) return true;
                st.yt.setOption('captions', 'track', track);
                return true;
            } catch (e) { return false; }
        }

        function clearMvDriftInterval() {
            if (mvDriftInterval) { clearInterval(mvDriftInterval); mvDriftInterval = null; }
            mvConsecutiveBigDrifts = 0;
        }

        function reportSyncFailed(trackId, videoId, keepCurrent) {
            fetch(eventUrl('/api/music-video/sync-failed'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ trackId, videoId, keepCurrent: !!keepCurrent })
            }).catch(() => { /* fine either way - ambient/current video is already what's on screen */ });
        }

        // Tells the server the ACTIVE video didn't work out for this track
        // (either it never actually stayed in sync, or it errored at real
        // playback time) so it's blacklisted and not offered again on a
        // repeat play, then tears the whole overlay down. Best-effort - if
        // the report itself fails, the fallback to ambient still happens; it
        // just might offer the same bad video again next time this track
        // comes up.
        function reportVideoFailureAndStop() {
            const trackId = currentVideoTrackId;
            const videoId = currentVideoId;
            stopMusicVideo();
            if (trackId && videoId) reportSyncFailed(trackId, videoId);
        }

        // Folds one /api/music-video reading into mvClock. The age of the
        // reading is serverNow - updatedAt (both the SERVER's clock); this
        // screen's own clock is only used to measure time since receipt.
        //
        // Only the FIRST reading for a track (or a genuine play/pause
        // transition, or a real seek/skip) replaces the anchor outright.
        // Once a song has a good anchor, mvTargetSec() runs forward purely
        // from Date.now() - it is NOT nudged a little on every subsequent
        // poll. Spotify's own progress reporting isn't a live audio clock;
        // it's a periodic estimate with its own few-hundred-ms jitter, and
        // blending a fraction of that into the anchor every ~3s was
        // reintroducing small drift for the ENTIRE song, not just at video
        // start - which is what made lip-sync feel persistently off rather
        // than just occasionally off. A real seek/skip still snaps the
        // anchor immediately via the threshold check below.
        const MV_CLOCK_RESYNC_THRESHOLD_MS = 1500;
        function updateMvClock(data, receivedAt) {
            const serverNow = Number.isFinite(data.serverNow) ? data.serverNow : Date.now();
            const ageMs = data.isPlaying ? Math.max(0, serverNow - (data.updatedAt || serverNow)) : 0;
            const progressNow = (data.progressMs || 0) + ageMs;
            const newBase = receivedAt - progressNow;
            const isPlaying = !!data.isPlaying;
            if (!mvClock || mvClock.trackId !== data.trackId || mvClock.isPlaying !== isPlaying || Math.abs(newBase - mvClock.base) > MV_CLOCK_RESYNC_THRESHOLD_MS) {
                // New song, a play/pause transition, or a big enough jump to
                // be a real seek rather than reporting noise - this reading
                // becomes the new anchor outright.
                mvClock = { base: newBase, isPlaying, pausedPosMs: data.progressMs || 0, trackId: data.trackId };
            } else {
                // Same song, still within normal reporting jitter - keep
                // running on the existing anchor. Just track pausedPosMs so
                // a pause captured between polls still reflects the right
                // spot.
                mvClock.pausedPosMs = data.progressMs || 0;
            }
        }

        // How far ahead of the raw song position the video should always
        // target. Real-world audio output has its own latency (Bluetooth
        // speakers, the playback device's own buffering) that the video
        // pipeline doesn't share, so even a "perfectly" synced video will
        // consistently look a little late against the audio - the fix isn't
        // tighter drift correction, it's aiming a bit further ahead in the
        // first place. Applied everywhere the target position is used
        // (initial seek, continuous correction, and handoff cuts). Set from
        // Admin -> Settings -> Content -> Music Videos on each poll (see
        // pollMusicVideo below) rather than fixed in code, since the right
        // amount depends on this venue's own playback setup. Positive =
        // video moves ahead (use if audio is ahead of the video, i.e. the
        // video looks late); negative = video moves back. 600ms until the
        // admin sets one explicitly, matching what testing landed on here.
        let mvVideoLeadMs = 600;

        // How much dead air/bumper sits at the front of the CURRENT video
        // before the song itself actually starts - detected server-side
        // (see detectVideoIntroOffsetMs in server.js) from the video's own
        // audio, cached per track, and refreshed here on every
        // pollMusicVideo response. 0 until that detection resolves (a few
        // seconds into a new video) or if the video has no such offset.
        // Same direction as mvVideoLeadMs (video moves ahead), but this one
        // is per-video rather than a single venue-wide constant, since a
        // cold-open intro is a property of the specific video, not the
        // room's speakers.
        let mvIntroOffsetMs = 0;

        // Where the video SHOULD be right now, in seconds.
        function mvTargetSec() {
            if (!mvClock) return 0;
            const posMs = mvClock.isPlaying ? (Date.now() - mvClock.base) : mvClock.pausedPosMs;
            return Math.max(0, (posMs + mvVideoLeadMs + mvIntroOffsetMs) / 1000);
