<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khula:wght@600;700&display=swap">
    <title>Visuals Display</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
        }
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; background-color: var(--spotify-black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; }

        /* ---------- Ambient view: full-bleed photo/video slideshow ---------- */
        #ambient-view {
            position: fixed; inset: 0; display: none; background: #000;
        }
        #ambient-view.is-visible { display: block; }
        .ambient-layer {
            position: absolute; inset: 0;
            opacity: 0; transition: opacity 1.2s ease;
        }
        .ambient-layer.is-active { opacity: 1; }
        .ambient-layer.no-fade { transition: none; }
        .ambient-layer img, .ambient-layer video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .ambient-venue-tag {
            position: absolute; left: 24px; bottom: 20px; z-index: 5;
            color: rgba(255,255,255,0.55); font-size: 0.95rem; font-weight: 600;
            font-family: 'Khula', sans-serif; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .amb-caption {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 56px 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent); color: white;
        }
        .amb-caption .t1 { font-family: 'Khula', sans-serif; font-weight: 700; font-size: 2.4rem; }
        .amb-caption .t2 { font-size: 1.1rem; color: #d8d8d8; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .amb-custom {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--spotify-green), #0d7a38); color: white; padding: 60px; text-align: center;
        }
        .amb-custom-text { font-family: 'Khula', sans-serif; font-weight: 700; font-size: 4rem; line-height: 1.15; }

        /* ---------- Ambient widget slides: clock, live queue, ad ---------- */
        .amb-clock {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: var(--spotify-black); color: white;
        }
        .amb-clock-time {
            font-family: 'Khula', sans-serif; font-weight: 700; font-size: 9rem; letter-spacing: -2px; line-height: 1;
        }
        .amb-clock-date { color: #a7a7a7; font-size: 1.6rem; margin-top: 18px; }

        .amb-queue {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            color: white; padding: 40px 56px; background: var(--spotify-black);
            overflow: hidden; box-sizing: border-box;
        }
        .amb-queue .qv-header { text-align: center; margin-bottom: 24px; }

        .amb-ad {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            gap: 48px; background: var(--spotify-black); color: white; padding: 60px;
        }
        .amb-ad-qr { width: 320px; height: 320px; border-radius: 16px; background: white; padding: 16px; flex-shrink: 0; }
        .amb-ad-qr img { width: 100%; height: 100%; object-fit: contain; }
        .amb-ad-text {
            font-family: 'Khula', sans-serif; font-weight: 700; font-size: 2.6rem; max-width: 640px; line-height: 1.3;
        }

        /* ---------- Queue view: fallback "up next" board ---------- */
        #queue-view {
            position: fixed; inset: 0; display: none; flex-direction: column;
            color: white; padding: 40px 56px; box-sizing: border-box; overflow: hidden;
        }
        #queue-view.is-visible { display: flex; }
        .qv-header { text-align: center; margin-bottom: 28px; }
        .qv-event-name {
            font-family: 'Khula', sans-serif; font-weight: 700;
            font-size: 2.6rem; margin: 0; letter-spacing: -0.5px;
        }
        .qv-venue-name { color: #a7a7a7; font-size: 1.1rem; margin-top: 6px; }

        .qv-now-playing {
            display: flex; align-items: center; gap: 24px;
            background: var(--panel-bg); border: 1px solid #282828; border-radius: 18px;
            padding: 24px 28px; margin-bottom: 32px;
            overflow: hidden; min-width: 0; max-width: 100%; box-sizing: border-box;
        }
        .qv-artwork {
            display: block;
            width: 110px; height: 110px; max-width: 110px; max-height: 110px;
            flex: 0 0 110px; border-radius: 10px; object-fit: cover;
            background: var(--card-bg);
        }
        .qv-np-text { flex: 1 1 auto; min-width: 0; max-width: 100%; overflow: hidden; }
        .qv-np-label {
            color: var(--spotify-green); font-size: 0.85rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 6px;
            display: flex; align-items: center; gap: 8px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .qv-live-dot {
            width: 9px; height: 9px; border-radius: 50%; background: var(--spotify-green);
            flex-shrink: 0;
            animation: qv-pulse 1.5s ease-in-out infinite;
        }
        .qv-live-dot.is-paused { animation: none; opacity: 0.3; }
        @keyframes qv-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        .qv-np-title {
            font-size: 1.7rem; font-weight: 700; margin: 0 0 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .qv-np-artist {
            color: #a7a7a7; font-size: 1.15rem; margin: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .qv-progress-track {
            width: 100%; height: 5px; background: #333; border-radius: 3px; margin-top: 14px; overflow: hidden;
        }
        .qv-progress-fill { height: 100%; background: var(--spotify-green); width: 0%; }

        .qv-upnext-label {
            font-family: 'Khula', sans-serif; font-size: 1.2rem; font-weight: 700;
            color: #a7a7a7; text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 16px;
        }
        .qv-list { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
        .qv-row {
            display: flex; align-items: center; gap: 18px;
            background: var(--panel-bg); border: 1px solid #282828; border-radius: 12px;
            padding: 14px 18px;
        }
        .qv-row-rank {
            font-family: 'Khula', sans-serif; font-size: 1.4rem; font-weight: 700;
            color: #555; width: 34px; text-align: center; flex-shrink: 0;
        }
        .qv-row img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: var(--card-bg); }
        .qv-row-text { flex: 1; min-width: 0; }
        .qv-row-title { font-size: 1.15rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qv-row-artist { color: #a7a7a7; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qv-row-votes { color: var(--spotify-green); font-weight: 700; font-size: 1.1rem; flex-shrink: 0; }

        .qv-empty {
            flex: 1; display: flex; align-items: center; justify-content: center;
            color: #666; font-size: 1.3rem; text-align: center;
        }
    </style>
</head>
<body>

    <!-- Ambient Visuals: driven entirely by the Music Scheduler's Ambient
         Visuals blocks. Two stacked layers crossfade between slides so a
         photo/video change never hard-cuts to black. -->
    <div id="ambient-view">
        <div class="ambient-layer" id="ambient-layer-a"></div>
        <div class="ambient-layer" id="ambient-layer-b"></div>
        <div class="ambient-venue-tag" id="ambient-venue-tag"></div>
    </div>

    <!-- Fallback board: shown whenever no Ambient Visuals block is currently
         scheduled, so the screen is never just dead/black between blocks. -->
    <div id="queue-view">
        <div class="qv-header">
            <h1 class="qv-event-name" id="qv-event-name">Now Playing</h1>
            <div class="qv-venue-name" id="qv-venue-name"></div>
        </div>
        <div class="qv-now-playing" id="qv-now-playing" style="display:none;">
            <img class="qv-artwork" id="qv-artwork" src="" alt="">
            <div class="qv-np-text">
                <p class="qv-np-label"><span class="qv-live-dot" id="qv-live-dot"></span> Now Playing</p>
                <p class="qv-np-title" id="qv-np-title"></p>
                <p class="qv-np-artist" id="qv-np-artist"></p>
                <div class="qv-progress-track"><div class="qv-progress-fill" id="qv-progress-fill"></div></div>
            </div>
        </div>
        <div class="qv-upnext-label">Up Next</div>
        <div class="qv-list" id="qv-list"></div>
    </div>

    <script>
        const EVENT_SLUG = location.pathname.split('/')[2] || '';
        function eventUrl(p) { return `/e/${EVENT_SLUG}${p}`; }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        /* =========================================================
           Ambient Visuals slideshow
           - Polls /api/ambient-visuals. When active, cycles through the
             resolved item list: photos/queue/clock/ad hold for their own
             durationSec, videos play to completion, then it advances to the
             next item and loops.
           - A single active:false reply is NOT treated as "off" - the
             scheduler API deliberately returns that for any brief gap
             between blocks, and blanking the screen on every gap would be
             worse than just holding the last slide a little longer. Only
             after a few consecutive inactive polls does this fall back to
             the queue view.
           ========================================================= */
        let ambientItems = [];
        let ambientRuleId = null;
        let ambientIndex = 0;
        let ambientAdvanceTimer = null;
        let ambientInactiveStreak = 0;
        const AMBIENT_INACTIVE_TOLERANCE = 2; // consecutive misses before falling back

        // Anything a widget slide (clock/queue) sets up while it's on
        // screen - a ticking clock or a refreshing queue poll - gets torn
        // down the moment the slide changes so it doesn't keep running
        // (and fighting the next slide's own timers) underneath.
        let slideCleanup = null;
        function clearSlideCleanup() {
            if (slideCleanup) { slideCleanup(); slideCleanup = null; }
        }

        let activeLayer = 'a';
        function layerEl(which) { return document.getElementById(`ambient-layer-${which}`); }

        function showView(name) {
            document.getElementById('ambient-view').classList.toggle('is-visible', name === 'ambient');
            document.getElementById('queue-view').classList.toggle('is-visible', name === 'queue');
        }

        function clearAmbientAdvanceTimer() {
            if (ambientAdvanceTimer) { clearTimeout(ambientAdvanceTimer); ambientAdvanceTimer = null; }
        }

        function renderClockInto(el) {
            el.innerHTML = `
                <div class="amb-clock">
                    <div class="amb-clock-time" id="amb-clock-time"></div>
                    <div class="amb-clock-date" id="amb-clock-date"></div>
                </div>`;
            const timeEl = el.querySelector('#amb-clock-time');
            const dateEl = el.querySelector('#amb-clock-date');
            const tick = () => {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            };
            tick();
            const intervalId = setInterval(tick, 1000);
            return () => clearInterval(intervalId);
        }

        function renderQueueInto(el) {
            let ambNpState = null;
            let ambNpTicker = null;

            function renderAmbNpProgress() {
                if (!ambNpState || !ambNpState.durationMs) return;
                const elapsed = ambNpState.isPlaying ? (Date.now() - ambNpState.fetchedAt) : 0;
                const pct = Math.min(100, ((ambNpState.progressMs + elapsed) / ambNpState.durationMs) * 100);
                const fillEl = el.querySelector('#amb-qv-progress-fill');
                if (fillEl) fillEl.style.width = pct + '%';
            }

            el.innerHTML = `
                <div class="amb-queue">
                    <div class="qv-header">
                        <h1 class="qv-event-name" id="amb-qv-event-name">Now Playing</h1>
                        <div class="qv-venue-name" id="amb-qv-venue-name"></div>
                    </div>
                    <div class="qv-now-playing" id="amb-qv-now-playing" style="display:none;">
                        <img class="qv-artwork" id="amb-qv-artwork" src="" alt="">
                        <div class="qv-np-text">
                            <p class="qv-np-label"><span class="qv-live-dot" id="amb-qv-live-dot"></span> Now Playing</p>
                            <p class="qv-np-title" id="amb-qv-np-title"></p>
                            <p class="qv-np-artist" id="amb-qv-np-artist"></p>
                            <div class="qv-progress-track"><div class="qv-progress-fill" id="amb-qv-progress-fill"></div></div>
                        </div>
                    </div>
                    <div class="qv-upnext-label">Up Next</div>
                    <div class="qv-list" id="amb-qv-list"></div>
                </div>`;

            const refresh = async () => {
                try {
                    const [kioskRes, npRes] = await Promise.all([
                        fetch(eventUrl('/kiosk-data')),
                        fetch(eventUrl('/api/now-playing'))
                    ]);
                    if (kioskRes.ok) {
                        const data = await kioskRes.json();
                        const nameEl = el.querySelector('#amb-qv-event-name');
                        const venueEl = el.querySelector('#amb-qv-venue-name');
                        if (nameEl) nameEl.innerText = data.eventName || 'Now Playing';
                        if (venueEl) venueEl.innerText = data.venueName || '';
                        const list = el.querySelector('#amb-qv-list');
                        const top = (data.queue || []).slice(0, 8);
                        if (list) {
                            list.innerHTML = top.length === 0
                                ? '<div class="qv-empty">No requests queued right now</div>'
                                : top.map((song, idx) => `
                                    <div class="qv-row">
                                        <div class="qv-row-rank">${idx + 1}</div>
                                        <img src="${escapeHtml(song.artwork || '')}" alt="">
                                        <div class="qv-row-text">
                                            <div class="qv-row-title">${escapeHtml(song.title)}</div>
                                            <div class="qv-row-artist">${escapeHtml(song.artist)}</div>
                                        </div>
                                        <div class="qv-row-votes">+${(song.ups || 0) - (song.downs || 0)}</div>
                                    </div>
                                `).join('');
                        }
                    }
                    if (npRes.ok) {
                        const np = await npRes.json();
                        const card = el.querySelector('#amb-qv-now-playing');
                        if (card) {
                            if (np && np.connected && np.title) {
                                card.style.display = 'flex';
                                el.querySelector('#amb-qv-artwork').src = np.artwork || '';
                                el.querySelector('#amb-qv-np-title').innerText = np.title;
                                el.querySelector('#amb-qv-np-artist').innerText = np.artist || '';
                                el.querySelector('#amb-qv-live-dot').classList.toggle('is-paused', !np.isPlaying);
                                ambNpState = {
                                    progressMs: np.progressMs || 0,
                                    durationMs: np.durationMs || 0,
                                    isPlaying: !!np.isPlaying,
                                    fetchedAt: Date.now()
                                };
                                renderAmbNpProgress();
                                if (!ambNpTicker) ambNpTicker = setInterval(renderAmbNpProgress, 250);
                            } else {
                                card.style.display = 'none';
                                ambNpState = null;
                                if (ambNpTicker) { clearInterval(ambNpTicker); ambNpTicker = null; }
                            }
                        }
                    }
                } catch (e) { /* keep showing whatever's already there */ }
            };
            refresh();
            const intervalId = setInterval(refresh, 4000);
            return () => {
                clearInterval(intervalId);
                if (ambNpTicker) clearInterval(ambNpTicker);
            };
        }

        function renderAdInto(el, item) {
            const qrSrc = item.adQrUrl
                ? `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(item.adQrUrl)}`
                : '';
            el.innerHTML = `
                <div class="amb-ad">
                    ${qrSrc ? `<div class="amb-ad-qr"><img src="${escapeHtml(qrSrc)}" alt="QR code"></div>` : ''}
                    ${item.adText ? `<div class="amb-ad-text">${escapeHtml(item.adText)}</div>` : ''}
                </div>`;
            return null;
        }

        function renderAmbientSlide() {
            if (ambientItems.length === 0) return;
            const item = ambientItems[ambientIndex % ambientItems.length];
            const incoming = activeLayer === 'a' ? 'b' : 'a';
            const outgoing = activeLayer;
            const incomingEl = layerEl(incoming);

            clearAmbientAdvanceTimer();
            clearSlideCleanup();

            const caption = (item.captionTitle || '').trim() || (item.captionSubtitle || '').trim()
                ? `<div class="amb-caption">${item.captionTitle ? `<div class="t1">${escapeHtml(item.captionTitle)}</div>` : ''}${item.captionSubtitle ? `<div class="t2">${escapeHtml(item.captionSubtitle)}</div>` : ''}</div>`
                : '';
            const mediaStyle = `object-fit:${item.fit || 'cover'}; object-position:${item.position || 'center'}; filter:brightness(${item.brightness || 100}%);`;

            if (item.type === 'video') {
                incomingEl.innerHTML = `<video src="${escapeHtml(item.url)}" autoplay muted playsinline style="${mediaStyle}"></video>${caption}`;
            } else if (item.type === 'photo') {
                incomingEl.innerHTML = `<img src="${escapeHtml(item.url)}" alt="" style="${mediaStyle}">${caption}`;
            } else if (item.type === 'clock') {
                slideCleanup = renderClockInto(incomingEl);
            } else if (item.type === 'queue') {
                slideCleanup = renderQueueInto(incomingEl);
            } else if (item.type === 'ad') {
                renderAdInto(incomingEl, item);
            } else if (item.type === 'custom') {
                incomingEl.innerHTML = `<div class="amb-custom" style="filter:brightness(${item.brightness || 100}%);"><div class="amb-custom-text">${escapeHtml(item.text || '')}</div></div>`;
            }

            // Crossfade: bring the new layer in, then drop the old one out.
            // A 'cut' transition skips the fade entirely for an instant swap.
            const skipFade = item.transition === 'cut';
            incomingEl.classList.toggle('no-fade', skipFade);
            layerEl(outgoing).classList.toggle('no-fade', skipFade);
            requestAnimationFrame(() => {
                incomingEl.classList.add('is-active');
                layerEl(outgoing).classList.remove('is-active');
            });
            activeLayer = incoming;

            if (item.type === 'video') {
                const videoEl = incomingEl.querySelector('video');
                videoEl.onended = advanceAmbientSlide;
                // Safety net in case a video fails to fire 'ended' (broken
                // file, stalled network) - don't let the slideshow get stuck.
                ambientAdvanceTimer = setTimeout(advanceAmbientSlide, 90000);
            } else {
                ambientAdvanceTimer = setTimeout(advanceAmbientSlide, (item.durationSec || 8) * 1000);
            }
        }

        function advanceAmbientSlide() {
            ambientIndex = (ambientIndex + 1) % ambientItems.length;
            renderAmbientSlide();
        }

        async function pollAmbientVisuals() {
            try {
                const res = await fetch(eventUrl('/api/ambient-visuals'));
                if (!res.ok) return;
                const data = await res.json();

                if (!data.active) {
                    ambientInactiveStreak++;
                    if (ambientInactiveStreak >= AMBIENT_INACTIVE_TOLERANCE) {
                        clearAmbientAdvanceTimer();
                        clearSlideCleanup();
                        ambientItems = [];
                        ambientRuleId = null;
                        showView('queue');
                    }
                    return;
                }
                ambientInactiveStreak = 0;

                const ruleChanged = data.ruleId !== ambientRuleId;
                ambientRuleId = data.ruleId;

                if (ruleChanged || ambientItems.length === 0) {
                    ambientItems = data.items || [];
                    ambientIndex = 0;
                    showView('ambient');
                    renderAmbientSlide();
                } else {
                    // Same block still active - just keep its item list fresh
                    // in case a file was added/removed, without restarting
                    // whatever is currently on screen.
                    ambientItems = data.items || [];
                    showView('ambient');
                }
            } catch (e) { /* keep showing whatever's already on screen */ }
        }

        /* =========================================================
           Fallback queue board
           ========================================================= */
        let npState = null;
        let npTicker = null;

        function renderNpProgress() {
            if (!npState || !npState.durationMs) return;
            const elapsed = npState.isPlaying ? (Date.now() - npState.fetchedAt) : 0;
            const pct = Math.min(100, ((npState.progressMs + elapsed) / npState.durationMs) * 100);
            const fillEl = document.getElementById('qv-progress-fill');
            if (fillEl) fillEl.style.width = pct + '%';
        }

        function updateNowPlaying(data) {
            const card = document.getElementById('qv-now-playing');
            if (!data || !data.connected || !data.title) {
                card.style.display = 'none';
                npState = null;
                if (npTicker) { clearInterval(npTicker); npTicker = null; }
                return;
            }
            card.style.display = 'flex';
            document.getElementById('qv-artwork').src = data.artwork || '';
            document.getElementById('qv-np-title').innerText = data.title;
            document.getElementById('qv-np-artist').innerText = data.artist || '';
            document.getElementById('qv-live-dot').classList.toggle('is-paused', !data.isPlaying);

            npState = {
                progressMs: data.progressMs || 0,
                durationMs: data.durationMs || 0,
                isPlaying: !!data.isPlaying,
                fetchedAt: Date.now()
            };
            renderNpProgress();
            if (!npTicker) npTicker = setInterval(renderNpProgress, 250);
        }

        function renderQueueList(queue) {
            const list = document.getElementById('qv-list');
            const top = (queue || []).slice(0, 8);
            if (top.length === 0) {
                list.innerHTML = '<div class="qv-empty">No requests queued right now</div>';
                return;
            }
            list.innerHTML = top.map((song, idx) => `
                <div class="qv-row">
                    <div class="qv-row-rank">${idx + 1}</div>
                    <img src="${escapeHtml(song.artwork || '')}" alt="">
                    <div class="qv-row-text">
                        <div class="qv-row-title">${escapeHtml(song.title)}</div>
                        <div class="qv-row-artist">${escapeHtml(song.artist)}</div>
                    </div>
                    <div class="qv-row-votes">+${(song.ups || 0) - (song.downs || 0)}</div>
                </div>
            `).join('');
        }

        async function pollQueueBoard() {
            try {
                const res = await fetch(eventUrl('/kiosk-data'));
                if (!res.ok) return;
                const data = await res.json();
                document.getElementById('qv-event-name').innerText = data.eventName || 'Now Playing';
                document.getElementById('qv-venue-name').innerText = data.venueName || '';
                renderQueueList(data.queue);
            } catch (e) { /* keep showing last known board */ }
        }

        async function pollNowPlaying() {
            try {
                const res = await fetch(eventUrl('/api/now-playing'));
                if (!res.ok) return;
                updateNowPlaying(await res.json());
            } catch (e) { /* keep last known state */ }
        }

        // Ambient view is checked most often since it drives an active
        // slideshow; the fallback board's data is cheap and only visible
        // when ambient visuals aren't running.
        pollAmbientVisuals();
        pollQueueBoard();
        pollNowPlaying();
