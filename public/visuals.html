        }

        function mvSampleReading() {
            const st = players[activeSlot];
            if (!st.ready) return;
            let cur;
            try { cur = st.yt.getCurrentTime(); } catch (e) { return; }
            if (typeof cur !== 'number') return;
            if (cur !== mvLastReading) { mvLastReading = cur; mvLastReadingChangedAt = Date.now(); }
        }
        // Best estimate of where the video actually is right now.
        function mvVideoPositionSec() {
            if (mvLastReading === null) return null;
            const sinceChange = Math.min(Date.now() - mvLastReadingChangedAt, 600);
            return mvLastReading + (sinceChange / 1000) * (players[activeSlot].currentRate || 1);
        }
        function mvTick() {
            mvSampleReading();
            pendingCheck();
            revealReadyCheck();      // item 6 - cold-start counterpart to pendingCheck, see its own comment
            activeCorrectionCheck(); // item 7 - on-screen hard-seek correction, covered until confirmed re-synced
            mvUpdateOverlay();
            if (++mvSampleCount % MV_CHECK_EVERY_N_SAMPLES === 0) mvCheck();
        }

        // Drives the logo + song-info popup over whatever video is on
        // screen. Always reads the CURRENTLY ACTIVE slot's own player, so a
        // song-to-song handoff (completeHandoff swaps activeSlot with no
        // transition) naturally carries the popup's start/end window over
        // to the new video with no special-casing needed here - the "last
        // 15s" of the outgoing video and the "first 15s" of the incoming
        // one are just whichever slot happens to be active at the moment
        // this runs. The logo itself only tracks mvRevealed, so it's up
        // for the whole time any video is genuinely on screen.
        function mvUpdateOverlay() {
            const logo = document.getElementById('mv-logo');
            const pop = document.getElementById('mv-info-pop');
            if (!mvRevealed) {
                logo.classList.remove('is-visible');
                pop.classList.remove('is-visible');
                return;
            }
            logo.classList.add('is-visible');

            const st = players[activeSlot];
            let cur = null, dur = 0;
            if (st.ready) {
                try { cur = st.yt.getCurrentTime(); } catch (e) { /* not ready yet */ }
                try { dur = st.yt.getDuration(); } catch (e) { /* not ready yet */ }
            }
            const nearStart = cur !== null && cur <= MV_INFO_POPUP_WINDOW_SEC;
            const nearEnd = cur !== null && dur > 0 && (dur - cur) <= MV_INFO_POPUP_WINDOW_SEC;
            if (nearStart || nearEnd) {
                document.getElementById('mv-info-title').innerText = npLiveTitle;
                document.getElementById('mv-info-artist').innerText = npLiveArtist;
                pop.classList.add('is-visible');
            } else {
                pop.classList.remove('is-visible');
            }
        }

        function mvSetRate(slot, rate) {
            const st = players[slot];
            if (rate === st.currentRate) return;
            try { st.yt.setPlaybackRate(rate); st.currentRate = rate; } catch (e) { /* rate not available - seeks still work */ }
        }

        // Seeks a little PAST the target by however long seeks have been
        // taking to resume, so the video lands on the right frame instead of
        // arriving that late.
        function mvSeekTo(slot, sec) {
            const st = players[slot];
            st.seekIssuedAt = Date.now();
            if (slot === activeSlot) mvLastCorrectionAt = st.seekIssuedAt;
            st.yt.seekTo(sec + mvSeekLatencyMs / 1000, true);
        }

        // Runs about every 500 ms against whichever slot is ACTIVE right
        // now. Small drift is corrected by briefly nudging playback speed
        // (invisible on a muted video, no stutter); only a large drift
        // triggers a seek.
        function mvCheck() {
            const st = players[activeSlot];
            if (!st.ready || !mvClock) return;
            // A handoff is in flight: mvClock already describes the NEXT song,
            // so the video still on screen (the previous song's) must not be
            // "corrected" against it - that used to yank it back to 0:00.
            if (pendingSlot) return;
            if (st.seekIssuedAt && Date.now() - st.seekIssuedAt > 5000) st.seekIssuedAt = null;
            let state;
            try { state = st.yt.getPlayerState(); } catch (e) { return; }
            const cur = mvVideoPositionSec();
            if (cur === null) return;

            if (!mvClock.isPlaying) {
                // Re-cover the instant we know playback should stop, rather
                // than waiting on the async onStateChange(PAUSED) event to
                // do it - that gap is exactly what let YouTube's native
                // paused UI (title, pause button, "More Videos", captions)
                // flash through uncovered.
                document.getElementById(`video-loading-cover-${activeSlot}`).classList.remove('is-hidden', 'is-hidden-instant');
                if (state === YT.PlayerState.PLAYING) st.yt.pauseVideo();
                mvSetRate(activeSlot, 1);
                return;
            }
            if (state === YT.PlayerState.ENDED) {
                // Held on the cover (see makeYtStateChangeHandler). Only
                // restart it if the song is genuinely still going - e.g. it
                // was scrubbed back - never replay it from the start at the
                // end of a song.
                let dur = 0;
                try { dur = st.yt.getDuration(); } catch (e) { /* ignore */ }
                const target = mvTargetSec();
                if (dur > 0 && target < dur - 1) { mvSeekTo(activeSlot, target); st.yt.playVideo(); }
                return;
            }
            if (state === YT.PlayerState.PAUSED) { st.yt.playVideo(); return; }
            if (state !== YT.PlayerState.PLAYING) return; // buffering/loading - nothing meaningful to measure yet

            const driftMs = (cur - mvTargetSec()) * 1000; // positive = video is ahead of the music
            const absMs = Math.abs(driftMs);
            const settling = Date.now() - mvLastCorrectionAt < (mvFlaggedBad ? MV_FLAGGED_SETTLE_MS : MV_SETTLE_MS);

            if (!settling && absMs > MV_BIG_DRIFT_MS) {
                mvConsecutiveBigDrifts++;
                if (mvConsecutiveBigDrifts >= MV_MAX_BIG_DRIFT_CHECKS) {
                    if (!mvRevealed) { reportVideoFailureAndStop(); return; }
                    // On screen and playing: it FINISHES. Just make sure this
                    // video isn't offered again for this track next time.
                    if (!mvFlaggedBad) {
                        mvFlaggedBad = true;
                        if (currentVideoTrackId && currentVideoId) reportSyncFailed(currentVideoTrackId, currentVideoId, true);
                    }
                    mvConsecutiveBigDrifts = 0;
                }
            } else if (absMs <= MV_BIG_DRIFT_MS) {
                mvConsecutiveBigDrifts = 0;
            }

            // item 7: once a video is genuinely on screen, only reach for a hard seek
            // past a wider threshold than the one used for the initial lock/handoff -
            // rate-nudging alone absorbs everything under it, invisibly.
            const seekThreshold = mvRevealed ? MV_POST_REVEAL_SEEK_THRESHOLD_MS : MV_SEEK_THRESHOLD_MS;

            if (absMs > seekThreshold) {
                if (!settling) {
                    mvSetRate(activeSlot, 1);
                    if (mvRevealed) {
                        // Cover it BEFORE issuing the seek, not after - closes the race
                        // where the reactive onStateChange listener loses to whatever
                        // actually renders in the iframe (a spinner, a brief play/pause
                        // button) during the seek's own buffering window.
                        mvCorrectingActive = true;
                        mvCorrectingReadySince = null;
                        document.getElementById(`video-loading-cover-${activeSlot}`).classList.remove('is-hidden', 'is-hidden-instant');
                    }
                    mvSeekTo(activeSlot, mvTargetSec());
                }
            } else if (absMs > MV_NUDGE_START_MS || (st.currentRate !== 1 && absMs > MV_NUDGE_STOP_MS)) {
                mvSetRate(activeSlot, driftMs < 0 ? 1.25 : 0.75);
            } else {
                mvSetRate(activeSlot, 1);
            }
        }

        // Shared by the song-to-song handoff path (pendingCheck below) and
        // the cold-start reveal path (revealReadyCheck below) - item 6.
        // Both need to answer exactly the same question about a slot that
        // isn't on screen yet: "has it been confirmed PLAYING and within
        // normal sync tolerance (MV_SEEK_THRESHOLD_MS) continuously for
        // MV_HANDOFF_CONFIRM_MS?" Before this refactor, the handoff path
        // already asked that question (this is pendingCheck's original
        // logic, unchanged in substance) but the reveal path didn't ask it
        // at all - it just waited for a bare PLAYING + a fixed delay, with
        // no drift check, which could reveal a video that was already out
        // of sync the instant it appeared.
        //
        // `readySince` is the caller's own streak-start timestamp (null if
        // no streak yet) - passed in and returned rather than stored here,
        // since the two call sites can be in flight at once (an ordinary
        // drift correction on the active slot while a handoff is pending on
        // the other) and each needs its own independent streak. Also nudges
        // the slot back into position (rate-limited to once/second) when
        // it's found to be out of tolerance, same as the original
        // pendingCheck did - getting INTO sync faster is the whole point of
        // checking every ~50ms here rather than waiting for mvCheck's
        // slower ~800ms steady-state cadence.
        function checkSlotConfirmedInSync(slot, readySince) {
            const st = players[slot];
            if (!st.ready || !mvClock) return { confirmed: false, readySince: null };
            let state, cur;
            try {
                state = st.yt.getPlayerState();
                cur = st.yt.getCurrentTime();
            } catch (e) { return { confirmed: false, readySince: null }; }
            if (state !== YT.PlayerState.PLAYING || typeof cur !== 'number') return { confirmed: false, readySince: null };

            const driftMs = Math.abs((cur - mvTargetSec()) * 1000);
            if (driftMs > MV_SEEK_THRESHOLD_MS) {
                // Nudge it back into position and wait for the next check -
                // no more than once a second so this doesn't fight itself.
                if (!st.seekIssuedAt || Date.now() - st.seekIssuedAt > 1000) {
                    mvSeekTo(slot, mvTargetSec());
                }
                return { confirmed: false, readySince: null };
            }
            const since = readySince || Date.now();
            return { confirmed: (Date.now() - since) >= MV_HANDOFF_CONFIRM_MS, readySince: since };
        }

        // Watches whatever's preloading in the non-active slot (see
        // startMusicVideo). Runs on the same ~50ms tick as the active
        // slot's own sampling, but only does anything while a handoff is
        // actually in flight. Only cuts over once the incoming video has
        // been genuinely PLAYING and within normal sync tolerance for
        // MV_HANDOFF_CONFIRM_MS in a row - never on a single lucky reading -
        // so the cut itself never has to be immediately re-corrected. See
        // checkSlotConfirmedInSync above for the actual check - shared with
        // revealReadyCheck below (item 6).
        function pendingCheck() {
            if (!pendingSlot) return;
            const result = checkSlotConfirmedInSync(pendingSlot, pendingReadySince);
            pendingReadySince = result.readySince;
            if (result.confirmed) completeHandoff();
        }

        // Cold-start counterpart to pendingCheck above (item 6) - the very
        // first video of a session has no "previous video" to hand off
        // from, so there's no pendingSlot/completeHandoff involved, but the
        // question is the same one: is the active slot confirmed PLAYING
        // and in sync yet? Runs from the same mvTick loop pendingCheck does
        // - which, for THIS path, is already ticking before reveal:
        // startMusicVideo starts mvDriftInterval immediately on load, not
        // revealMusicVideo - so this has been polling since the moment the
        // video started loading, the same way pendingCheck has always
        // polled a preloading pending slot.
        // The existing mvLoadTimeout (MV_LOAD_TIMEOUT_MS, set in
        // startMusicVideo) already provides the "never plays" giveup this
        // needs, unchanged: it only fires while `!mvRevealed`, and reveal
        // now happens strictly later (once confirmed in sync) than it used
        // to (once merely PLAYING) - so a video that plays but never
        // settles into sync hits that same existing timeout and falls back
        // via reportVideoFailureAndStop(), exactly per item 6's spec,
        // without needing a second timer here.
        function revealReadyCheck() {
            if (!musicVideoActive || mvRevealed) { mvRevealReadySince = null; return; }
            const result = checkSlotConfirmedInSync(activeSlot, mvRevealReadySince);
            mvRevealReadySince = result.readySince;
            if (result.confirmed) revealMusicVideo();
        }

        // item 7 - third counterpart to pendingCheck/revealReadyCheck: a video
        // that's already on screen and had to be hard-seeked mid-play. Same
        // underlying question ("confirmed PLAYING and within normal tolerance for
        // MV_HANDOFF_CONFIRM_MS straight"), just applied to the active slot after
        // mvCheck has deliberately covered it for a correction, instead of on
        // first load.
        function activeCorrectionCheck() {
            if (!mvCorrectingActive) return;
            const result = checkSlotConfirmedInSync(activeSlot, mvCorrectingReadySince);
            mvCorrectingReadySince = result.readySince;
            if (result.confirmed) {
                mvCorrectingActive = false;
                document.getElementById(`video-loading-cover-${activeSlot}`).classList.add('is-hidden');
            }
        }

        // The actual hard cut: makes the pending slot active and the
        // previously-active slot the new standby, with no CSS transition on
        // either - an instant swap, never a fade through black or ambient.
        function completeHandoff() {
            const oldSlot = activeSlot;
            const newSlot = pendingSlot;
            clearTimeout(pendingLoadTimeout); pendingLoadTimeout = null;

            activeSlot = newSlot;
            currentVideoTrackId = pendingTrackId;
            currentVideoId = pendingVideoId;
            pendingSlot = null; pendingVideoId = null; pendingTrackId = null; pendingReadySince = null;

            document.getElementById(`video-slot-${oldSlot}`).classList.remove('is-active');
            document.getElementById(`video-slot-${newSlot}`).classList.add('is-active');
            document.getElementById(`video-loading-cover-${newSlot}`).classList.add('is-hidden-instant');
            document.getElementById(`video-loading-cover-${oldSlot}`).classList.remove('is-hidden', 'is-hidden-instant');

            if (players[oldSlot].ready) {
                try { players[oldSlot].yt.stopVideo(); } catch (e) { /* ignore */ }
            }

            // Give the freshly-activated slot the usual settle grace period
            // and start sampling it from scratch - mvCheck/mvTick already
            // read whichever slot activeSlot points to, so drift correction
            // picks the new one up automatically from the next tick.
            mvLastCorrectionAt = Date.now();
            mvConsecutiveBigDrifts = 0;
            mvFlaggedBad = false; mvErrorRetries = 0; mvSoftMissSince = null;
            mvCorrectingActive = false; mvCorrectingReadySince = null; // item 7 - old slot's correction context doesn't carry over
            mvLastReading = null;
            mvLastReadingChangedAt = 0;
        }

        function loadIntoSlot(slot, videoId) {
            const st = players[slot];
            clearTimeout(st.loadTimeout);
            if (!st.ready) return;
            st.currentRate = null; // force the rate to be re-applied for the new video
            st.seekIssuedAt = Date.now();
            if (slot === activeSlot) mvLastCorrectionAt = st.seekIssuedAt;
            st.yt.loadVideoById({ videoId, startSeconds: mvTargetSec() + mvSeekLatencyMs / 1000 });
            mvSetRate(slot, 1);
            if (mvClock && !mvClock.isPlaying) st.yt.pauseVideo();
            applySubtitlesSetting(slot);
        }

        function startMusicVideo(videoId, trackId) {
            musicVideoActive = true;

            if (mvRevealed) {
                // A video is already up on screen for the previous song -
                // preload the new one into the OTHER slot behind it and cut
                // to it the instant it's confirmed playing in sync (see
                // pendingCheck/completeHandoff above). The video that's
                // currently showing just keeps playing until then, so
                // there's never a black gap or a dip back to ambient
                // visuals between two music videos.
                const slot = otherSlot(activeSlot);
                pendingSlot = slot; pendingVideoId = videoId; pendingTrackId = trackId; pendingReadySince = null;
                loadIntoSlot(slot, videoId);
                clearTimeout(pendingLoadTimeout);
                pendingLoadTimeout = setTimeout(() => {
                    if (pendingSlot === slot && pendingTrackId === trackId) {
                        const failedTrackId = pendingTrackId, failedVideoId = pendingVideoId;
                        // Only the PLAYER being ready and still not settling
                        // into sync means the video itself is the problem -
                        // blacklist it. If the player was never even ready
                        // (a YouTube API outage - see loadYouTubeApi), that's
                        // an infrastructure problem, not this video's fault;
                        // don't poison it. Either way, drop this handoff
                        // attempt - the current video simply keeps playing.
                        const playerWasReady = players[slot].ready;
                        pendingSlot = null; pendingVideoId = null; pendingTrackId = null; pendingReadySince = null;
                        if (playerWasReady) reportSyncFailed(failedTrackId, failedVideoId);
                    }
                }, MV_HANDOFF_TIMEOUT_MS);
                return;
            }

            // Nothing on screen yet (coming from ambient) - load into the
            // already-active slot; revealReadyCheck (via mvTick, started
            // below) reveals it once confirmed in sync (item 6).
            currentVideoTrackId = trackId;
            currentVideoId = videoId;
            mvFlaggedBad = false; mvErrorRetries = 0; mvSoftMissSince = null;
            mvRevealReadySince = null;
            loadIntoSlot(activeSlot, videoId);

            // If it never actually reveals, stop waiting on it - this now
            // covers two cases, not just the original one, because reveal
            // itself now means more than it used to (item 6): either it
            // never actually starts playing, OR it plays but never settles
            // into sync (revealReadyCheck's confirm-gate never succeeds).
            // Both look identical from here - `!mvRevealed` still true when
            // this fires - so no new logic is needed, just this comment.
            // Only blacklist it if the player itself was ready - that's the
            // video's fault either way. If the player never came up at all
            // (see loadYouTubeApi's retry loop), this is an infrastructure
            // hiccup, not a bad video - drop back to ambient without
            // poisoning it, so it's offered again once things recover
            // (retryLoadIfNeeded also re-kicks it immediately if the player
            // comes up mid-wait).
            clearTimeout(mvLoadTimeout);
            mvLoadTimeout = setTimeout(() => {
                if (!musicVideoActive || mvRevealed) return;
                if (players[activeSlot].ready) {
                    reportVideoFailureAndStop();
                } else {
                    stopMusicVideo();
                }
            }, MV_LOAD_TIMEOUT_MS);

            clearMvDriftInterval();
            mvLastReading = null;
            mvLastReadingChangedAt = 0;
            mvSampleCount = 0;
            mvDriftInterval = setInterval(mvTick, MV_SAMPLE_INTERVAL_MS);
        }

        function stopMusicVideo() {
            if (!musicVideoActive) return;
            const wasRevealed = mvRevealed;
            musicVideoActive = false;
            mvRevealed = false;
            mvRevealReadySince = null;
            clearTimeout(mvLoadTimeout);
            clearTimeout(pendingLoadTimeout); pendingLoadTimeout = null;
            currentVideoTrackId = null;
            currentVideoId = null;
            pendingSlot = null; pendingVideoId = null; pendingTrackId = null; pendingReadySince = null;
            mvClock = null;
            mvFlaggedBad = false; mvErrorRetries = 0; mvSoftMissSince = null;
            clearMvDriftInterval();
            document.getElementById('mv-logo').classList.remove('is-visible');
            document.getElementById('mv-info-pop').classList.remove('is-visible');
            ['a', 'b'].forEach(slot => {
                const st = players[slot];
                if (st.ready) {
                    try { st.yt.stopVideo(); } catch (e) { /* ignore */ }
                }
                document.getElementById(`video-loading-cover-${slot}`).classList.remove('is-hidden', 'is-hidden-instant');
            });
            if (wasRevealed) {
                // Force a fresh render rather than assuming whatever ambient
                // state was current before the video started is still valid.
                resetAmbientAndRepoll();
            } else {
                // Never made it on screen - ambient visuals never stopped.
                pollAmbientVisuals();
            }
        }

        async function pollMusicVideo() {
            try {
                const res = await fetch(eventUrl('/api/music-video'));
                if (!res.ok) return;
                const data = await res.json();
                const receivedAt = Date.now();

                const subtitlesChanged = !!data.subtitlesEnabled !== mvSubtitlesEnabled;
                mvSubtitlesEnabled = !!data.subtitlesEnabled;
                if (subtitlesChanged && musicVideoActive) {
                    applySubtitlesSetting(activeSlot);
                    if (pendingSlot) applySubtitlesSetting(pendingSlot);
                }

                // Admin -> Settings -> Content -> Music Videos - how far
                // ahead/behind of the raw song position the whole video
                // stream should target. Applied on the very next drift
                // check automatically (mvTargetSec reads this live); no
                // need to re-seek immediately just because it changed.
                if (typeof data.videoOffsetMs === 'number' && Number.isFinite(data.videoOffsetMs)) {
                    mvVideoLeadMs = data.videoOffsetMs;
                }
                // Per-video cold-open offset - see mvIntroOffsetMs above.
                // Starts at 0 and picks up the real number a few seconds
                // into a new video once server-side detection resolves.
                mvIntroOffsetMs = (typeof data.introOffsetMs === 'number' && Number.isFinite(data.introOffsetMs))
                    ? data.introOffsetMs : 0;

                // Show Queue / Mute from the admin are deliberate - they win instantly.
                if (visualsForceQueue || data.override) {
                    if (musicVideoActive) stopMusicVideo();
                    return;
                }

                if (data.enabled && data.matched && data.videoId) {
                    // Always fold the newest reading into the sync clock first.
                    updateMvClock(data, receivedAt);
                    mvSoftMissSince = null;
                    const inProgressForThisTrack = musicVideoActive &&
                        (currentVideoTrackId === data.trackId || pendingTrackId === data.trackId);
                    if (!inProgressForThisTrack) {
                        startMusicVideo(data.videoId, data.trackId);
                    }
                } else if (musicVideoActive) {
                    // "No match" is only allowed to end a video that's
                    // already on screen if the SONG has genuinely changed
                    // (the server names the new track). A no-match reading
                    // for the same song - or the server having no song info
                    // for a moment (schedule edge, Spotify/API blip) - is
                    // ignored so the video finishes; only if it persists
                    // well past a blip do we let go.
                    const songChanged = !!data.trackId && data.trackId !== currentVideoTrackId;
                    if (mvRevealed && !songChanged) {
                        if (!mvSoftMissSince) mvSoftMissSince = Date.now();
                        if (Date.now() - mvSoftMissSince < MV_SOFT_MISS_GRACE_MS) return;
                    }
                    stopMusicVideo();
                }
            } catch (e) { /* keep showing whatever's already on screen */ }
        }

        // Ambient view is checked most often since it drives an active
        // slideshow; the fallback board's data is cheap and only visible
        // when ambient visuals aren't running.
        //
        // On a fresh page load - including a mid-song reload of this
        // display while a video was already playing - pollAmbientVisuals()
        // would otherwise render immediately and flash up ambient/queue
        // for the second or two it takes pollMusicVideo() to find the
        // match again and the video to reload, confirm playing, and
        // reveal itself. So the very first ambient render waits for that
        // first music-video check to come back, and skips itself entirely
        // if a match was found - musicVideoActive is true as soon as
        // startMusicVideo() runs, well before the video is actually
        // revealed, and pollAmbientVisuals's own mvRevealed guard would
        // otherwise let it sneak onto screen during that gap. If the video
        // then fails to load or reveal in time, stopMusicVideo() calls
        // pollAmbientVisuals() itself right away - no need to wait on
        // this. Every poll after this first one behaves exactly as before.
        pollQueueBoard();
        pollNowPlaying();
        pollMusicVideo().then(() => {
            if (!musicVideoActive) pollAmbientVisuals();
        });
        setInterval(pollAmbientVisuals, 8000);
        setInterval(pollQueueBoard, 8000);
        setInterval(pollNowPlaying, 4000);
        setInterval(pollMusicVideo, 3000);
    </script>
</body>
</html>
