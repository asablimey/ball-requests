<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khula:wght@600&display=swap">
    <title>Kiosk</title>
    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --red-action: #e91429;
        }

        html { overflow-x: hidden; }
        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
            overflow-x: hidden;
            /* Safety net: any text that isn't explicitly truncated (song
               titles, usernames, etc.) wraps onto a new line instead of
               pushing its box wider than the screen. */
            overflow-wrap: break-word;
            word-break: break-word;
        }
        * { box-sizing: border-box; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #282828;
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: nowrap;
            gap: 15px;
        }

        /* Wraps the title + the venue subtitle underneath it, while staying
           the flexible left-hand item in .header next to the credits box on
           the right. */
        .header-title-block {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-width: 0;
        }

        /* min-width: 0 + ellipsis lets the title shrink/truncate on narrow
           screens instead of wrapping onto a new line - that wrap was what
           pushed the credits box down below the title. Truncating keeps the
           credits box pinned in the header row, top-right, at every width. */
        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 600;
            font-family: 'Khula', sans-serif;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Venue name, shown under the event title in much smaller/muted
           text. Hidden entirely (via inline display:none, toggled in JS)
           when no venue name is set, so it doesn't leave an empty gap. */
        .venue-subtitle {
            margin: 2px 0 0;
            font-size: 0.8rem;
            font-weight: 500;
            color: #a7a7a7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .credits-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .top-pill-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Shared pill style - the credits display and Connect Spotify button
           use this exact same class so they always stay the same size.
           Was a fixed 190px, which is wider than the available space on
           common phones (two side by side exceeds an iPhone 14's 390px
           width once padding is subtracted) - now scales with viewport
           width instead, capping at 190px on larger screens. */
        .pill-btn {
            background-color: var(--panel-bg);
            padding: 10px 16px;
            border-radius: 50px;
            font-weight: 700;
            border: 1px solid #282828;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            width: min(190px, 44vw);
            min-width: 0;
            text-align: center;
        }

        .credits-display { color: white; }

        .connect-spotify-btn {
            background-color: black;
            color: var(--spotify-green);
            border: 1px solid var(--spotify-green);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .connect-spotify-btn svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
        .connect-spotify-btn:hover { background-color: #0a0a0a; }
        .connect-spotify-btn.is-connected {
            color: white;
            background-color: var(--spotify-green);
            border-color: var(--spotify-green);
        }
        .connect-spotify-btn.is-connected:hover { background-color: #1ed760; }

        .credit-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        /* Compact "number over label" badge, e.g. a big "1" over small "CREDIT" -
           replaces the old full-width "Credits: X / Y" pill. */
        .credit-badge {
            background-color: #1c1c1c;
            border: 1px solid #2c2c2c;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 40px;
            padding: 0 12px;
            gap: 1px;
            box-sizing: border-box;
        }
        .credit-badge-number {
            font-size: 1.05rem;
            font-weight: 400;
            line-height: 1;
            color: white;
        }
        .credit-badge-label {
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #a7a7a7;
            line-height: 1;
        }

        .search-bar-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
        }

        .search-box {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid #333;
            padding: 14px 20px;
            color: white;
            border-radius: 50px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 0;
            transition: all 0.2s ease, padding 0.15s ease;
        }
        .search-box:focus { border-color: var(--spotify-green); }
        .search-box.has-inline-btn { padding-right: 150px; }

        /* Disabled search state styling */
        .search-box:disabled {
            background-color: #111;
            border-color: #222;
            color: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .inline-playlists-btn {
            display: none;
            position: absolute;
            top: 6px;
            right: 6px;
            bottom: 6px;
            align-items: center;
            justify-content: center;
            background-color: var(--spotify-green);
            color: white;
            border: 1px solid var(--spotify-green);
            padding: 0 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: filter 0.15s ease;
        }
        .inline-playlists-btn:hover { filter: brightness(1.1); }
        .inline-playlists-btn.is-visible { display: flex; }

        @media (max-width: 400px) {
            .search-box.has-inline-btn { padding-right: 128px; }
            .inline-playlists-btn { padding: 0 12px; font-size: 0.8rem; }
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--spotify-green);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .section-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }
        .section-title-row .section-title { margin-bottom: 0; }

        .my-requests-btn {
            background-color: transparent;
            color: #a7a7a7;
            border: 1px solid #333;
            padding: 7px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .my-requests-btn:hover { color: white; border-color: #555; }

        .my-request-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            background: var(--card-bg);
        }
        .my-request-row img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
        .my-request-text { flex: 1; min-width: 0; }
        .my-request-text p { margin: 0; }
        .my-request-title { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .my-request-artist { color: #a7a7a7; font-size: 0.8rem; margin-top: 2px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .status-queued { background-color: rgba(29, 185, 84, 0.15); color: var(--spotify-green); }
        .status-played { background-color: rgba(167, 167, 167, 0.15); color: #a7a7a7; }
        .status-removed { background-color: rgba(233, 20, 41, 0.15); color: var(--red-action); }

        .song-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #2c2c2c;
            gap: 16px;
            box-sizing: border-box;
            width: 100%;
        }

        .song-details {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .song-details img {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .text-block {
            flex: 1;
            min-width: 0;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .song-title {
            font-weight: 700;
            margin: 0;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .explicit-badge {
            background-color: #7f7f7f;
            color: var(--spotify-black);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .song-artist {
            color: #a7a7a7;
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .vote-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 34px;
        }

        .vote-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        .vote-btn:active { transform: scale(0.8); }

        .vote-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke-width: 2;
            transition: fill 0.2s ease, stroke 0.2s ease;
        }

        .vote-btn-up svg { stroke: #666; }
        .vote-btn-down svg { stroke: #666; }

        .vote-node.user-voted-up .vote-btn-up svg { stroke: var(--spotify-green); fill: var(--spotify-green); }
        .vote-node.user-voted-down .vote-btn-down svg { stroke: var(--red-action); fill: var(--red-action); }

        .vote-count {
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 4px;
            color: #a7a7a7;
            text-align: center;
        }
        .user-voted-up .vote-count { color: var(--spotify-green); }
        .user-voted-down .vote-count { color: var(--red-action); }

        .btn-request {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s ease;
        }
        .btn-request:active { transform: scale(0.95); }
        .btn-request:disabled { background-color: #3e3e3e; cursor: default; }

        .empty-placeholder { color: #666; font-style: italic; text-align: center; padding: 20px 0; }

        /* PLAYLIST MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            /* If the box is ever taller than the viewport (e.g. landscape
               phone with the keyboard open), scroll instead of clipping. */
            overflow-y: auto;
        }
        .modal-overlay.is-visible { display: flex; }

        .modal-box {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid #282828;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 20px;
            border-bottom: 1px solid #282828;
            flex-shrink: 0;
        }
        .modal-back-btn {
            background: none; border: none; color: #a7a7a7; cursor: pointer; padding: 4px;
            display: none; align-items: center; justify-content: center;
        }
        .modal-back-btn.is-visible { display: flex; }
        .modal-back-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .modal-title { font-weight: 800; font-size: 1.1rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .modal-close-btn { background: none; border: none; color: #a7a7a7; cursor: pointer; font-size: 1.3rem; padding: 4px 8px; line-height: 1; }
        .modal-close-btn:hover { color: white; }

        .modal-body { overflow-y: auto; padding: 16px 20px; }

        .playlist-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: background-color 0.15s ease;
        }
        .playlist-row:hover { background-color: var(--card-bg); }
        .playlist-row img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #333; }
        .playlist-row .pl-name { font-weight: 700; font-size: 0.95rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-row .pl-count { font-size: 0.8rem; color: #a7a7a7; margin: 2px 0 0 0; }

        .modal-loading, .modal-empty { color: #a7a7a7; text-align: center; padding: 30px 10px; font-style: italic; }

        /* USERNAME PROMPT MODAL */
        .username-modal-box {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid #282828;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .username-modal-box h3 { margin: 0 0 8px 0; font-size: 1.2rem; }
        .username-modal-box p { margin: 0 0 16px 0; color: #a7a7a7; font-size: 0.9rem; }
        .username-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 12px 16px;
            color: white;
            border-radius: 50px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 14px;
            text-align: center;
        }
        .username-input:focus { border-color: var(--spotify-green); }
        .username-save-btn {
            background-color: var(--spotify-green);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        @media (max-width: 400px) {
            .song-row { padding: 10px; gap: 10px; }
            .btn-request { padding: 8px 14px; font-size: 0.8rem; }
            .pill-btn { padding: 9px 14px; font-size: 0.9rem; width: 150px; }
        }

        /* Toast notifications - replace blocking alert() popups */
        #toast-container {
            position: fixed; top: max(24px, env(safe-area-inset-top, 24px)); left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
            align-items: center; width: 100%; padding: 0 16px; box-sizing: border-box;
            pointer-events: none;
        }
        .toast {
            background: #242424; color: white; border: 1px solid #333;
            border-left: 4px solid var(--spotify-green, #1DB954);
            border-radius: 8px; padding: 12px 18px; font-size: 0.9rem; font-weight: 600;
            max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            opacity: 0; transform: translateY(-12px); transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .toast-error { border-left-color: #e91429; }
        .toast-visible { opacity: 1; transform: translateY(0); }

        /* --- Display-Only Mode: full-screen read-only queue board --- */
        body.kiosk-display-only .credits-container,
        body.kiosk-display-only .search-bar-wrapper {
            display: none !important;
        }
        body.kiosk-display-only .container {
            max-width: 1100px;
        }
        body.kiosk-display-only .header {
            justify-content: center;
            border-bottom: none;
        }
        body.kiosk-display-only h1 {
            font-size: 3rem;
            text-align: center;
        }
        body.kiosk-display-only .section-title-row {
            justify-content: center;
        }
        body.kiosk-display-only .section-title {
            font-size: 1.8rem;
        }
        body.kiosk-display-only #main-display-list .song-row {
            padding: 20px 22px;
        }
        body.kiosk-display-only #main-display-list .song-details img {
            width: 68px;
            height: 68px;
        }
        body.kiosk-display-only #main-display-list .song-title {
            font-size: 1.5rem;
        }
        body.kiosk-display-only #main-display-list .song-artist {
            font-size: 1.15rem;
        }
        /* Read-only: no voting on a board nobody's meant to touch */
        body.kiosk-display-only #main-display-list .actions {
            display: none !important;
        }

        /* --- Now Playing bar (live from Spotify) --- */
        .now-playing-bar {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 60px;
            background-color: var(--panel-bg);
            border-top: 1px solid #282828;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 0 10px 0 16px;
            box-sizing: border-box;
            z-index: 500;
            overflow: hidden;
        }
        .now-playing-bar.is-visible { display: flex; }
        .now-playing-progress-track {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background-color: rgba(255,255,255,0.08);
        }
        .now-playing-progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--spotify-green);
            /* No CSS transition here on purpose - a transition made the bar
               visibly animate/slide backwards for a moment every time a new
               track started (jumping from ~100% down to ~0%). Setting the
               width directly in JS on every tick keeps it snapping straight
               to the correct spot instead. */
        }
        .now-playing-artwork {
            width: 40px; height: 40px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: var(--card-bg);
        }
        .now-playing-text { flex: 1; min-width: 0; }
        .now-playing-title {
            margin: 0; font-weight: 700; font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .now-playing-artist {
            margin: 2px 0 0 0; font-size: 0.75rem; color: #a7a7a7;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .now-playing-live-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: var(--spotify-green);
            flex-shrink: 0;
            animation: now-playing-pulse 1.5s ease-in-out infinite;
        }
        .now-playing-live-dot.is-paused { animation: none; opacity: 0.3; }
        @keyframes now-playing-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        body.has-now-playing-bar { padding-bottom: 76px; }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-title-block">
                <h1 id="event-name-header">crowdDJ</h1>
                <p id="venue-name-subtitle" class="venue-subtitle" style="display: none;"></p>
            </div>
            <div class="credits-container">
                <div class="top-pill-row">
                    <button id="connect-spotify-btn" class="pill-btn connect-spotify-btn" onclick="handleSpotifyConnectClick()">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.586 14.424a.622.622 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.622.622 0 1 1-.277-1.215c3.809-.871 7.077-.496 9.712 1.115a.622.622 0 0 1 .207.857zm1.223-2.722a.78.78 0 0 1-1.072.257c-2.688-1.652-6.786-2.131-9.965-1.166a.78.78 0 0 1-.453-1.492c3.632-1.102 8.147-.568 11.233 1.329a.78.78 0 0 1 .257 1.072zm.105-2.835C14.692 9.115 9.375 8.93 6.297 9.885a.936.936 0 1 1-.55-1.79c3.532-1.095 9.404-.882 13.115 1.36a.936.936 0 0 1-.948 1.612z"/></svg>
                        <span id="connect-spotify-label">Connect Spotify</span>
                    </button>
                    <div class="credit-block">
                        <div id="credits-status" class="credit-badge">
                            <div id="credit-badge-number" class="credit-badge-number">--</div>
                            <div id="credit-badge-label" class="credit-badge-label">Credits</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="search-bar-wrapper">
            <input type="text" id="search-input" class="search-box" placeholder="Search for songs or artists..." oninput="executeSearch()">
            <button type="button" id="inline-playlists-btn" class="inline-playlists-btn" onclick="openPlaylistModal()">My Playlists</button>
        </div>

        <div class="section-title-row">
            <div class="section-title" id="list-title">Live Queue</div>
        </div>
        <div id="main-display-list"></div>
    </div>

    <!-- MY REQUESTS MODAL removed on kiosk - not needed for a shared device -->

    <!-- USERNAME PROMPT MODAL removed on kiosk - always requests as android_kiosk -->

    <!-- PLAYLIST BROWSER MODAL -->
    <div class="modal-overlay" id="playlist-modal">
        <div class="modal-box">
            <div class="modal-header">
                <button class="modal-back-btn" id="modal-back-btn" onclick="showPlaylistGrid()" title="Back">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
                </button>
                <div class="modal-title" id="modal-title">Your Playlists</div>
                <button class="modal-close-btn" onclick="closePlaylistModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body">
                <p class="modal-loading">Loading your playlists…</p>
            </div>
        </div>
    </div>

    <script>
        // This page is served at /e/{slug}/kiosk, so the event's slug is
        // always the second path segment - every relative API call below
        // goes through eventUrl() so it hits the right event's data.
        const EVENT_SLUG = location.pathname.split('/')[2] || '';
        function eventUrl(p) { return `/e/${EVENT_SLUG}${p}`; }

        // Toast notifications - non-blocking replacement for alert()
        let toastTimer = null;
        function showToast(message, type = "error") {
            const container = document.getElementById("toast-container");
            if (!container) { console.log(message); return; }
            container.innerHTML = "";
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add("toast-visible"));
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove("toast-visible");
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Updates the compact "number over label" credit badge - singular/plural
        // aware, matching the "1 / CREDIT" style badge design.
        function updateCreditBadge(count) {
            const numEl = document.getElementById('credit-badge-number');
            const labelEl = document.getElementById('credit-badge-label');
            if (!numEl || !labelEl) return;
            numEl.innerText = count;
            // Only touch the label when full. While recharging, startLocalCountdown()
            // owns this same label and writes the countdown into it instead - so the
            // two never fight over what's displayed there.
            if (count >= maxCredits) {
                labelEl.innerText = count === 1 ? 'CREDIT' : 'CREDITS';
            }
        }
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Artwork URLs come from Spotify (trusted) but were being inserted into
        // <img src="..."> attributes with no validation at all. This only allows
        // actual http(s) URLs through - anything else (e.g. a stray quote that
        // could break out of the attribute, or a javascript: URL) falls back to
        // the same placeholder used elsewhere instead of being trusted blindly.
        function safeImageUrl(url) {
            if (typeof url !== 'string') return 'https://picsum.photos/48';
            try {
                const parsed = new URL(url, window.location.origin);
                if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return 'https://picsum.photos/48';
                return escapeHtml(parsed.href);
            } catch (e) {
                return 'https://picsum.photos/48';
            }
        }

        let availableCredits = 3;
        let maxCredits = 3;
        let searchTimeout = null;
        let timeRemaining = 60;
        let countdownTimer = null;
        let currentServerDuration = 60;
        let globalSearchResults = [];
        let systemRequestsAllowed = true; // Local tracker for global toggling
        let explicitBlockActive = false;
        let queueIsFull = false; // Auto-close from the DJ's queue length cap, distinct from a manual close
        let lastGuestQueue = [];
        let spotifyUpcomingQueue = [];

        if (!localStorage.getItem('voterSignatureToken')) {
            localStorage.setItem('voterSignatureToken', 'voter_' + Math.random().toString(36).substr(2, 9));
        }
        const voterSignatureToken = localStorage.getItem('voterSignatureToken');

        // --- Kiosk identity: fixed, no per-guest prompt (this is a shared device) ---
        let guestUsername = 'android_kiosk';

        async function fetchSystemState() {
            try {
                const res = await fetch(eventUrl('/kiosk-data'));
                if (!res.ok) return;
                const data = await res.json();

                maxCredits = data.maxCredits;
                currentServerDuration = data.countdownLength;
                systemRequestsAllowed = data.requestsAllowed;
                explicitBlockActive = data.explicitBlockActive || false;
                queueIsFull = data.queueFull || false;

                // "Display-Only Mode" (set from Admin > Kiosk Page settings): strips
                // this down to a full-screen, read-only Live Queue board - no search,
                // no credits, no voting. CSS does the actual hiding; this just toggles
                // the class so it responds live if the DJ flips it mid-event.
                document.body.classList.toggle('kiosk-display-only', !!data.displayOnlyMode);

                const spotifyBtn = document.getElementById('connect-spotify-btn');
                if (spotifyBtn) spotifyBtn.style.display = data.spotifyConnectEnabled === false ? 'none' : '';

                const nameHeader = document.getElementById('event-name-header');
                const newName = (data.eventName && data.eventName.trim() !== '') ? data.eventName.trim() : 'crowdDJ';
                if (nameHeader.innerText !== newName) {
                    nameHeader.innerText = newName;
                    // Tab title stays "Kiosk" here (unlike the guest page) so it's
                    // easy to spot this tab among others on the kiosk device.
                }

                const venueSubtitle = document.getElementById('venue-name-subtitle');
                const newVenueName = (data.venueName && data.venueName.trim() !== '') ? data.venueName.trim() : '';
                if (venueSubtitle.innerText !== newVenueName) {
                    venueSubtitle.innerText = newVenueName;
                }
                venueSubtitle.style.display = newVenueName ? '' : 'none';

                setupLocalCredits();
                manageCountdownVisibility();

                // Live lock/unlock layout handling. Requests can be closed two ways:
                // the DJ manually pausing them, or the queue length cap auto-closing
                // once it hits the configured max - each gets its own message.
                const searchInput = document.getElementById('search-input');
                const effectivelyOpen = systemRequestsAllowed && !queueIsFull;
                if (!effectivelyOpen) {
                    searchInput.disabled = true;
                    searchInput.value = "";
                    searchInput.placeholder = queueIsFull
                        ? "Queue is full right now — wait for songs to play, it'll reopen automatically."
                        : "Song submissions are currently paused by the DJ.";
                    document.getElementById('list-title').innerText = "Live Queue";
                    renderQueue(data.queue);
                } else {
                    if (searchInput.disabled) {
                        searchInput.disabled = false;
                        searchInput.placeholder = "Search for songs or artists...";
                    }

                    if (searchInput.value.trim() === "") {
                        document.getElementById('list-title').innerText = "Live Queue";
                        renderQueue(data.queue);
                    }
                }
            } catch (e) { console.log("State sync failure."); }
        }

        function setupLocalCredits() {
            if (localStorage.getItem('userCredits') === null) {
                localStorage.setItem('userCredits', maxCredits);
            }
            availableCredits = parseInt(localStorage.getItem('userCredits'));

            if (availableCredits > maxCredits) {
                availableCredits = maxCredits;
                localStorage.setItem('userCredits', availableCredits);
            }

            updateCreditBadge(availableCredits);
        }

        function manageCountdownVisibility() {
            if (availableCredits >= maxCredits) {
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                updateCreditBadge(availableCredits); // makes sure the Credit(s) word is showing
            } else {
                startLocalCountdown();
            }
        }

        // Writes the recharge countdown straight into the badge's label spot
        // (where "Credit"/"Credits" normally sits), so it's just a bare
        // number-of-seconds like "43s" - no "Next Credit:" prefix. Once
        // credits refill back to max, the label reverts to the word via
        // updateCreditBadge().
        function startLocalCountdown() {
            if (countdownTimer) return;
            beginCountdownTimer();
        }

        // Forces the countdown back to the full duration, even if one was
        // already running - used right after a credit is actually spent, so
        // using a second credit mid-countdown resets the wait instead of
        // keeping whatever time was left.
        function restartLocalCountdown() {
            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }
            beginCountdownTimer();
        }

        function beginCountdownTimer() {
            const labelEl = document.getElementById('credit-badge-label');
            const numEl = document.getElementById('credit-badge-number');
            timeRemaining = currentServerDuration;
            if (labelEl) labelEl.innerText = `${timeRemaining}s`;

            countdownTimer = setInterval(() => {
                timeRemaining--;

                if (timeRemaining <= 0) {
                    timeRemaining = currentServerDuration;
                    if (availableCredits < maxCredits) {
                        availableCredits++;
                        localStorage.setItem('userCredits', availableCredits);
                        if (numEl) numEl.innerText = availableCredits;
                    }
                }

                if (availableCredits >= maxCredits) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    updateCreditBadge(availableCredits);
                } else if (labelEl) {
                    labelEl.innerText = `${timeRemaining}s`;
                }
            }, 1000);
        }

        function renderQueue(queue) {
            if (queue) lastGuestQueue = queue;

            // The now-playing poll calls this every few seconds to refresh
            // the Spotify continuation rows - but if search results are
            // currently on screen, overwriting #main-display-list here
            // would yank those results away a few seconds after they
            // appeared. Only render the Live Queue view when that's
            // actually what's on screen.
            const searchInput = document.getElementById('search-input');
            if (searchInput && searchInput.value.trim() !== '' && !searchInput.disabled) {
                return;
            }

            const display = document.getElementById('main-display-list');

            const guestIds = new Set(lastGuestQueue.map(s => s.id));
            const spotifyOnly = (spotifyUpcomingQueue || []).filter(t => !guestIds.has(t.id));

            if (lastGuestQueue.length === 0 && spotifyOnly.length === 0) {
                display.innerHTML = '<p class="empty-placeholder">No songs requested yet. Be the first!</p>';
                return;
            }

            const guestRowsHtml = lastGuestQueue.map(song => {
                const isUpvoted = song.upvoters && song.upvoters.includes(voterSignatureToken);
                const isDownvoted = song.downvoters && song.downvoters.includes(voterSignatureToken);

                return `
                    <div class="song-row">
                        <div class="song-details">
                            <img src="${safeImageUrl(song.artwork)}">
                            <div class="text-block">
                                <div class="title-wrapper">
                                    <p class="song-title">${escapeHtml(song.title)}</p>
                                    ${song.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                </div>
                                <p class="song-artist">${escapeHtml(song.artist)}</p>
                            </div>
                        </div>
                        <div class="actions">
                            <div class="vote-node ${isUpvoted ? 'user-voted-up' : ''}">
                                <button class="vote-btn vote-btn-up" onclick="castVote('${song.id}', 'up')">
                                    <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                                </button>
                                <span class="vote-count">${song.ups || 0}</span>
                            </div>
                            <div class="vote-node ${isDownvoted ? 'user-voted-down' : ''}">
                                <button class="vote-btn vote-btn-down" onclick="castVote('${song.id}', 'down')">
                                    <svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
                                </button>
                                <span class="vote-count">${song.downs || 0}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Spotify continuation rows fill out the queue beneath real guest
            // requests - rendered the same as any other row, no label or
            // divider singling them out.
            const spotifyRowsHtml = spotifyOnly.map(t => `
                <div class="song-row">
                    <div class="song-details">
                        <img src="${safeImageUrl(t.artwork)}">
                        <div class="text-block">
                            <div class="title-wrapper">
                                <p class="song-title">${escapeHtml(t.title)}</p>
                            </div>
                            <p class="song-artist">${escapeHtml(t.artist)}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            display.innerHTML = guestRowsHtml + spotifyRowsHtml;
        }

        async function castVote(id, type) {
            try {
                const res = await fetch(eventUrl('/api/vote'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, type, voterId: voterSignatureToken })
                });
                if (res.ok) fetchSystemState();
            } catch (e) { console.log("Voting entry exception dropped."); }
        }

        function executeSearch() {
            if (!systemRequestsAllowed || queueIsFull) return; // Prevent querying if system is locked down

            clearTimeout(searchTimeout);
            const query = document.getElementById('search-input').value.trim();

            if (query === "") {
                fetchSystemState();
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(eventUrl(`/api/search?q=${encodeURIComponent(query)}`));
                    const data = await res.json();

                    document.getElementById('list-title').innerText = "Search Results";
                    const display = document.getElementById('main-display-list');

                    if (!data.tracks || data.tracks.length === 0) {
                        globalSearchResults = [];
                        display.innerHTML = '<p class="empty-placeholder">No matching songs found.</p>';
                        return;
                    }

                    globalSearchResults = data.tracks;

                    display.innerHTML = data.tracks.map((track, index) => `
                        <div class="song-row">
                            <div class="song-details">
                                <img src="${safeImageUrl(track.artwork)}">
                                <div class="text-block">
                                    <div class="title-wrapper">
                                        <p class="song-title">${escapeHtml(track.name)}</p>
                                        ${track.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                    </div>
                                    <p class="song-artist">${escapeHtml(track.artist)}</p>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-request" onclick="submitRequestAtIndex(${index})">Request</button>
                            </div>
                        </div>
                    `).join('');
                } catch (e) { console.log("Search extraction error"); }
            }, 300);
        }

        // Shared submission path used by both search results and the playlist browser,
        // so credits, explicit-locking, and error handling behave identically either way.
        async function submitTrackRequest(track) {
            if (!systemRequestsAllowed) {
                showToast("Submissions are currently closed.", "error");
                return false;
            }
            if (queueIsFull) {
                showToast("Queue is full right now — wait for a song or two to play, it'll reopen automatically.", "error");
                return false;
            }
            if (availableCredits <= 0) {
                showToast("You are out of credits! Wait for the regeneration cycle.", "error");
                return false;
            }
            try {
                // Dedicated kiosk endpoint - the server decides kiosk-vs-guest
                // rules by which route this hits, not by a flag we send, so a
                // regular guest page can't just claim isKiosk:true to borrow
                // the kiosk's credit/pause settings.
                const res = await fetch(eventUrl('/api/kiosk-request'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ track, username: guestUsername, voterId: voterSignatureToken })
                });

                if (res.ok) {
                    availableCredits--;
                    localStorage.setItem('userCredits', availableCredits);
                    updateCreditBadge(availableCredits);
                    restartLocalCountdown();
                    await fetchSystemState();
                    return true;
                } else {
                    const errorData = await res.json();
                    showToast(errorData.error || "Submission rejected.", "error");
                    return false;
                }
            } catch (e) {
                showToast("Failed to connect to request server.", "error");
                return false;
            }
        }

        async function submitRequestAtIndex(index) {
            const track = globalSearchResults[index];
            if (!track) return;
            const ok = await submitTrackRequest(track);
            if (ok) {
                document.getElementById('search-input').value = "";
                showToast("Song successfully added to the queue!", "success");
            }
        }

        fetchSystemState();
        setInterval(fetchSystemState, 4000);

        // --- Guest Spotify Connect (browse-your-playlists) ---
        // Uses Authorization Code + PKCE entirely in the browser: no server session or
        // secret needed, the token just lives for this tab so the guest can pick songs
        // from their own playlists. Scopes are read-only (playlists only).

        const GUEST_SPOTIFY_SCOPES = 'playlist-read-private playlist-read-collaborative';
        let guestSpotifyToken = null;
        let activePlaylistId = null;

        function randomPkceString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let text = '';
            const randomValues = crypto.getRandomValues(new Uint8Array(length));
            for (let i = 0; i < length; i++) text += chars[randomValues[i] % chars.length];
            return text;
        }

        function base64UrlEncode(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function pkceChallengeFromVerifier(verifier) {
            const data = new TextEncoder().encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            return base64UrlEncode(digest);
        }

        function guestRedirectUri() {
            return window.location.origin + window.location.pathname;
        }

        function updateSpotifyConnectButton(connected) {
            const btn = document.getElementById('connect-spotify-btn');
            const label = document.getElementById('connect-spotify-label');
            btn.classList.toggle('is-connected', connected);
            label.innerText = connected ? 'Connected' : 'Connect Spotify';

            const inlineBtn = document.getElementById('inline-playlists-btn');
            const searchBox = document.getElementById('search-input');
            inlineBtn.classList.toggle('is-visible', connected);
            searchBox.classList.toggle('has-inline-btn', connected);
        }

        function disconnectSpotify() {
            guestSpotifyToken = null;
            sessionStorage.removeItem('guest_spotify_token');
            sessionStorage.removeItem('guest_spotify_token_expiry');
            updateSpotifyConnectButton(false);
            closePlaylistModal();
        }

        async function handleSpotifyConnectClick() {
            if (guestSpotifyToken) {
                disconnectSpotify();
                return;
            }

            try {
                const configRes = await fetch(eventUrl('/api/public-config'));
                if (!configRes.ok) {
                    showToast("Could not reach the server to start Spotify login.", "error");
                    return;
                }
                const config = await configRes.json();
                if (!config.spotifyClientId) {
                    showToast("Spotify connect is not configured on the server yet (missing SPOTIFY_CLIENT_ID).", "error");
                    return;
                }

                const verifier = randomPkceString(64);
                sessionStorage.setItem('guest_pkce_verifier', verifier);
                const challenge = await pkceChallengeFromVerifier(verifier);

                // A random state value tied to this specific login attempt, checked
                // again when Spotify redirects back - without it, an attacker could
                // craft their own authorize link and trick a guest into completing
                // a login the guest never actually started (CSRF on the login flow).
                const state = randomPkceString(32);
                sessionStorage.setItem('guest_pkce_state', state);

                const params = new URLSearchParams({
                    response_type: 'code',
                    client_id: config.spotifyClientId,
                    scope: GUEST_SPOTIFY_SCOPES,
                    redirect_uri: guestRedirectUri(),
                    code_challenge_method: 'S256',
                    code_challenge: challenge,
                    state: state
                });
                window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
            } catch (e) {
                showToast("Could not start Spotify login.", "error");
            }
        }

        async function completeGuestSpotifyLogin() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const returnedState = params.get('state');
            if (!code) return;

            // Clean the ?code=...&state=... out of the URL either way, so a refresh doesn't re-trigger this
            window.history.replaceState({}, document.title, guestRedirectUri());

            const verifier = sessionStorage.getItem('guest_pkce_verifier');
            const expectedState = sessionStorage.getItem('guest_pkce_state');
            sessionStorage.removeItem('guest_pkce_state');
            if (!verifier) return;

            // If the state doesn't match what this browser actually started, this
            // isn't a login we initiated - bail out rather than completing it.
            if (!expectedState || returnedState !== expectedState) {
                console.log('Spotify login state mismatch - aborting.');
                return;
            }

            try {
                const configRes = await fetch(eventUrl('/api/public-config'));
                const config = await configRes.json();

                const tokenRes = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({
                        grant_type: 'authorization_code',
                        code,
                        redirect_uri: guestRedirectUri(),
                        client_id: config.spotifyClientId,
                        code_verifier: verifier
                    })
                });
                const data = await tokenRes.json();
                if (data.access_token) {
                    guestSpotifyToken = data.access_token;
                    sessionStorage.setItem('guest_spotify_token', data.access_token);
                    sessionStorage.setItem('guest_spotify_token_expiry', String(Date.now() + data.expires_in * 1000));
                    updateSpotifyConnectButton(true);
                    openPlaylistModal();
                } else {
                    console.log('Spotify token exchange failed:', data);
                    showToast(data.error_description || "Spotify login failed. Check that the redirect URI is registered in the Spotify Dashboard.", "error");
                }
            } catch (e) { console.log('Guest Spotify token exchange failed.'); }
        }

        function restoreGuestSpotifySession() {
            const token = sessionStorage.getItem('guest_spotify_token');
            const expiry = parseInt(sessionStorage.getItem('guest_spotify_token_expiry') || '0', 10);
            if (token && Date.now() < expiry) {
                guestSpotifyToken = token;
                updateSpotifyConnectButton(true);
            }
        }

        function openPlaylistModal() {
            document.getElementById('playlist-modal').classList.add('is-visible');
            showPlaylistGrid();
        }
        function closePlaylistModal() {
            document.getElementById('playlist-modal').classList.remove('is-visible');
        }

        // Tapping the dimmed backdrop (not the modal box itself) closes whichever
        // popup is open - applies to every .modal-overlay on the page.
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) overlay.classList.remove('is-visible');
            });
        });

        // --- My Requests (guest-only view of their own request status) ---
        function statusLabel(status) {
            if (status === 'played') return 'Played';
            if (status === 'removed') return 'Dropped';
            return 'In Queue';
        }
        function statusClass(status) {
            if (status === 'played') return 'status-played';
            if (status === 'removed') return 'status-removed';
            return 'status-queued';
        }

        async function openMyRequestsModal() {
            document.getElementById('my-requests-modal').classList.add('is-visible');
            const body = document.getElementById('my-requests-body');
            body.innerHTML = '<p class="modal-loading">Loading your requests…</p>';

            try {
                const res = await fetch(eventUrl(`/api/my-requests?voterId=${encodeURIComponent(voterSignatureToken)}`));
                if (!res.ok) {
                    body.innerHTML = '<p class="modal-empty">Could not load your requests. Try again.</p>';
                    return;
                }
                const data = await res.json();
                const requests = data.requests || [];

                if (requests.length === 0) {
                    body.innerHTML = '<p class="modal-empty">You haven\'t requested any songs yet.</p>';
                    return;
                }

                body.innerHTML = requests.map(r => `
                    <div class="my-request-row">
                        <img src="${safeImageUrl(r.artwork)}">
                        <div class="my-request-text">
                            <p class="my-request-title">${escapeHtml(r.title)}</p>
                            <p class="my-request-artist">${escapeHtml(r.artist)}</p>
                        </div>
                        <span class="status-pill ${statusClass(r.status)}">${statusLabel(r.status)}</span>
                    </div>
                `).join('');
            } catch (e) {
                body.innerHTML = '<p class="modal-empty">Could not load your requests. Try again.</p>';
            }
        }

        function closeMyRequestsModal() {
            document.getElementById('my-requests-modal').classList.remove('is-visible');
        }

        async function showPlaylistGrid() {
            activePlaylistId = null;
            document.getElementById('modal-title').innerText = 'Your Playlists';
            document.getElementById('modal-back-btn').classList.remove('is-visible');
            const body = document.getElementById('modal-body');
            body.innerHTML = '<p class="modal-loading">Loading your playlists…</p>';

            try {
                const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
                    headers: { Authorization: `Bearer ${guestSpotifyToken}` }
                });
                if (res.status === 401) {
                    guestSpotifyToken = null;
                    sessionStorage.removeItem('guest_spotify_token');
                    updateSpotifyConnectButton(false);
                    closePlaylistModal();
                    showToast('Your Spotify session expired — hit "Connect Spotify" again.', "error");
                    return;
                }
                const data = await res.json();
                const playlists = data.items || [];

                if (playlists.length === 0) {
                    body.innerHTML = '<p class="modal-empty">No playlists found on your Spotify account.</p>';
                    return;
                }

                body.innerHTML = playlists.map(pl => `
                    <div class="playlist-row" onclick="showPlaylistTracks('${pl.id}', ${JSON.stringify(pl.name).replace(/"/g, '&quot;')})">
                        <img src="${safeImageUrl(pl.images?.[0]?.url)}">
                        <div>
                            <p class="pl-name">${pl.name}</p>
                            <p class="pl-count">${pl.items?.total ?? pl.tracks?.total ?? 0} tracks</p>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                body.innerHTML = '<p class="modal-empty">Could not load playlists. Try again.</p>';
            }
        }

        function formatMsToClock(ms) {
            if (!ms) return '--:--';
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function mapSpotifyTrack(t) {
            return {
                id: t.id,
                name: t.name,
                artist: (t.artists || []).map(a => a.name).join(', '),
                artwork: t.album?.images?.[0]?.url || 'https://picsum.photos/48',
                explicit: t.explicit || false,
                duration: formatMsToClock(t.duration_ms)
            };
        }

        async function showPlaylistTracks(playlistId, playlistName) {
            activePlaylistId = playlistId;
            document.getElementById('modal-title').innerText = playlistName;
            document.getElementById('modal-back-btn').classList.add('is-visible');
            const body = document.getElementById('modal-body');
            body.innerHTML = '<p class="modal-loading">Loading tracks…</p>';

            try {
                const res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/items?limit=50`, {
                    headers: { Authorization: `Bearer ${guestSpotifyToken}` }
                });

                // Spotify only serves playlist contents for playlists you own or collaborate on.
                // For anything you just follow, this call comes back non-OK (or with no items).
                if (!res.ok) {
                    body.innerHTML = '<p class="modal-empty">Sorry, you dont own the playlist</p>';
                    return;
                }

                const data = await res.json();
                // Spotify (Feb 2026 API changes) renamed each entry's "track" field to "item".
                let tracks = (data.items || []).map(i => i.item || i.track).filter(t => t && t.id);

                // Match the DJ's explicit-content rule the same way search results already do
                if (explicitBlockActive) tracks = tracks.filter(t => !t.explicit);

                if (tracks.length === 0) {
                    body.innerHTML = '<p class="modal-empty">No requestable tracks in this playlist.</p>';
                    return;
                }

                body.innerHTML = tracks.map((t, index) => `
                    <div class="song-row" style="margin-bottom: 8px;">
                        <div class="song-details">
                            <img src="${safeImageUrl(t.album?.images?.[0]?.url)}">
                            <div class="text-block">
                                <div class="title-wrapper">
                                    <p class="song-title">${escapeHtml(t.name)}</p>
                                    ${t.explicit ? '<span class="explicit-badge">E</span>' : ''}
                                </div>
                                <p class="song-artist">${escapeHtml((t.artists || []).map(a => a.name).join(', '))}</p>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-request" id="pl-track-btn-${index}" onclick="requestFromPlaylist(${index}, this)">Request</button>
                        </div>
                    </div>
                `).join('');

                window.__currentPlaylistTracks = tracks;
            } catch (e) {
                body.innerHTML = '<p class="modal-empty">Could not load this playlist. Try again.</p>';
            }
        }

        async function requestFromPlaylist(index, btnEl) {
            const rawTrack = (window.__currentPlaylistTracks || [])[index];
            if (!rawTrack) return;
            const track = mapSpotifyTrack(rawTrack);

            btnEl.disabled = true;
            const ok = await submitTrackRequest(track);
            if (ok) {
                btnEl.innerText = 'Added ✓';
            } else {
                btnEl.disabled = false;
            }
        }


        restoreGuestSpotifySession();
        completeGuestSpotifyLogin();
    </script>
    <div id="toast-container"></div>

    <!-- Now Playing bar - live from the DJ's connected Spotify account. The
         "up next" queue used to live in a slide-up panel toggled from here;
         it now renders inline in the Live Queue view instead (see
         renderQueue() above), so this bar is just the current-track strip. -->
    <div class="now-playing-bar" id="now-playing-bar">
        <div class="now-playing-progress-track">
            <div class="now-playing-progress-fill" id="now-playing-progress-fill"></div>
        </div>
        <img class="now-playing-artwork" id="now-playing-artwork" src="" alt="">
        <div class="now-playing-text">
            <p class="now-playing-title" id="now-playing-title"></p>
            <p class="now-playing-artist" id="now-playing-artist"></p>
        </div>
        <div class="now-playing-live-dot" id="now-playing-live-dot"></div>
    </div>

    <script>
        // --- Now Playing bar: polls a cached, public endpoint (not Spotify
        // directly) so this stays cheap even with many guests' browsers open
        // at once. Hides itself entirely when nothing's playing, rather than
        // showing an empty/broken-looking bar.
        let nowPlayingState = null;
        let nowPlayingTicker = null;
        let nowPlayingLastTrackId = null;

        function renderNowPlayingProgress() {
            if (!nowPlayingState || !nowPlayingState.durationMs) return;
            const elapsed = nowPlayingState.isPlaying ? (Date.now() - nowPlayingState.fetchedAt) : 0;
            const pct = Math.min(100, ((nowPlayingState.progressMs + elapsed) / nowPlayingState.durationMs) * 100);
            const fillEl = document.getElementById('now-playing-progress-fill');
            if (fillEl) fillEl.style.width = pct + '%';
        }

        function updateNowPlayingBar(data) {
            const bar = document.getElementById('now-playing-bar');
            if (!bar) return;

            if (!data || !data.connected || !data.title) {
                bar.classList.remove('is-visible');
                document.body.classList.remove('has-now-playing-bar');
                nowPlayingState = null;
                nowPlayingLastTrackId = null;
                if (nowPlayingTicker) { clearInterval(nowPlayingTicker); nowPlayingTicker = null; }
                spotifyUpcomingQueue = [];
                renderQueue();
                return;
            }

            document.getElementById('now-playing-artwork').src = data.artwork || '';
            document.getElementById('now-playing-title').innerText = data.title;
            document.getElementById('now-playing-artist').innerText = data.artist || '';
            document.getElementById('now-playing-live-dot').classList.toggle('is-paused', !data.isPlaying);

            bar.classList.add('is-visible');
            document.body.classList.add('has-now-playing-bar');

            nowPlayingState = {
                progressMs: data.progressMs || 0,
                durationMs: data.durationMs || 0,
                isPlaying: !!data.isPlaying,
                fetchedAt: Date.now()
            };
            // Jump straight to the correct spot on every fresh poll (including
            // track changes) rather than letting it drift - renderNowPlayingProgress
            // sets width directly with no CSS transition, so this is instant.
            renderNowPlayingProgress();
            nowPlayingLastTrackId = data.trackId || null;

            if (!nowPlayingTicker) nowPlayingTicker = setInterval(renderNowPlayingProgress, 250);

            // Feeds the merged Live Queue renderer (see renderQueue() above)
            // rather than drawing its own separate list - Spotify's live "up
            // next" now shows inline in the main queue view.
            spotifyUpcomingQueue = data.upcoming || [];
            renderQueue();
        }

        async function pollNowPlaying() {
            try {
                const res = await fetch(eventUrl('/api/now-playing'));
                if (!res.ok) return;
                updateNowPlayingBar(await res.json());
            } catch (e) { /* keep last known state on a transient network hiccup */ }
        }

        pollNowPlaying();
        setInterval(pollNowPlaying, 4000);
    </script>

</body>
