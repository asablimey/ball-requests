<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start a New Event</title>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

    <style>
        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --panel-bg: #181818;
            --card-bg: #242424;
            --red-action: #e91429;
        }
        html { overflow-x: hidden; }
        body {
            background-color: var(--spotify-black);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 25px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wrap { width: 100%; max-width: 460px; }
        h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 6px 0; text-align: center; }
        .subtitle { color: #a7a7a7; text-align: center; margin: 0 0 28px 0; font-size: 0.95rem; }

        .card {
            background: var(--panel-bg);
            border: 1px solid #282828;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .card h2 { font-size: 1.1rem; margin: 0 0 16px 0; }

        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; position: relative; }
        .input-group label { font-size: 0.8rem; text-transform: uppercase; color: #a7a7a7; font-weight: 700; letter-spacing: 0.5px; }
        .input-group label .optional-tag { text-transform: none; font-weight: 400; color: #666; letter-spacing: 0; }
        .input-group input {
            background-color: var(--card-bg);
            border: 1px solid #333;
            padding: 12px 14px;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            width: 100%;
        }
        .input-group input:focus { outline: none; border-color: var(--spotify-green); }
        .url-preview { font-size: 0.8rem; color: #666; margin-top: 2px; }
        .url-preview strong { color: #a7a7a7; }

        .availability { font-size: 0.8rem; margin-top: 4px; min-height: 1em; }
        .availability.ok { color: var(--spotify-green); }
        .availability.taken { color: var(--red-action); }

        .primary-btn {
            width: 100%;
            background-color: white;
            color: black;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .primary-btn:hover { background-color: var(--spotify-green); color: white; }
        .primary-btn:disabled { opacity: 0.5; cursor: default; }

        .error-msg { color: var(--red-action); font-size: 0.85rem; margin-top: 12px; display: none; }

        .divider { text-align: center; color: #555; font-size: 0.8rem; margin: 20px 0; }

        .join-row { display: flex; gap: 10px; }
        .join-row input { flex: 1; }
        .join-row button {
            background: var(--card-bg);
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .join-row button:hover { border-color: var(--spotify-green); }

        /* --- Venue location picker --- */
        .location-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 2px;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            z-index: 500;
            max-height: 220px;
            overflow-y: auto;
            display: none;
        }
        .location-suggestions.visible { display: block; }
        .location-suggestion-item {
            padding: 10px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 1px solid #2f2f2f;
        }
        .location-suggestion-item:last-child { border-bottom: none; }
        .location-suggestion-item:hover { background: #2f2f2f; }

        .location-map {
            height: 220px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #333;
            /* Leaflet's default marker/panes assume its own stacking context;
               keep the map itself below the suggestions dropdown above it. */
            z-index: 1;
        }
        .location-clear-btn {
            background: none;
            border: none;
            color: #a7a7a7;
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
            margin-top: 6px;
            align-self: flex-start;
        }
        .location-clear-btn:hover { color: white; }

        /* Plain floating attribution text, no box/badge - matches how
           Google Maps itself shows required credit: quiet grey text
           with no background, border, or pill shape sitting on the map. */
        .maplibregl-ctrl-attrib {
            background: none !important;
            box-shadow: none !important;
            color: rgba(255, 255, 255, 0.55) !important;
            font-size: 0.6rem !important;
            padding: 0 4px !important;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.6);
        }
        .maplibregl-ctrl-attrib a { color: rgba(255, 255, 255, 0.7) !important; }
        .maplibregl-ctrl-attrib-button { display: none !important; }
        .maplibregl-canvas { border-radius: 8px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>🎧 Song Request Station</h1>
        <p class="subtitle">Every DJ gets their own independent event - own queue, own settings, own Spotify connection.</p>

        <div class="card">
            <h2>Start a new event</h2>
            <div class="input-group">
                <label>Event Name</label>
                <input type="text" id="input-event-name" placeholder="Friday Night Live" maxlength="60">
            </div>
            <div class="input-group">
                <label>Venue Name</label>
                <input type="text" id="input-venue-name" placeholder="Ivy Nightclub" maxlength="120">
            </div>
            <div class="input-group">
                <label>Admin Password</label>
                <input type="password" id="input-password" placeholder="At least 4 characters">
            </div>

            <div class="input-group">
                <label>Venue Location <span class="optional-tag">(optional)</span></label>
                <input type="text" id="input-location-search" placeholder="Search for an address or venue name" autocomplete="off">
                <div class="location-suggestions" id="location-suggestions"></div>
                <div id="location-map" class="location-map"></div>
                <div class="url-preview" id="location-hint">Search to drop a pin, then drag it to the exact spot.</div>
                <button type="button" class="location-clear-btn" id="location-clear-btn" style="display:none;" onclick="clearLocation()">Clear location</button>
            </div>

            <button class="primary-btn" id="create-btn" onclick="submitNewEvent()">Create Event</button>
            <div class="error-msg" id="error-msg"></div>
        </div>

        <div class="divider">— or —</div>

        <div class="card">
            <h2>Already have an event?</h2>
            <div class="join-row">
                <input type="text" id="input-join-slug" placeholder="event-url" autocapitalize="off" autocorrect="off" onkeydown="if(event.key === 'Enter') goToEvent()">
                <button onclick="goToEvent()">Go</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script>
        const nameInput = document.getElementById('input-event-name');
        const venueNameInput = document.getElementById('input-venue-name');

        // Only used client-side now to build a friendly working title for
        // the "Already have an event?" join box below - the actual event
        // slug is generated server-side from the event name, since guests
        // find events through the venue list/map now rather than typing or
        // being given a custom URL.
        function slugify(str) {
            return str.toLowerCase()
                .trim()
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '')
                .slice(0, 40);
        }

        // ============================================================
        // Venue location picker - MapLibre GL + your custom MapTiler
        // style + OpenStreetMap Nominatim for search.
        //
        // Search gets the admin close; the draggable marker lets them
        // fine-tune the exact spot (a geocoded address often lands
        // mid-building, not at the actual door guests will stand near).
        // ============================================================
        const locationSearchInput = document.getElementById('input-location-search');
        const suggestionsBox = document.getElementById('location-suggestions');
        const clearLocationBtn = document.getElementById('location-clear-btn');
        let searchDebounceTimer = null;
        let selectedLat = null;
        let selectedLng = null;
        let selectedVenueName = '';

        // Default view before anything is searched: New Zealand, zoomed to
        // show the whole country - most events created here are local, so
        // this saves almost everyone a manual pan/zoom before they can even
        // start searching. Searching (or an address autofilling) flies the
        // map to the actual result regardless.
        const map = new maplibregl.Map({
            container: 'location-map',
            style: 'https://api.maptiler.com/maps/01a05fbf-a06a-7765-89f4-0dfb2a61f1c9/style.json?key=ptzMWbAi73a8Qnb2bpOZ',
            center: [172.8, -41.2],
            zoom: 4.6,
            scrollZoom: false,
            attributionControl: false
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
        map.addControl(new maplibregl.AttributionControl({ compact: false }), 'bottom-left');

        let marker = null;

        function placeMarker(lat, lng, panZoom = true) {
            selectedLat = lat;
            selectedLng = lng;
            if (marker) {
                marker.setLngLat([lng, lat]);
            } else {
                marker = new maplibregl.Marker({ draggable: true, color: '#e91429' })
                    .setLngLat([lng, lat])
                    .addTo(map);
                marker.on('dragend', () => {
                    const pos = marker.getLngLat();
                    selectedLat = pos.lat;
                    selectedLng = pos.lng;
                });
            }
            if (panZoom) map.flyTo({ center: [lng, lat], zoom: 16 });
            clearLocationBtn.style.display = 'inline-block';
        }

        function clearLocation() {
            selectedLat = null;
            selectedLng = null;
            selectedVenueName = '';
            locationSearchInput.value = '';
            if (marker) {
                marker.remove();
                marker = null;
            }
            map.flyTo({ center: [172.8, -41.2], zoom: 4.6 });
            clearLocationBtn.style.display = 'none';
        }

        function hideSuggestions() {
            suggestionsBox.classList.remove('visible');
            suggestionsBox.innerHTML = '';
        }

        async function searchLocation(query) {
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(query)}`, {
                    headers: { 'Accept-Language': 'en' }
                });
                const results = await res.json();
                renderSuggestions(results);
            } catch (err) {
                hideSuggestions();
            }
        }

        function renderSuggestions(results) {
            if (!results || results.length === 0) {
                hideSuggestions();
                return;
            }
            suggestionsBox.innerHTML = '';
            results.forEach(r => {
                const item = document.createElement('div');
                item.className = 'location-suggestion-item';
                item.textContent = r.display_name;
                item.onclick = () => {
                    selectedVenueName = r.display_name;
                    locationSearchInput.value = r.display_name;
                    // Auto-fill Venue Name from the search result only if the
                    // admin hasn't already typed their own - never clobber a
                    // manual entry.
                    if (!venueNameInput.value.trim()) {
                        venueNameInput.value = r.display_name.split(',')[0];
                    }
                    placeMarker(parseFloat(r.lat), parseFloat(r.lon));
                    hideSuggestions();
                };
                suggestionsBox.appendChild(item);
            });
            suggestionsBox.classList.add('visible');
        }

        locationSearchInput.addEventListener('input', () => {
            clearTimeout(searchDebounceTimer);
            const query = locationSearchInput.value.trim();
            if (query.length < 3) { hideSuggestions(); return; }
            // Debounced so every keystroke doesn't hit Nominatim - their
            // usage policy expects light, non-hammering request rates.
            searchDebounceTimer = setTimeout(() => searchLocation(query), 500);
        });

        document.addEventListener('click', (e) => {
            if (!suggestionsBox.contains(e.target) && e.target !== locationSearchInput) {
                hideSuggestions();
            }
        });

        // ============================================================

        async function submitNewEvent() {
            const eventName = nameInput.value;
            const adminPassword = document.getElementById('input-password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('create-btn');
            errorMsg.style.display = 'none';

            if (!eventName.trim()) { errorMsg.textContent = 'Give your event a name.'; errorMsg.style.display = 'block'; return; }
            if (!adminPassword || adminPassword.length < 4) { errorMsg.textContent = 'Admin password must be at least 4 characters.'; errorMsg.style.display = 'block'; return; }

            btn.disabled = true;
            btn.textContent = 'Creating...';
            // A free-tier host can take 30-60s to wake up from a cold start
            // on the first request in a while - without this, that delay just
            // looks like the button did nothing.
            const slowNotice = setTimeout(() => {
                btn.textContent = 'Still working - waking up the server, this can take up to a minute...';
            }, 4000);
            try {
                // No slug in the request body anymore - the server generates
                // one from the event name, since it's now purely an internal
                // identifier rather than something guests type or get given.
                const body = { eventName, adminPassword };
                const venueName = venueNameInput.value.trim() || selectedVenueName;
                // Location is entirely optional - only sent if the admin
                // actually placed a pin.
                if (selectedLat !== null && selectedLng !== null) {
                    body.latitude = selectedLat;
                    body.longitude = selectedLng;
                    body.venueName = venueName;
                }
                const res = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                clearTimeout(slowNotice);
                let data;
                try {
                    data = await res.json();
                } catch (parseErr) {
                    throw new Error('Server sent back something unexpected.');
                }
                if (!res.ok) {
                    errorMsg.textContent = data.error || `Something went wrong (${res.status}).`;
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Create Event';
                    return;
                }
                if (!data.slug) {
                    throw new Error('Server did not return the new event URL.');
                }
                window.location.href = `/e/${data.slug}/admin`;
            } catch (err) {
                clearTimeout(slowNotice);
                console.error('Create event failed:', err);
                errorMsg.textContent = 'Could not reach the server. Check your connection and try again.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Create Event';
            }
        }

        function goToEvent() {
            const slug = slugify(document.getElementById('input-join-slug').value);
            if (!slug) return;
            window.location.href = `/e/${slug}/admin`;
        }
    </script>
</body>
</html>
